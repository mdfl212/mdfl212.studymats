  {q:'The intramuscular injection site for the gluteal region should be in which quadrant to avoid nerve injury?',opts:['Superomedial quadrant','Inferomedial quadrant','Superolateral quadrant','Inferolateral quadrant'],ans:2,exp:'The superolateral quadrant of the gluteal region is the safe zone for IM injections, avoiding the sciatic nerve and the superior and inferior gluteal vessels.',sys:'Nervous System'},
  {q:'A patient has sensory loss on the medial aspect of the thigh and weakness in thigh adduction. Which nerve is affected?',opts:['Femoral nerve','Obturator nerve','Sciatic nerve','Lateral femoral cutaneous nerve'],ans:1,exp:'The obturator nerve (L2–L4) innervates the adductor compartment and provides sensation to the medial thigh.',sys:'Nervous System'},
  {q:'Extension of the knee is primarily performed by which muscle group?',opts:['Hamstrings','Quadriceps femoris','Adductors','Iliopsoas'],ans:1,exp:'The quadriceps femoris (rectus femoris, vastus lateralis, vastus medialis, vastus intermedius) extends the knee. It is innervated by the femoral nerve.',sys:'Nervous System'},
  {q:'The popliteal fossa contains all of the following EXCEPT:',opts:['Popliteal artery','Tibial nerve','Common peroneal nerve','Femoral artery'],ans:3,exp:'The popliteal fossa contains the popliteal artery and vein, tibial nerve, and common peroneal nerve. The femoral artery becomes the popliteal artery after passing through the adductor hiatus.',sys:'Nervous System'},
  {q:'Damage to the superior gluteal nerve causes weakness in which muscles?',opts:['Gluteus maximus only','Gluteus medius, gluteus minimus, and tensor fasciae latae','Piriformis and obturator internus','Gluteus maximus and piriformis'],ans:1,exp:'The superior gluteal nerve (L4–S1) innervates gluteus medius, gluteus minimus, and tensor fasciae latae—the main hip abductors.',sys:'Nervous System'},
  {q:'The inferior gluteal nerve innervates which muscle?',opts:['Gluteus medius','Gluteus minimus','Gluteus maximus','Tensor fasciae latae'],ans:2,exp:'The inferior gluteal nerve (L5–S2) innervates the gluteus maximus, the prime extensor of the hip.',sys:'Nervous System'},
  {q:'A patient with meralgia paresthetica has sensory loss over the lateral thigh. Which nerve is involved?',opts:['Femoral nerve','Obturator nerve','Lateral femoral cutaneous nerve','Genitofemoral nerve'],ans:2,exp:'Meralgia paresthetica is caused by compression of the lateral femoral cutaneous nerve (L2–L3) as it passes under the inguinal ligament, causing numbness and paresthesia over the lateral thigh.',sys:'Nervous System'},
  {q:'Dorsiflexion and inversion of the foot are performed by which muscle?',opts:['Peroneus longus','Tibialis anterior','Extensor digitorum longus','Tibialis posterior'],ans:1,exp:'The tibialis anterior (innervated by the deep peroneal nerve) dorsiflexes and inverts the foot.',sys:'Nervous System'},
  {q:'Which nerve innervates the tibialis anterior muscle?',opts:['Superficial peroneal nerve','Deep peroneal nerve','Tibial nerve','Sural nerve'],ans:1,exp:'The deep peroneal nerve (anterior compartment) innervates the tibialis anterior, extensor digitorum longus, extensor hallucis longus, and peroneus tertius.',sys:'Nervous System'},
  {q:'Eversion of the foot is primarily controlled by which nerve?',opts:['Deep peroneal nerve','Tibial nerve','Superficial peroneal nerve','Sural nerve'],ans:2,exp:'The superficial peroneal nerve innervates peroneus longus and peroneus brevis, which evert the foot.',sys:'Nervous System'},
  {q:'The sciatic nerve is formed from which nerve roots?',opts:['L1–L4','L2–S1','L4–S3','L3–S2'],ans:2,exp:'The sciatic nerve arises from the lumbosacral plexus (L4–S3). It is the largest nerve in the body.',sys:'Nervous System'},
  {q:'The adductor canal (Hunter\'s canal) transmits which of the following?',opts:['Femoral artery, femoral vein, saphenous nerve','Femoral artery, obturator nerve, saphenous nerve','Popliteal artery, tibial nerve, sural nerve','Femoral artery, femoral nerve, profunda femoris'],ans:0,exp:'The adductor canal transmits the femoral artery, femoral vein, and saphenous nerve (branch of femoral nerve). The femoral artery exits as the popliteal artery after passing through the adductor hiatus.',sys:'Nervous System'},
  {q:'The femoral nerve is derived from which nerve roots?',opts:['L1–L3','L2–L4','L3–L5','L4–S1'],ans:1,exp:'The femoral nerve is derived from the posterior divisions of L2, L3, and L4.',sys:'Nervous System'},
  {q:'Loss of the patellar reflex (knee jerk) indicates a lesion at which spinal level?',opts:['L1–L2','L2–L3','L3–L4','L4–L5'],ans:2,exp:'The patellar reflex (knee jerk) is mediated by the femoral nerve at spinal level L3–L4. Loss of this reflex suggests a lesion at this level.',sys:'Nervous System'},
  {q:'The Achilles tendon reflex tests which spinal level?',opts:['L3–L4','L4–L5','L5–S1','S1–S2'],ans:3,exp:'The Achilles (ankle jerk) reflex tests the S1 nerve root (and sometimes S2). Loss suggests S1 radiculopathy.',sys:'Nervous System'},
  {q:'Which structure passes through the greater sciatic foramen BELOW the piriformis?',opts:['Superior gluteal vessels and nerve','Sciatic nerve, inferior gluteal nerve and vessels, pudendal nerve','Obturator nerve and vessels','Ilioinguinal nerve'],ans:1,exp:'Structures passing below piriformis: sciatic nerve, inferior gluteal nerve/artery, pudendal nerve, posterior femoral cutaneous nerve. Above piriformis: superior gluteal nerve/artery.',sys:'Nervous System'},
  {q:'The inferior rectus and superior oblique muscles are responsible for which eye movement?',opts:['Upward gaze','Lateral gaze','Downward gaze','Medial gaze'],ans:2,exp:'Downgaze is produced primarily by the inferior rectus (CN III) and the superior oblique (CN IV). This is why CN IV palsy impairs looking down and inward.',sys:'Nervous System'},
  {q:'Which cranial nerve innervates the superior oblique muscle?',opts:['CN III','CN IV','CN V','CN VI'],ans:1,exp:'CN IV (trochlear nerve) innervates the superior oblique. Mnemonic: SO4 (Superior Oblique = CN4).',sys:'Nervous System'},
  {q:'Which cranial nerve innervates the lateral rectus muscle?',opts:['CN III','CN IV','CN V','CN VI'],ans:3,exp:'CN VI (abducens nerve) innervates the lateral rectus. Mnemonic: LR6SO4 (Lateral Rectus = CN6, Superior Oblique = CN4).',sys:'Nervous System'},
  {q:'The parotid gland is traversed by which cranial nerve?',opts:['CN V3','CN VII (facial nerve)','CN IX','CN XII'],ans:1,exp:'The facial nerve (CN VII) passes through the parotid gland (but does not innervate it) and divides into its five terminal branches within the gland.',sys:'Nervous System'},
  {q:'The hypoglossal nerve (CN XII) innervates which structure?',opts:['Parotid gland','Intrinsic and extrinsic muscles of the tongue','Taste from anterior 2/3 of tongue','Pharyngeal constrictors'],ans:1,exp:'CN XII innervates all intrinsic and most extrinsic tongue muscles (except palatoglossus). Damage causes the tongue to deviate toward the side of the lesion.',sys:'Nervous System'},
  {q:'Which cranial nerve is responsible for the gag reflex (afferent limb)?',opts:['CN V','CN VII','CN IX','CN X'],ans:2,exp:'The afferent limb of the gag reflex is CN IX (glossopharyngeal), which innervates the posterior 1/3 of tongue and oropharynx. The efferent limb is CN X (vagus).',sys:'Nervous System'},
  {q:'The circle of Willis is formed by anastomoses between which arteries?',opts:['Internal carotid and vertebral arteries via communicating arteries','External carotid and internal jugular','Basilar and external carotid','Subclavian and vertebral arteries'],ans:0,exp:'The circle of Willis connects the internal carotid system (via anterior and middle cerebral arteries) and the vertebrobasilar system (via posterior cerebral arteries) through anterior and posterior communicating arteries.',sys:'Nervous System'},
  {q:'A patient after parotid surgery cannot wrinkle the forehead, cannot close the eye on one side, and has facial droop. Which nerve was damaged?',opts:['CN V','CN VII','CN IX','CN XII'],ans:1,exp:'CN VII (facial nerve) courses through the parotid gland. Its branches control all facial muscles of expression. Parotid surgery can injure branches causing complete ipsilateral facial nerve palsy.',sys:'Nervous System'},
  {q:'During lumbar puncture, the needle is typically inserted at which level to avoid the spinal cord?',opts:['L1–L2','L2–L3','L3–L4 or L4–L5','L5–S1'],ans:2,exp:'The spinal cord ends at the conus medullaris (L1–L2 in adults). Lumbar puncture is performed at L3–L4 or L4–L5 to enter the subarachnoid space (cauda equina) safely.',sys:'Nervous System'},
  {q:'The cauda equina contains which nerve roots?',opts:['Cervical nerve roots C1–C8','Thoracic nerve roots T1–T12','Lumbar, sacral, and coccygeal nerve roots','Lumbar roots only'],ans:2,exp:'The cauda equina (horse\'s tail) consists of lumbar, sacral, and coccygeal nerve roots descending below the conus medullaris (L1–L2) within the spinal canal.',sys:'Nervous System'},
  {q:'Which nerve is responsible for taste from the posterior 1/3 of the tongue?',opts:['Facial nerve (CN VII)','Glossopharyngeal nerve (CN IX)','Hypoglossal nerve (CN XII)','Lingual nerve (V3)'],ans:1,exp:'CN IX (glossopharyngeal) carries special visceral afferent (taste) fibers from the posterior 1/3 of the tongue. The facial nerve (CN VII via chorda tympani) serves the anterior 2/3.',sys:'Nervous System'},
  {q:'The pterion is the junction of which four bones and is clinically important because:',opts:['Frontal, parietal, temporal, sphenoid; overlies the middle meningeal artery','Parietal, occipital, temporal, sphenoid; overlies the sigmoid sinus','Frontal, parietal, occipital, temporal; marks the motor cortex','Ethmoid, frontal, parietal, temporal; overlies the superior sagittal sinus'],ans:0,exp:'The pterion is where the frontal, parietal, temporal, and sphenoid bones meet. It is the thinnest part of the skull and overlies the anterior division of the middle meningeal artery. Fracture can cause epidural hematoma.',sys:'Nervous System'},
  {q:'Which triangle of the neck contains the common carotid artery, internal jugular vein, and vagus nerve?',opts:['Posterior triangle','Submental triangle','Carotid triangle','Muscular triangle'],ans:2,exp:'The carotid triangle contains the carotid sheath with the common carotid artery, internal jugular vein, and vagus nerve (CN X).',sys:'Nervous System'},
  {q:'Brown-Séquard syndrome results from hemisection of the spinal cord. Which of the following is correct?',opts:['Ipsilateral motor loss and ipsilateral pain/temperature loss below the lesion','Ipsilateral motor loss, ipsilateral fine touch/proprioception loss, and contralateral pain/temperature loss','Bilateral motor loss and bilateral pain loss','Contralateral motor loss and ipsilateral pain loss'],ans:1,exp:'Brown-Séquard (hemisection): ipsilateral UMN signs + ipsilateral loss of vibration/proprioception (posterior column) + contralateral loss of pain and temperature (spinothalamic tract crosses at the level of entry).',sys:'Nervous System'},
  {q:'The conus medullaris (end of spinal cord) is located at which vertebral level in adults?',opts:['T12','L1–L2','L3–L4','L4–L5'],ans:1,exp:'In adults, the spinal cord ends at L1–L2 (conus medullaris). Below this, the cauda equina continues to lower levels.',sys:'Nervous System'},
  {q:'The left-right body axis during embryonic development is driven primarily by which signaling molecules?',opts:['Sonic hedgehog and BMP','Nodal and Pitx2','Wnt and FGF','Retinoic acid and Hox genes'],ans:1,exp:'Nodal (a TGF-β family member) promotes left-sided identity; Lefty inhibits and confines Nodal; Pitx2 is the downstream transcription factor driving left-sided organ development.',sys:'Nervous System'},
  {q:'Which cranial nerve carries parasympathetic fibers to the parotid gland?',opts:['CN VII','CN IX','CN X','CN V3'],ans:1,exp:'CN IX (glossopharyngeal nerve) provides parasympathetic innervation to the parotid gland via the lesser petrosal nerve → otic ganglion → auriculotemporal nerve (branch of V3).',sys:'Nervous System'},
  {q:'Which vertebral level has the spinal cord at the highest risk of ischemia due to being a \'watershed zone\'?',opts:['C5–C6','T1–T4','T4–T8','L1–L2'],ans:2,exp:'T4–T8 is a watershed zone for the spinal cord, receiving limited blood supply from the artery of Adamkiewicz (which is more variable). This region is at greatest risk during thoracic aortic surgery.',sys:'Nervous System'},
  {q:'A herniated intervertebral disc at L4–L5 most commonly compresses which nerve root?',opts:['L3','L4','L5','S1'],ans:2,exp:'A posterolateral herniation at L4–L5 compresses the L5 nerve root (which exits below L5 vertebra). L5 compression causes weakness of big toe dorsiflexion and lateral leg numbness.',sys:'Nervous System'},
  {q:'A herniated disc at L5–S1 compresses which nerve root?',opts:['L4','L5','S1','S2'],ans:2,exp:'Posterolateral herniation at L5–S1 compresses the S1 root. S1 compression causes loss of ankle reflex, plantarflexion weakness, and lateral foot numbness.',sys:'Nervous System'},
  {q:'Cauda equina syndrome classically presents with all of the following EXCEPT:',opts:['Bilateral leg weakness','Saddle anesthesia','Bowel/bladder dysfunction','Spastic paraplegia with hyperreflexia'],ans:3,exp:'Cauda equina syndrome is a lower motor neuron lesion; it presents with flaccid paralysis, areflexia, saddle anesthesia, and bowel/bladder dysfunction—NOT spastic paraplegia (which is an UMN sign).',sys:'Nervous System'},
  {q:'The nucleus pulposus is derived from which embryological structure?',opts:['Neural crest','Somites','Notochord','Lateral plate mesoderm'],ans:2,exp:'The nucleus pulposus is derived from the embryonic notochord. It forms the gelatinous center of each intervertebral disc.',sys:'Nervous System'},
  {q:'Which artery is the predominant blood supply to the lower thoracic and lumbar spinal cord?',opts:['Posterior spinal arteries','Artery of Adamkiewicz (great anterior radicular artery)','Anterior spinal artery (cervical segment)','Vertebral artery'],ans:1,exp:'The artery of Adamkiewicz (arises from T9–L2, usually on the left) is the major feeder of the anterior spinal artery in the thoracolumbar region.',sys:'Nervous System'},
  {q:'Intervertebral disc herniation most commonly occurs in which direction?',opts:['Anterior','Lateral','Posterior (posterolateral)','Superior (Schmorl\'s node)'],ans:2,exp:'The posterior longitudinal ligament is thinner and weaker than the anterior, so disc herniations most commonly occur posterolaterally, compressing nerve roots.',sys:'Nervous System'},
  {q:'A cerebellar lesion produces deficits that are:',opts:['Contralateral to the side of the lesion','Ipsilateral to the side of the lesion','Bilateral','In the lower extremities only'],ans:1,exp:'Cerebellar lesions are ipsilateral (the cerebellum projects ipsilaterally to the spinal cord and limbs), unlike cerebral cortex lesions which are contralateral.',sys:'Nervous System'},
  {q:'Broca\'s area (motor speech area) is located in which brain region?',opts:['Posterior superior temporal gyrus','Inferior frontal gyrus (Brodmann areas 44 and 45)','Postcentral gyrus','Supramarginal gyrus'],ans:1,exp:'Broca\'s area occupies Brodmann areas 44 and 45 in the inferior frontal gyrus of the dominant (usually left) hemisphere. Damage causes Broca\'s (expressive/non-fluent) aphasia.',sys:'Nervous System'},
  {q:'Wernicke\'s area (sensory speech area) is located in which brain region?',opts:['Inferior frontal gyrus','Posterior superior temporal gyrus (Brodmann area 22)','Precentral gyrus','Angular gyrus'],ans:1,exp:'Wernicke\'s area is in the posterior superior temporal gyrus (Brodmann area 22) of the dominant hemisphere. Damage causes Wernicke\'s (receptive/fluent) aphasia—fluent but meaningless speech.',sys:'Nervous System'},
  {q:'The dorsal columns of the spinal cord carry which modalities?',opts:['Pain and temperature','Crude touch and pressure','Vibration, proprioception, and fine (discriminative) touch','Motor commands'],ans:2,exp:'The dorsal (posterior) columns carry fine discriminative touch, vibration, and conscious proprioception. They ascend ipsilaterally and decussate in the medulla.',sys:'Nervous System'},
  {q:'The lateral spinothalamic tract carries which modalities, and decussates at which level?',opts:['Proprioception; decussates in the medulla','Pain and temperature; decussates at the spinal cord level of entry (within 1–2 segments)','Fine touch; decussates at the level of entry','Pain; decussates at the level of the thalamus'],ans:1,exp:'The lateral spinothalamic tract carries pain and temperature. Fibers cross (decussate) through the anterior commissure at or near their level of entry into the cord, ascending contralaterally.',sys:'Nervous System'},
  {q:'The internal capsule carries all of the following EXCEPT:',opts:['Corticospinal tract','Thalamocortical fibers','Corticobulbar tract','Spinothalamic tract ascending fibers at cortical level'],ans:3,exp:'The internal capsule carries corticospinal, corticobulbar, and thalamocortical fibers. The spinothalamic tract travels through the brainstem and thalamus, not primarily through the internal capsule.',sys:'Nervous System'},
  {q:'Upper motor neuron (UMN) lesions are characterized by:',opts:['Flaccid paralysis, fasciculations, muscle atrophy, hyporeflexia','Spastic paralysis, hyperreflexia, positive Babinski, increased tone','Flaccid paralysis, hyperreflexia, fasciculations','Spastic paralysis, hyporeflexia, no Babinski'],ans:1,exp:'UMN lesions (cortex to anterior horn) cause: spasticity, hyperreflexia, positive Babinski sign, clonus, and minimal muscle atrophy. LMN lesions cause flaccid paralysis and fasciculations.',sys:'Nervous System'},
  {q:'The middle cerebral artery (MCA) supplies which brain regions, and occlusion causes which deficits?',opts:['Lateral cortex: contralateral face and arm weakness/sensory loss > leg, aphasia (dominant hemisphere)','Medial cortex: contralateral leg weakness','Occipital lobe: contralateral homonymous hemianopia','Brainstem: cranial nerve palsies and contralateral hemiplegia'],ans:0,exp:'MCA occlusion causes contralateral face and arm > leg weakness/sensory loss, contralateral homonymous hemianopia, and aphasia (dominant) or neglect (non-dominant). MCA supplies lateral cortex.',sys:'Nervous System'},
  {q:'Which cranial nerve exits from the dorsal surface of the brainstem?',opts:['CN III','CN IV','CN VI','CN VII'],ans:1,exp:'CN IV (trochlear nerve) is the only cranial nerve to exit from the DORSAL surface of the brainstem (from the inferior colliculus). It also has the longest intracranial course.',sys:'Nervous System'},
  {q:'The substantia nigra is involved in which neurodegenerative disease, and what neurotransmitter is lost?',opts:['Alzheimer\'s disease; acetylcholine','Parkinson\'s disease; dopamine','Huntington\'s disease; GABA','ALS; glutamate'],ans:1,exp:'Parkinson\'s disease involves degeneration of dopaminergic neurons in the substantia nigra pars compacta, causing loss of dopamine in the striatum.',sys:'Nervous System'},
  {q:'Anterior spinal artery syndrome causes which pattern of deficits?',opts:['Ipsilateral loss of all modalities below the lesion','Loss of motor function, pain, and temperature bilaterally below the lesion; preserved vibration and proprioception','Brown-Séquard pattern','Loss of only proprioception and vibration'],ans:1,exp:'Anterior spinal artery syndrome destroys anterior 2/3 of cord: bilateral corticospinal tracts (motor loss) and lateral spinothalamic tracts (pain/temp loss), but spares the dorsal columns (vibration/proprioception preserved).',sys:'Nervous System'},
  {q:'The basal ganglia circuit is involved in which function, and which nucleus is most affected in Huntington\'s disease?',opts:['Motor learning and initiation; putamen','Voluntary movement control; caudate nucleus','Emotion regulation; globus pallidus','Sleep regulation; subthalamic nucleus'],ans:1,exp:'The basal ganglia are involved in voluntary motor control. Huntington\'s disease preferentially affects the caudate nucleus (along with putamen), causing loss of GABA-ergic neurons.',sys:'Nervous System'},
  {q:'Which brainstem structure is responsible for the coordination of eye movements and is affected in internuclear ophthalmoplegia (INO)?',opts:['Red nucleus','Medial longitudinal fasciculus (MLF)','Superior olivary nucleus','Substantia nigra'],ans:1,exp:'The medial longitudinal fasciculus (MLF) connects CN VI on one side to CN III on the other to coordinate lateral gaze. Demyelination (e.g., MS) of the MLF causes internuclear ophthalmoplegia.',sys:'Nervous System'},
  {q:'A patient with Wallenberg (lateral medullary) syndrome will present with which combination of deficits?',opts:['Ipsilateral facial pain/temperature loss + contralateral body pain/temperature loss + ipsilateral Horner\'s + dysphagia','Contralateral hemiplegia + ipsilateral CN III palsy','Ipsilateral facial weakness + contralateral arm/leg weakness','Bilateral arm weakness and bilateral Babinski'],ans:0,exp:'Wallenberg (PICA occlusion) syndrome: ipsilateral face pain/temp loss (V nucleus), contralateral body pain/temp loss (spinothalamic), ipsilateral Horner\'s, dysarthria, dysphagia, vertigo.',sys:'Nervous System'},
  {q:'A patient with a lesion of the left posterior limb of the internal capsule will have motor deficits on which side?',opts:['Left side','Right side','Both sides','No motor deficits'],ans:1,exp:'The corticospinal tract decussates in the medullary pyramids. A left internal capsule lesion produces right-sided spastic hemiplegia (contralateral to the lesion).',sys:'Nervous System'},
  {q:'Which type of aphasia is characterized by non-fluent speech, poor repetition, but relatively intact comprehension?',opts:['Wernicke\'s aphasia','Conduction aphasia','Broca\'s aphasia','Global aphasia'],ans:2,exp:'Broca\'s aphasia: non-fluent, effortful speech with intact comprehension. Patients know what they want to say but cannot produce it. Lesion in inferior frontal gyrus.',sys:'Nervous System'},
  {q:'Syringomyelia causes a characteristic \'cape-like\' distribution of sensory loss. Which modality is lost first, and why?',opts:['Proprioception; dorsal columns are compressed first','Pain and temperature in bilateral upper extremities; anterior commissure fibers are disrupted as the syrinx expands','Fine touch; spinothalamic decussation is interrupted','All modalities equally; the cord is uniformly compressed'],ans:1,exp:'A syrinx (fluid-filled cavity) expands centrally and disrupts the crossing spinothalamic fibers at the anterior commissure, causing bilateral loss of pain and temperature in the upper extremities (\'cape\' distribution). Dorsal columns (proprioception) are initially spared.',sys:'Nervous System'},
  {q:'The left-right body axis during embryonic development is established by which key signaling pathway first activated at the node?',opts:['Nodal (TGF-β family) is expressed on the LEFT, establishing left-sided identity','BMP-4 expression on the right establishes right identity','Sonic hedgehog acts bilaterally to establish symmetry','Wnt signaling establishes left-right asymmetry independent of cilia'],ans:0,exp:'Nodal cilia at the node create leftward fluid flow → Nodal expression on the LEFT → activates Pitx2 (transcription factor for left-sided organogenesis). Lefty inhibits and confines Nodal signaling.',sys:'Nervous System'},
  {q:'The nucleus pulposus of the intervertebral disc is a remnant of which embryologic structure?',opts:['Somites','Notochord','Neural crest','Lateral plate mesoderm'],ans:1,exp:'The nucleus pulposus is a remnant of the embryonic notochord, which induces neural tube development and serves as the initial axial skeleton scaffold.',sys:'Nervous System'},
  {q:'Which dermatome corresponds to the umbilicus (a key landmark for dermatome mapping)?',opts:['T6','T8','T10','T12'],ans:2,exp:'T10 corresponds to the umbilicus. T4 = nipple, T6 = xiphoid, T10 = umbilicus, T12 = inguinal fold, L1 = inguinal ligament, L4 = knee.',sys:'Nervous System'},
  {q:'Phalen\'s test (holding wrists in forced flexion) reproduces symptoms in which condition?',opts:['De Quervain\'s tenosynovitis','Carpal tunnel syndrome','Dupuytren\'s contracture','Trigger finger'],ans:1,exp:'Phalen\'s test compresses the carpal tunnel by forced wrist flexion for 60 seconds, reproducing median nerve symptoms (numbness/tingling in lateral 3½ fingers) in carpal tunnel syndrome.',sys:'Nervous System'},
  {q:'A patient presents with \'Saturday night palsy\'—wrist drop after sleeping with the arm over a chair back. Which nerve is compressed, and at which specific location?',opts:['Ulnar nerve at the cubital tunnel','Radial nerve in the spiral groove of the humerus','Median nerve at the carpal tunnel','Axillary nerve at the surgical neck of the humerus'],ans:1,exp:'Saturday night palsy compresses the radial nerve in the spiral groove (mid-humerus), typically from prolonged pressure against the humerus. It causes wrist drop and sensory loss over the dorsum of the hand, sparing the brachioradialis and sensation over the posterior arm (branches arise more proximally).',sys:'Nervous System'},
  {q:'A newborn has an open neural tube defect at the lumbar level with exposed spinal cord. Which embryonic event failed?',opts:['Gastrulation','Neurulation (fusion of neural folds)','Somitogenesis','Lateral folding','Cephalic folding'],ans:1,exp:'Myelomeningocele (spina bifida cystica) results from failure of neural fold fusion during neurulation (3rd–4th week). The neural tube fails to close, leaving the spinal cord exposed.',sys:'Nervous System'},
  {q:'A neonate has anencephaly. Which embryonic failure is responsible?',opts:['Failure of caudal neural tube closure','Failure of rostral (anterior) neural tube closure','Failure of notochord formation','Failure of neural crest migration','Failure of prosencephalon division'],ans:1,exp:'Anencephaly results from failure of the anterior (rostral) neuropore to close by day 25. The brain and calvarium fail to develop. Maternal folic acid deficiency is a major risk factor.',sys:'Nervous System'},
  {q:'The apical ectodermal ridge (AER) drives limb bud outgrowth. If the AER is removed, what results?',opts:['Limb develops normally','Limb is truncated at the level corresponding to the developmental stage','Limb bifurcates','Digit duplication occurs','Limb rotates 90 degrees'],ans:1,exp:'The AER provides signals (FGFs) for proximal-to-distal outgrowth of the limb bud. Removal at any stage truncates the limb at the level of development reached at that point (proximal structures already formed, distal ones absent).',sys:'Nervous System'},
  {q:'The zone of polarizing activity (ZPA) at the posterior limb bud margin establishes which axis?',opts:['Proximal-distal axis','Dorsal-ventral axis','Anterior-posterior (thumb-to-little finger) axis','Medial-lateral axis','Superior-inferior axis'],ans:2,exp:'The zone of polarizing activity (ZPA) secretes Sonic Hedgehog (Shh) to establish the anterior-posterior (pre-axial to post-axial / thumb to little finger) axis of limb development.',sys:'Nervous System'},
  {q:'Which embryonic structure gives rise to the epithelium of both the anterior 2/3 and posterior 1/3 of the tongue?',opts:['1st pharyngeal arch for entire tongue','1st arch (anterior 2/3) and 3rd arch (posterior 1/3)','2nd arch for anterior 2/3 and 4th arch for posterior 1/3','3rd arch for entire tongue','Neural crest cells for the entire tongue'],ans:1,exp:'The anterior 2/3 of the tongue epithelium arises from the 1st pharyngeal arch (innervated by V3 for general sensation, VII for taste via chorda tympani). The posterior 1/3 arises from the 3rd arch (innervated by IX for both sensation and taste).',sys:'Nervous System'},
  {q:'A 55-year-old man has ipsilateral Horner syndrome, contralateral loss of pain and temperature, ipsilateral ataxia, and ipsilateral facial pain and temperature loss. Which syndrome is this?',opts:['Weber syndrome','Millard-Gubler syndrome','Wallenberg (lateral medullary) syndrome','Brown-Séquard syndrome','Locked-in syndrome'],ans:2,exp:'Wallenberg syndrome (lateral medullary/PICA syndrome): ipsilateral Horner\'s (sympathetic chain), ipsilateral facial pain/temp loss (spinal trigeminal nucleus), contralateral body pain/temp loss (spinothalamic tract), ipsilateral ataxia (inferior cerebellar peduncle), dysphagia (nucleus ambiguus).',sys:'Nervous System'},
  {q:'A 45-year-old man has a T6 spinal cord hemisection. On the right: loss of fine touch and vibration; on the left: loss of pain and temperature below T6. Which syndrome is this?',opts:['Anterior cord syndrome','Central cord syndrome','Posterior cord syndrome','Brown-Séquard syndrome','Complete transection'],ans:3,exp:'Brown-Séquard syndrome (hemisection): ipsilateral loss of fine touch, vibration, and proprioception (dorsal columns); ipsilateral UMN signs (corticospinal tract); contralateral loss of pain and temperature (spinothalamic tract, which crosses within 1–2 levels of entry).',sys:'Nervous System'},
  {q:'A 40-year-old with acute cervical disc herniation has bilateral arm weakness worse than leg weakness, with a cape-like loss of pain and temperature over the shoulders. Which spinal cord syndrome is this?',opts:['Brown-Séquard','Anterior cord','Central cord syndrome','Posterior cord','Conus medullaris'],ans:2,exp:'Central cord syndrome: injury to the central gray matter and adjacent crossing spinothalamic fibers. Upper extremity weakness > lower extremity (arm fibers more central in corticospinal tract), cape-like bilateral loss of pain/temp (crossing fibers), bladder dysfunction. Most common in elderly with cervical spondylosis.',sys:'Nervous System'},
  {q:'A 30-year-old diver sustains a hyperflexion injury and has bilateral loss of motor function and pain/temperature sensation below the level, with preserved proprioception. Which syndrome?',opts:['Central cord syndrome','Anterior cord syndrome','Brown-Séquard syndrome','Posterior cord syndrome','Cauda equina syndrome'],ans:1,exp:'Anterior cord syndrome: damage to the anterior two-thirds of the spinal cord (corticospinal and spinothalamic tracts), sparing the dorsal columns. Bilateral loss of motor function and pain/temperature with preserved fine touch, vibration, and proprioception.',sys:'Nervous System'},
  {q:'The dorsal (posterior) column–medial lemniscal pathway carries which sensory modalities?',opts:['Pain and temperature','Crude touch only','Fine touch, vibration, proprioception, and 2-point discrimination','Pain and proprioception','All sensory modalities equally'],ans:2,exp:'The dorsal column–medial lemniscal system carries fine (discriminative) touch, vibration, proprioception, and 2-point discrimination. Fibers ascend ipsilaterally in the dorsal columns and decussate in the medulla at the level of the nucleus gracilis/cuneatus.',sys:'Nervous System'},
  {q:'The spinothalamic tract carries which sensory modalities and where does it decussate?',opts:['Fine touch; decussates in the medulla','Pain and temperature; decussates within 1–2 spinal levels of entry (anterior white commissure)','Proprioception; decussates in the pons','Vibration; decussates in the thalamus','All modalities; does not decussate'],ans:1,exp:'The lateral spinothalamic tract carries pain and temperature. Afferents synapse in the dorsal horn, then cross in the anterior white commissure within 1–2 spinal segments before ascending in the contralateral lateral funiculus to the thalamus.',sys:'Nervous System'},
  {q:'A 60-year-old diabetic has a cervical myelopathy causing bilateral leg spasticity and hyperreflexia. Which tract is most affected?',opts:['Dorsal columns','Spinocerebellar tracts','Lateral corticospinal tracts','Spinothalamic tracts','Rubrospinal tracts'],ans:2,exp:'Bilateral spasticity and hyperreflexia (UMN signs) below the lesion indicate bilateral lateral corticospinal tract compression — the hallmark of cervical myelopathy.',sys:'Nervous System'},
  {q:'Syringomyelia causes a cape-like loss of pain and temperature with preserved touch. Which fibers are disrupted first?',opts:['Dorsal column fibers','Lateral corticospinal tract fibers','Anterior white commissure crossing spinothalamic fibers','Posterior spinocerebellar tract','Medial lemniscal fibers'],ans:2,exp:'Syringomyelia expands from within the central canal, first disrupting the anterior white commissure where pain and temperature fibers cross — causing a bilateral, symmetric, cape-like (shawl) distribution of loss. Dorsal columns are spared until late.',sys:'Nervous System'},
  {q:'Which thalamic nucleus relays pain and temperature from the face?',opts:['VPL (ventral posterolateral)','VPM (ventral posteromedial)','Lateral geniculate','Medial geniculate','Pulvinar'],ans:1,exp:'The VPM (ventral posteromedial) nucleus of the thalamus relays pain, temperature, and tactile sensation from the face (via trigeminal pathway). VPL relays the same modalities from the body.',sys:'Nervous System'},
  {q:'A 25-year-old has severe low back pain after a fall. MRI shows massive L4–L5 disc herniation compressing multiple nerve roots. He has perianal numbness, urinary retention, and bilateral leg weakness with absent reflexes. What is this syndrome?',opts:['Conus medullaris syndrome','Cauda equina syndrome','Complete cord transection at L4','Central cord syndrome','Anterior cord syndrome'],ans:1,exp:'Cauda equina syndrome (compression of the nerve roots below L1–L2 where the cord ends) presents with LMN signs: flaccid paralysis, areflexia, saddle anesthesia (S3–S5), and sphincter dysfunction (urinary retention, fecal incontinence). A surgical emergency.',sys:'Nervous System'},
  {q:'The gracile fasciculus carries proprioception from which part of the body?',opts:['Upper limb and trunk above T6','Lower limb and trunk below T6','Face','Upper limb only','Trunk only'],ans:1,exp:'The gracile fasciculus (medial dorsal column) carries fine touch, vibration, and proprioception from the lower limb and trunk below T6. The cuneate fasciculus (lateral dorsal column) carries the same from the upper limb and trunk above T6.',sys:'Nervous System'},
  {q:'At which anatomical level do approximately 85% of corticospinal tract fibers cross to the contralateral side?',opts:['Posterior limb of the internal capsule','Basis pedunculi of the midbrain','Caudal medulla at the medullospinal junction','Pontine tegmentum','Cervical spinal cord at C1'],ans:2,exp:'The corticospinal tract fibers decussate at the pyramidal decussation at the caudal medulla (medullospinal junction), where approximately 85% cross to form the lateral corticospinal tract. The remaining 15% descend ipsilaterally as the anterior corticospinal tract.',sys:'Nervous System'},
  {q:'A 70-year-old man has a lesion of the right internal capsule. Which side of the body shows contralateral UMN signs?',opts:['Right side (ipsilateral)','Left side (contralateral)','Bilateral','Neither','Only the face'],ans:1,exp:'A right internal capsule lesion interrupts the corticospinal fibers before they decussate at the pyramidal decussation. The resulting UMN signs (spasticity, hyperreflexia, Babinski sign) appear contralaterally (left side of the body). The face shows contralateral lower face weakness (upper motor neuron facial palsy).',sys:'Nervous System'},
  {q:'A 50-year-old woman has carpal tunnel syndrome. Which nerve is compressed, and at which location?',opts:['Ulnar nerve at Guyon\'s canal','Median nerve under the flexor retinaculum (transverse carpal ligament)','Radial nerve at the radial groove','Anterior interosseous nerve at the pronator teres','Ulnar nerve at the cubital tunnel'],ans:1,exp:'Carpal tunnel syndrome involves compression of the median nerve under the flexor retinaculum (transverse carpal ligament) at the wrist, causing thenar atrophy, loss of opposition, and sensory loss in the lateral 3.5 digits.',sys:'Nervous System'},
  {q:'Which muscle is the only flexor of the distal interphalangeal joint of the index finger supplied exclusively by the median nerve?',opts:['Flexor digitorum superficialis','Flexor digitorum profundus (lateral half — index and middle)','Lumbricals','Flexor pollicis longus','Palmar interossei'],ans:1,exp:'The lateral half of flexor digitorum profundus (supplying the index and middle finger DIP flexion) is innervated by the anterior interosseous nerve (branch of median nerve). Testing FDP of the index finger specifically tests the median nerve at the forearm level.',sys:'Nervous System'},
  {q:'A 40-year-old woman has a winging of the scapula. Which nerve is injured and which muscle is denervated?',opts:['Suprascapular nerve; supraspinatus','Long thoracic nerve; serratus anterior','Thoracodorsal nerve; latissimus dorsi','Axillary nerve; deltoid','Accessory nerve; trapezius'],ans:1,exp:'Medial (classic) scapular winging is caused by injury to the long thoracic nerve (C5–C7), denervating the serratus anterior. The scapula loses its stabilization against the chest wall and \'wings\' posteromedially, especially on shoulder elevation.',sys:'Nervous System'},
  {q:'A 20-year-old rugby player has an anterior shoulder dislocation. Which nerve is most at risk?',opts:['Radial nerve','Musculocutaneous nerve','Axillary nerve','Median nerve','Suprascapular nerve'],ans:2,exp:'The axillary nerve passes posterior to the surgical neck of the humerus and through the quadrangular space. It is the most commonly injured nerve in anterior shoulder dislocations, causing deltoid weakness and loss of sensation over the \'regimental badge\' area of the lateral upper arm.',sys:'Nervous System'},
  {q:'Thoracic outlet syndrome most commonly compresses which component of the brachial plexus?',opts:['Upper trunk (C5–C6)','Middle trunk (C7)','Lower trunk (C8–T1)','Lateral cord','Medial cord'],ans:2,exp:'Thoracic outlet syndrome most commonly compresses the lower trunk (C8–T1), producing wasting of the intrinsic hand muscles, sensory loss in the medial forearm and hand (ulnar distribution), and ipsilateral Horner\'s syndrome if sympathetic fibers are involved.',sys:'Nervous System'},
  {q:'A patient has an Erb-Duchenne palsy after a difficult birth. Which nerve roots are involved, and what is the classic posture?',opts:['C8–T1; claw hand','C5–C6; \'waiter\'s tip\' posture (arm internally rotated, extended, pronated, wrist flexed)','C7; wrist drop','C5–C7; winged scapula','T1; Horner syndrome only'],ans:1,exp:'Erb-Duchenne palsy (C5–C6 injury) from excessive lateral flexion/traction: deltoid, supraspinatus, infraspinatus, teres minor, biceps, and brachioradialis denervation → \'waiter\'s tip\' posture (arm adducted, internally rotated, extended, forearm pronated, wrist flexed).',sys:'Nervous System'},
  {q:'A 35-year-old runner has lower leg pain and weakness on dorsiflexion after prolonged exercise. Pressure in the anterior compartment is elevated. Which nerve is at risk in anterior compartment syndrome of the leg?',opts:['Superficial fibular nerve','Common fibular nerve','Deep fibular nerve','Tibial nerve','Sural nerve'],ans:2,exp:'The anterior compartment of the leg contains the deep fibular nerve. Compartment syndrome compresses this nerve, causing foot drop (loss of dorsiflexion) and loss of sensation in the first web space.',sys:'Nervous System'},
  {q:'A 65-year-old man has tarsal tunnel syndrome causing burning pain on the medial foot and sole. Which nerve is compressed?',opts:['Deep fibular nerve','Superficial fibular nerve','Sural nerve','Tibial nerve in the tarsal tunnel','Saphenous nerve'],ans:3,exp:'Tarsal tunnel syndrome involves compression of the tibial nerve (or its branches: medial and lateral plantar nerves) as it passes through the tarsal tunnel (flexor retinaculum) posterior to the medial malleolus.',sys:'Nervous System'},
  {q:'The L4 dermatome corresponds to which surface area for clinical testing?',opts:['Posterior thigh','Dorsum of foot and great toe','Medial leg and medial malleolus','Lateral foot and little toe','Posterior calf'],ans:2,exp:'The L4 dermatome covers the medial leg and medial malleolus. The L4 myotome tests knee extension (quadriceps) and ankle dorsiflexion/inversion. Loss of the patellar reflex indicates L4 involvement.',sys:'Nervous System'},
  {q:'Which dermatome covers the dorsum of the foot and great toe, and is tested by which reflex?',opts:['L3; patellar reflex','L4; patellar reflex','L5; no reliable reflex (tibialis posterior)','S1; Achilles reflex','L5; Achilles reflex'],ans:2,exp:'L5 dermatomal territory includes the dorsum of the foot and great toe. The L5 myotome tests great toe extension (extensor hallucis longus) and foot eversion. There is no reliable deep tendon reflex for L5 (the posterior tibialis reflex is inconsistent).',sys:'Nervous System'},
  {q:'Which dermatome covers the lateral foot and little toe, and corresponds to which reflex?',opts:['L4; patellar reflex','L5; no reliable reflex','S1; Achilles (ankle jerk) reflex','S2; bulbocavernosus reflex','L3; adductor reflex'],ans:2,exp:'S1 supplies the lateral foot, little toe, and posterior calf. The Achilles (ankle jerk) reflex tests S1. Loss of S1 indicates L5–S1 disc herniation (the most common level), causing plantar flexion weakness and diminished Achilles reflex.',sys:'Nervous System'},
  {q:'Which muscle\'s dysfunction causes a Trendelenburg gait (pelvis drops on the contralateral side during single-leg stance)?',opts:['Gluteus maximus','Gluteus medius and minimus (superior gluteal nerve)','Tensor fascia lata','Piriformis','Biceps femoris'],ans:1,exp:'Trendelenburg gait: failure of the gluteus medius and minimus (superior gluteal nerve, L4–S1) to stabilize the pelvis causes the unsupported side to drop during single-leg stance. The body compensates by shifting the trunk over the affected limb (compensated Trendelenburg).',sys:'Nervous System'},
  {q:'A 55-year-old man wakes up with complete right-sided facial weakness involving the forehead, inability to close his eye, and drooping of the corner of his mouth. Which type of lesion explains equal involvement of the upper and lower face?',opts:['Upper motor neuron cortical lesion','Lower motor neuron peripheral nerve lesion','Lesion at the facial nerve nucleus only','Fascicular lesion at the genu of the facial nerve','Bilateral cortical infarction'],ans:1,exp:'Lower motor neuron (LMN) lesion of CN VII (Bell\'s palsy) causes ipsilateral complete facial weakness including forehead (frontalis), eye closure (orbicularis oculi), and lower face. UMN lesions spare the forehead (bilateral cortical representation).',sys:'Nervous System'},
  {q:'The cavernous sinus contains which cranial nerves and other structures?',opts:['CN III, IV, V1, V2, VI; internal carotid artery','CN III, IV, V1, V2, VI, internal carotid artery, and sympathetic plexus around ICA','CN V1, V2, V3, VII, and internal carotid artery','CN III, IV, V, VI, VII, and internal jugular vein','CN III, V1, V2, and vertebral artery'],ans:1,exp:'The cavernous sinus contains: CN III (oculomotor), CN IV (trochlear), CN V1 (ophthalmic), CN V2 (maxillary) — in lateral wall; CN VI (abducens) — runs through the sinus adjacent to the ICA; and the internal carotid artery with its sympathetic plexus. CN VI is most vulnerable to mass lesions within the sinus.',sys:'Nervous System'},
  {q:'Which dural venous sinus runs in the superior border of the tentorium cerebelli and drains into the confluence of sinuses?',opts:['Superior sagittal sinus','Inferior sagittal sinus','Straight sinus','Transverse sinus','Sigmoid sinus'],ans:3,exp:'The transverse sinuses run in the attached margin of the tentorium cerebelli from the confluence of sinuses (torcula Herophili) to the sigmoid sinuses, which drain into the internal jugular veins at the jugular foramina.',sys:'Nervous System'},
  {q:'In the SCALP mnemonic, one layer is considered the \'danger zone\' because infections there can spread intracranially via valveless emissary veins. Which layer is this?',opts:['Skin','Connective tissue (dense subcutaneous)','Aponeurosis (epicranial/galea)','Loose areolar tissue','Pericranium'],ans:3,exp:'The loose areolar tissue (4th layer of SCALP) is the \'danger zone\' — infections spread freely through this layer and can drain via emissary veins (which have no valves) into the intracranial dural sinuses, risking cavernous sinus thrombosis or meningitis.',sys:'Nervous System'},
  {q:'The contents of the superior orbital fissure include which cranial nerves?',opts:['CN II, III, IV, V1, VI','CN III, IV, V1 (ophthalmic), VI, superior ophthalmic vein, sympathetic fibers','CN II and V1 only','CN III, IV, V2, VI','CN II, VI, and sympathetic fibers'],ans:1,exp:'Superior orbital fissure transmits: CN III (oculomotor), CN IV (trochlear), CN V1 — nasociliary and frontal branches (ophthalmic), CN VI (abducens), superior ophthalmic vein, and sympathetic fibers. The optic canal separately transmits CN II and ophthalmic artery.',sys:'Nervous System'},
  {q:'A patient has a \'blown pupil\' (fixed dilated pupil) after head trauma with a subdural hematoma. Which cranial nerve is compressed by uncal herniation?',opts:['CN II at the optic chiasm','CN III (oculomotor) at the tentorial notch','CN VI in the cavernous sinus','CN IV at the trochlear notch','CN V at the trigeminal cave'],ans:1,exp:'Uncal herniation compresses CN III (oculomotor nerve) at the tentorial notch, interrupting parasympathetic fibers (which run on the outside of the nerve) first — causing ipsilateral mydriasis (blown pupil) before motor deficits. This is a neurosurgical emergency.',sys:'Nervous System'},
  {q:'A patient was accidentally hit by a car on his left leg. He now comes to the clinic complaining of loss of sensation on the dorsal aspect of his left foot and inability to lift the foot while walking resulting to a \'steppage gait\'. What is the most likely injured nerve?',opts:['Tibial nerve','Superior gluteal nerve','Common peroneal nerve','Inferior gluteal nerve'],ans:2,exp:'Injury to the common peroneal nerve leads to foot drop (\'steppage gait\') and loss of dorsal foot sensation. Mnemonic: PED (Peroneal Everts and Dorsiflexes).',sys:'Nervous System'},
  {q:'A patient was brought to the ER for a possible disc herniation. On examination, there was noted weakness of knee extension and decreased patellar reflex. What is the most likely nerve root affected?',opts:['L4','L5','S1','S2'],ans:0,exp:'Disc herniation that affects the L4 nerve root leads to weakness of knee extension and decreased patellar reflex.',sys:'Nervous System'},
  {q:'Injury to the surgical neck of the humerus will damage which of the following nerves?',opts:['Long thoracic','Axillary','Radial','Median'],ans:1,exp:'Injury to the surgical neck of the humerus leads to injury of the axillary nerve and posterior circumflex artery.',sys:'Nervous System'},
  {q:'What artery is involved with injury to the midshaft of the humerus?',opts:['Deep brachial','Posterior circumflex','Lateral thoracic','Brachial'],ans:0,exp:'Injury to the midshaft of the humerus injures the radial nerve and deep brachial artery.',sys:'Nervous System'},
  {q:'An elderly patient with osteoporosis suffers a right posterior hip dislocation. Which of the following nerves is most likely injured in this case?',opts:['Tibial nerve','Inferior gluteal nerve','Pudendal nerve','Common peroneal nerve'],ans:1,exp:'The inferior gluteal nerve innervates the gluteus maximus and is associated with posterior hip dislocations.',sys:'Nervous System'},
  {q:'Cerebrospinal fluid made in the choroid plexus flows into the 4th ventricle from the 3rd ventricle via the',opts:['Foramina of Luschka','Foramina of Magendie','Aqueduct of Sylvius','Foramina of Monro'],ans:2,exp:'CSF flow: Lateral ventricles -> Foramina of Monro -> 3rd ventricle -> Aqueduct of Sylvius -> 4th ventricle.',sys:'Nervous System'},
  {q:'Taste sensation from the anterior 2/3 of the tongue is carried by which of the following cranial nerves?',opts:['CN V','CN VII','CN IX','CN X'],ans:1,exp:'Taste from the anterior 2/3 of the tongue is carried by chorda tympani which is a branch of CN VII.',sys:'Nervous System'},
  {q:'The following are the contents of the carotid sheath, EXCEPT?',opts:['Internal carotid arteries','Internal jugular vein','External jugular vein','Vagus nerve'],ans:2,exp:'The contents of the carotid sheath are: Common and internal carotid arteries, Internal jugular vein, and Vagus nerve. The external jugular vein is not inside the sheath.',sys:'Nervous System'},
  {q:'The 5 secondary vesicles are the telencephalon, diencephalon, mesencephalon, metencephalon, and myelencephalon. The basal ganglia develops from which of those 5?',opts:['Telencephalon','Diencephalon','Mesencephalon','Metencephalon'],ans:0,exp:'Telencephalon forms the cerebral hemispheres and basal ganglia.',sys:'Nervous System'},
  {q:'What is the largest and most abundant glial cell in the CNS?',opts:['Astrocytes','Neurons','Microglia','Ependymal cell'],ans:0,exp:'Astrocytes are the largest and most abundant glial cells in the central nervous system.',sys:'Nervous System'},
  {q:'Which of the following cells originated from the mesoderm?',opts:['Microglia','Astrocytes','Oligodendrocytes','Schwann cells'],ans:0,exp:'Microglia originate from the mesoderm. Astrocytes and oligodendrocytes originate from neural tube (ectoderm).',sys:'Nervous System'},
  {q:'Which of the following tracts in the spinal cord is responsible for voluntary and motor function?',opts:['Corticospinal tracts','Dorsal column','Anterior spinothalamic tract','None of the above'],ans:0,exp:'The corticospinal tracts are responsible for voluntary motor function.',sys:'Nervous System'},
  {q:'Which hypothalamic area is involved in increasing appetite?',opts:['Anterior','Posterior','Lateral','All of the above'],ans:2,exp:'The lateral area of the hypothalamus is known as the hunger center and is involved in increasing appetite.',sys:'Nervous System'},
  {q:'An infection in which layer of the scalp is associated with increased risk of spreading to the intracranial sinuses via the emissary veins?',opts:['Skin','Dense connective tissue layer','Galea aponeurotica','Loose connective tissue layer'],ans:3,exp:'The loose connective tissue layer of the scalp is the \'danger zone\' where infection can spread to intracranial sinuses via emissary veins.',sys:'Nervous System'},
  {q:'A fracture sustained at the thinnest area of the lateral skull will result in rupture of which of the following vessels?',opts:['Aneurysmal vessel','Middle meningeal artery','Bridging veins','Charcot-Bouchard microaneurysms'],ans:1,exp:'The pterion is the thinnest part of the lateral skull. A fracture here can rupture the middle meningeal artery resulting in an epidural hematoma.',sys:'Nervous System'},
  {q:'Eliciting the patellar reflex results in contraction of which muscle?',opts:['Calves','Quadriceps femoris','Hamstring muscles','Gluteus maximus'],ans:1,exp:'Eliciting the patellar reflex results in contraction of the quadriceps femoris.',sys:'Nervous System'},
  {q:'Dislocation of which of the following carpal bones is associated with carpal tunnel syndrome?',opts:['Scaphoid','Hamate','Lunate','Trapezoid'],ans:2,exp:'Lunate dislocation can impinge the median nerve, leading to carpal tunnel syndrome.',sys:'Nervous System'},
  {q:'The \'Hand of Benediction\' sign, which occurs when the patient attempts to make a fist, is a manifestation of a lesion in which of the following?',opts:['Proximal median nerve','Distal median nerve','Proximal ulnar nerve','Distal ulnar nerve'],ans:0,exp:'A proximal median nerve lesion presents as a \'Hand of Benediction\' when attempting to make a fist.',sys:'Nervous System'},
  {q:'Cavernous sinus thrombosis from an infection will affect all of the following structures, EXCEPT?',opts:['CN II','CN III','CN IV','CN V'],ans:0,exp:'CN II does not pass through the cavernous sinus. Structures that do pass include CN III, IV, V1, V2, VI, and the internal carotid artery.',sys:'Nervous System'},
  {q:'The presence of Wernicke aphasia is attributed to a stroke in what artery?',opts:['Anterior cerebral','Middle cerebral','Posterior cerebral','Basilar'],ans:1,exp:'An MCA (Middle Cerebral Artery) stroke most likely presents with Wernicke aphasia if it affects the dominant temporal lobe.',sys:'Nervous System'},
  {q:'The chorda tympani nerve carries which functional component?',opts:['Special visceral afferent (taste from posterior 1/3 of tongue)','General somatic afferent (touch to anterior ear)','General visceral efferent (parasympathetics to submandibular/sublingual glands) + taste from anterior 2/3 of tongue','Special visceral efferent (motor to stylohyoid)'],ans:2,exp:'The chorda tympani (branch of CN VII) carries taste from the anterior 2/3 of tongue and parasympathetic fibers to the submandibular and sublingual glands.',sys:'Special Senses'},
  {q:'The Meibomian glands are located where, and their infection causes which type of stye?',opts:['At the eyelash follicles; external hordeolum','Within the tarsal plate; internal hordeolum (deeper, toward conjunctival side)','In the lacrimal sac; dacryocystitis','At the lid margin; chalazion'],ans:1,exp:'Meibomian glands are embedded in the tarsal plate. Infection causes an internal hordeolum/stye, which presents as a deeper swelling toward the conjunctival side of the eyelid.',sys:'Special Senses'},
  {q:'The glands of Zeis are associated with which infection?',opts:['Internal hordeolum','Chalazion','External hordeolum (stye)','Dacryoadenitis'],ans:2,exp:'Glands of Zeis are sebaceous glands associated with eyelash follicles. Their infection causes an external hordeolum (stye), which presents as superficial swelling near the eyelashes.',sys:'Special Senses'},
  {q:'Injury to the right optic tract causes which visual field defect?',opts:['Right monocular blindness','Bitemporal hemianopia','Left homonymous hemianopia','Right nasal hemianopia'],ans:2,exp:'The right optic tract contains fibers from the temporal retina of the right eye and nasal retina of the left eye, representing the left visual field. Lesion causes left homonymous hemianopia.',sys:'Special Senses'},
  {q:'The Edinger-Westphal nucleus provides parasympathetic innervation for which reflex?',opts:['Corneal reflex','Pupillary light reflex (miosis)','Accommodation reflex (lens)','Salivation','Lacrimation'],ans:1,exp:'The Edinger-Westphal (accessory oculomotor) nucleus is the preganglionic parasympathetic nucleus for the ciliary ganglion, mediating pupillary constriction (miosis) via the pupillary light reflex. It also contributes to accommodation.',sys:'Special Senses'},
  {q:'A 68-year-old hypertensive man develops an acute ipsilateral CN III palsy (ptosis, dilated pupil, eye deviated down and out) and contralateral hemiplegia. Where is the lesion?',opts:['Pons at the level of CN VI and VII','Lateral medulla involving PICA territory','Midbrain at the level of the cerebral peduncle','Thalamus involving VPL and VPM','Posterior limb of the internal capsule'],ans:2,exp:'Weber syndrome results from a midbrain lesion involving the CN III fascicles (ipsilateral oculomotor palsy) and the adjacent cerebral peduncle (corticospinal tract — contralateral hemiplegia).',sys:'Special Senses'},
  {q:'Which cranial nerve provides the afferent limb of the corneal reflex, and which provides the efferent limb?',opts:['CN V1 (ophthalmic) afferent; CN VII (facial) efferent','CN V2 (maxillary) afferent; CN VII efferent','CN III afferent; CN VII efferent','CN V1 afferent; CN III efferent','CN VII afferent; CN V1 efferent'],ans:0,exp:'Corneal reflex: afferent = nasociliary branch of ophthalmic division (V1) of trigeminal nerve; efferent = facial nerve (CN VII) causing orbicularis oculi to blink. Testing the corneal reflex assesses both V1 and VII.',sys:'Special Senses'},
  {q:'A patient presents with proptosis, periorbital edema, and ophthalmoplegia after a facial skin infection. Cavernous sinus thrombosis is suspected. Which cranial nerve is typically affected first, causing loss of lateral gaze?',opts:['CN III — causing ptosis and pupil dilation first','CN IV — causing vertical diplopia first','CN VI — causing impaired abduction first','CN V1 — causing corneal anesthesia first','CN V2 — causing midface numbness first'],ans:2,exp:'In cavernous sinus thrombosis or mass lesions, CN VI (abducens) is most vulnerable as it runs through (not just in the lateral wall of) the sinus alongside the ICA. Lateral gaze palsy (loss of abduction) is often the first oculomotor sign.',sys:'Special Senses'},
  {q:'What is the afferent branch of the pupillary reflex?',opts:['CN II','CN III','CN V','CN VII'],ans:0,exp:'The pupillary reflex: Afferent is CN II, Efferent is CN III.',sys:'Special Senses'},
  {q:'What cranial nerve is responsible for eyelid opening by innervating the levator palpebrae superioris?',opts:['CN II','CN III','CN IV','CN VI'],ans:1,exp:'The levator palpebrae superioris is innervated by CN III, which opens the eyelids.',sys:'Special Senses'},
  {q:'The left recurrent laryngeal nerve is vulnerable to injury during which surgical procedure?',opts:['Parathyroidectomy','Aortic arch surgery','Coronary bypass','Cervical lymph node dissection'],ans:1,exp:'The left recurrent laryngeal nerve loops under the aortic arch and can be damaged during aortic arch or thoracic surgery, causing hoarseness.',sys:'Endocrine System'},
  {q:'A patient undergoes thyroid surgery and develops hoarseness postoperatively. Which nerve was most likely injured?',opts:['Internal branch of the superior laryngeal nerve','External branch of the superior laryngeal nerve','Recurrent laryngeal nerve','Glossopharyngeal nerve'],ans:2,exp:'The recurrent laryngeal nerve (branch of the vagus, CN X) runs close to the thyroid and is at risk during thyroid surgery. Injury causes hoarseness by paralyzing the vocal cord.',sys:'Endocrine System'},
  {q:'Hoarseness following thyroid surgery is caused by injury to which nerve, a branch of which cranial nerve?',opts:['Superior laryngeal nerve; CN IX','Recurrent laryngeal nerve; CN X (Vagus)','Phrenic nerve; CN XI','Hypoglossal nerve; CN XII'],ans:1,exp:'The recurrent laryngeal nerve is a branch of the vagus nerve (CN X). Injury during thyroidectomy is a known complication, causing ipsilateral vocal cord paralysis and hoarseness.',sys:'Endocrine System'},
  {q:'A lesion at the optic chiasm (e.g., pituitary adenoma) causes which visual field defect?',opts:['Right monocular blindness','Bitemporal hemianopia','Left homonymous hemianopia','Right homonymous hemianopia'],ans:1,exp:'The optic chiasm contains crossing nasal fibers (temporal visual fields). Compression (e.g., pituitary macroadenoma) classically causes bitemporal hemianopia (\'tunnel vision\').',sys:'Endocrine System'},
  {q:'The hypothalamus controls all of the following EXCEPT:',opts:['Temperature regulation','Hunger and satiety','Conscious proprioception','Osmolality and ADH release'],ans:2,exp:'Conscious proprioception is a function of the dorsal columns and somatosensory cortex, NOT the hypothalamus. The hypothalamus regulates autonomic functions, temperature, hunger, sleep, thirst, and ADH release.',sys:'Endocrine System'},
  {q:'The first pharyngeal arch (Meckel\'s cartilage) gives rise to which structures?',opts:['Stapes, styloid process, lesser horn of hyoid','Malleus, incus, anterior ligament of malleus, sphenomandibular ligament','Greater horn of hyoid and body of hyoid','Thyroid, cricoid, arytenoid cartilages','Stylohyoid ligament'],ans:1,exp:'The first pharyngeal arch (Meckel\'s cartilage) derivatives: malleus, incus, anterior ligament of malleus, sphenomandibular ligament, and the muscles of mastication (mandibular nerve, V3).',sys:'Endocrine System'},
  {q:'The third and fourth pharyngeal pouches give rise to which endocrine/lymphoid structures?',opts:['Thyroid gland and tonsils','3rd pouch → thymus and inferior parathyroids; 4th pouch → superior parathyroids (and ultimobranchial body)','Parathyroid glands only','Thyroid and parathyroid glands','Thymus and thyroid gland'],ans:1,exp:'3rd pharyngeal pouch → thymus (ventral wing) and inferior parathyroid glands (dorsal wing). 4th pharyngeal pouch → superior parathyroid glands (dorsal wing) and ultimobranchial body (parafollicular C cells of thyroid).',sys:'Endocrine System'},
  {q:'A 3-month-old infant has hypocalcemia, T-cell deficiency, and conotruncal heart defects. Which embryonic structure failed to develop?',opts:['1st pharyngeal pouch','2nd pharyngeal pouch','3rd and 4th pharyngeal pouches (DiGeorge syndrome)','Neural tube','Metanephric mesoderm'],ans:2,exp:'DiGeorge syndrome (22q11 deletion) results from failure of development of the 3rd and 4th pharyngeal pouches: absence of thymus (T-cell deficiency), absence of inferior parathyroids (hypocalcemia), and associated conotruncal heart defects.',sys:'Endocrine System'},
  {q:'The superior parathyroid glands are derived from which pharyngeal pouch?',opts:['1st pouch','2nd pouch','3rd pouch','4th pouch','5th pouch'],ans:3,exp:'Superior parathyroid glands derive from the 4th pharyngeal pouch. Because they travel a shorter distance, they are more predictably located posterior to the upper poles of the thyroid. Inferior parathyroids come from the 3rd pouch and are more variable in position.',sys:'Endocrine System'},
  {q:'The right adrenal gland drains directly into which vessel?',opts:['Right renal vein','Inferior vena cava directly','Portal vein','Right gonadal vein','Azygos vein'],ans:1,exp:'The right adrenal vein drains directly and very briefly into the IVC. This short course makes right adrenalectomy more challenging. The left adrenal vein drains into the left renal vein.',sys:'Endocrine System'},
  {q:'The left adrenal gland drains into which vessel?',opts:['Inferior vena cava directly','Left renal vein','Portal vein','Left gonadal vein','Hemiazygos vein'],ans:1,exp:'The left adrenal vein drains into the left renal vein (which then drains to the IVC). This is also why left-sided varicoceles are more common — the left gonadal vein similarly drains into the left renal vein at a 90° angle.',sys:'Endocrine System'},
  {q:'A 35-year-old woman presents with episodic hypertension, headache, palpitations, and diaphoresis. Urine shows elevated metanephrines. A 4-cm adrenal mass is found on CT. Which condition follows the \'rule of 10s\'?',opts:['Conn syndrome','Cushing\'s disease','Pheochromocytoma','Neuroblastoma','Adrenal adenoma'],ans:2,exp:'Pheochromocytoma follows the \'rule of 10s\': 10% bilateral, 10% malignant, 10% extra-adrenal (paragangliomas), 10% familial, 10% in children. It secretes catecholamines (epinephrine > norepinephrine from adrenal medulla).',sys:'Endocrine System'},
  {q:'The right adrenal gland is pyramidal in shape and lies at which vertebral level?',opts:['T10–T11','T11–T12','L1','T12–L1','T9–T10'],ans:1,exp:'The right adrenal gland (pyramidal/triangular shape) lies at T11–T12, superior to the right kidney and posterior to the IVC. The left adrenal is crescentic (semilunar) and more medial.',sys:'Endocrine System'},
  {q:'A 30-year-old man has a hypertensive crisis, sweating, and palpitations. CT shows a 3 cm right adrenal mass. Which enzyme converts norepinephrine to epinephrine in the adrenal medulla?',opts:['Tyrosine hydroxylase','DOPA decarboxylase','Dopamine beta-hydroxylase','Phenylethanolamine N-methyltransferase (PNMT)','Monoamine oxidase'],ans:3,exp:'PNMT (phenylethanolamine N-methyltransferase) converts norepinephrine to epinephrine in the adrenal medulla. This reaction requires high cortisol concentrations from the adrenal cortex via the portal vasculature — explaining why adrenal medullary pheochromocytoma produces mainly epinephrine.',sys:'Endocrine System'},
  {q:'Which is the most common neuroendocrine tumor of the gastrointestinal tract, most frequently found in the ileum?',opts:['Pheochromocytoma','Insulinoma','Carcinoid tumor','Gastrinoma','VIPoma'],ans:2,exp:'Carcinoid tumor (now classified as well-differentiated neuroendocrine tumor) is the most common neuroendocrine tumor of the GI tract, most often found in the small intestine (ileum), followed by the rectum and appendix.',sys:'Endocrine System'},
  {q:'The superior thyroid artery is the first branch of which vessel?',opts:['Subclavian artery','External carotid artery','Internal carotid artery','Thyrocervical trunk','Lingual artery'],ans:1,exp:'The superior thyroid artery is typically the first anterior branch of the external carotid artery, supplying the upper poles of the thyroid gland and running with the external branch of the superior laryngeal nerve.',sys:'Endocrine System'},
  {q:'The inferior thyroid artery is a branch of which vessel?',opts:['External carotid artery','Internal carotid artery','Thyrocervical trunk (from subclavian artery)','Subclavian artery directly','Vertebral artery'],ans:2,exp:'The inferior thyroid artery arises from the thyrocervical trunk, a branch of the subclavian artery. It supplies the lower poles of the thyroid and the parathyroid glands, and runs close to the recurrent laryngeal nerve.',sys:'Endocrine System'},
  {q:'A thyroid surgeon ligates the inferior thyroid artery close to the gland. Which structure is most at risk?',opts:['External branch of superior laryngeal nerve','Recurrent laryngeal nerve','Internal jugular vein','Superior laryngeal nerve','Common carotid artery'],ans:1,exp:'The recurrent laryngeal nerve runs in close proximity to the inferior thyroid artery, crossing either anterior or posterior to it. Ligation close to the gland risks injury to the RLN, causing hoarseness.',sys:'Endocrine System'},
  {q:'At which vertebral level does the thyroid gland lie?',opts:['C3–C5','C5–T1','C4–C6','C6–T1','C7–T2'],ans:1,exp:'The thyroid gland lies at approximately C5–T1 vertebral levels, with the isthmus overlying the 2nd–4th tracheal rings and the upper poles reaching to C5.',sys:'Endocrine System'},
  {q:'After thyroidectomy, a patient develops perioral tingling, carpopedal spasm, and a positive Chvostek sign. Which structure was likely inadvertently removed?',opts:['Thyroid gland only','Parathyroid glands','Recurrent laryngeal nerve','Superior laryngeal nerve','Thymic tissue'],ans:1,exp:'Inadvertent removal of parathyroid glands during thyroidectomy causes hypoparathyroidism → hypocalcemia → tetany (Chvostek sign, Trousseau sign, perioral tingling, carpopedal spasm).',sys:'Endocrine System'},
  {q:'The superior parathyroid glands lie posterior to which part of the thyroid?',opts:['Upper poles, anterior surface','Upper poles, posterior surface (at junction of upper and middle thirds)','Lower poles','Isthmus','Posterior to the trachea'],ans:1,exp:'Superior parathyroid glands lie posterior to the upper poles of the thyroid (at the junction of the upper and middle thirds), adjacent to where the inferior thyroid artery crosses the RLN. They are more consistent in location than inferior parathyroids.',sys:'Endocrine System'},
  {q:'A thyroglossal duct cyst moves upward with swallowing AND protrusion of the tongue. Why does tongue protrusion elevate this cyst?',opts:['It is attached to the hyoid bone','It is attached to the foramen cecum via the thyroglossal duct remnant','It is within the strap muscles','It is attached to the epiglottis','It is connected to the submandibular gland'],ans:1,exp:'The thyroglossal duct cyst is connected to the foramen cecum at the base of the tongue via a fibrous remnant of the thyroglossal duct. Tongue protrusion moves the foramen cecum forward and upward, elevating the cyst — a pathognomonic finding.',sys:'Endocrine System'},
  {q:'A 20-year-old woman has a midline neck mass at the level of the hyoid bone that elevates with swallowing. Simple excision is contraindicated due to high recurrence. Which operation is the standard of care?',opts:['Total thyroidectomy with central neck dissection','Sistrunk procedure','Incision and drainage with antibiotic irrigation','Modified radical neck dissection','Excision followed by radioiodine ablation'],ans:1,exp:'The Sistrunk procedure removes the thyroglossal duct cyst, the fibrous tract, and the central portion (body) of the hyoid bone, as the tract passes through or posterior to the hyoid. Simple excision has a very high recurrence rate.',sys:'Endocrine System'},
  {q:'A patient develops a high-pitched voice after thyroid surgery. Which nerve was likely injured and which muscle does it innervate?',opts:['Recurrent laryngeal nerve; posterior cricoarytenoid','External branch of superior laryngeal nerve; cricothyroid','Internal branch of superior laryngeal nerve; arytenoid','Recurrent laryngeal nerve; thyroarytenoid','Glossopharyngeal nerve; stylopharyngeus'],ans:1,exp:'The external branch of the superior laryngeal nerve innervates the cricothyroid muscle (tensor/lengthener of vocal cords for high pitch). Its injury causes inability to raise pitch — important for singers. The RLN causes hoarseness when injured.',sys:'Endocrine System'},
  {q:'A patient develops hoarseness after thyroid surgery. Laryngoscopy shows a paralyzed vocal cord. Which nerve was injured?',opts:['External branch of superior laryngeal nerve','Internal branch of superior laryngeal nerve','Recurrent laryngeal nerve','Glossopharyngeal nerve','Hypoglossal nerve'],ans:2,exp:'The recurrent laryngeal nerve (RLN) supplies all intrinsic muscles of the larynx except the cricothyroid. Its injury causes hoarseness (unilateral) or aphonia and stridor (bilateral). The posterior cricoarytenoid (the only abductor of vocal cords) is also paralyzed.',sys:'Endocrine System'},
  {q:'A thyroid ima artery, when present, typically arises from which vessel?',opts:['External carotid artery','Aortic arch or brachiocephalic trunk','Subclavian artery','Internal carotid artery','Thyrocervical trunk'],ans:1,exp:'The thyroid ima artery (present in ~10% of people) arises from the brachiocephalic trunk or the arch of the aorta and ascends anterior to the trachea to supply the thyroid isthmus. It must be identified before tracheostomy.',sys:'Endocrine System'},
  {q:'Primary hyperparathyroidism most commonly results from which pathological condition?',opts:['Parathyroid carcinoma','Hyperplasia of all four glands','Single parathyroid adenoma','Ectopic parathyroid tissue','Vitamin D deficiency'],ans:2,exp:'Primary hyperparathyroidism is most commonly caused by a single parathyroid adenoma (~80–85% of cases), producing excess PTH leading to hypercalcemia, hypophosphatemia, and bone resorption.',sys:'Endocrine System'},
  {q:'Which of the following dopaminergic pathways is responsible for regulating the secretion of prolactin?',opts:['Mesocortical pathway','Mesolimbic pathway','Nigrostriatal pathway','Tuberoinfundibular pathway'],ans:3,exp:'The tuberoinfundibular pathway regulates prolactin secretion.',sys:'Endocrine System'},
  {q:'Which of the following cells produce testosterone in the presence of LH?',opts:['Sertoli cells','Spermatogonia','Leydig cells','Granulosa cells'],ans:2,exp:'Leydig cells produce testosterone under the control of LH.',sys:'Endocrine System'},
  {q:'The site of the obliterated thyroglossal duct is called',opts:['Foramen cecum','Foramen ovale','Thyroglossal duct cyst','None of the above'],ans:0,exp:'Foramen cecum is the site of an obliterated thyroglossal duct.',sys:'Endocrine System'},
  {q:'The thyroid isthmus usually crosses which of the following set of tracheal rings?',opts:['1st and 2nd','2nd and 3rd','4th and 5th','5th and 6th'],ans:1,exp:'The thyroid isthmus usually crosses the 2nd and 3rd tracheal rings.',sys:'Endocrine System'},
  {q:'In a thyroidectomy procedure, accidental transection of the recurrent laryngeal nerve may occur during ligation of which of the following arteries?',opts:['Superior thyroid artery','Inferior thyroid artery','Transverse cervical artery','Thyrocervical trunk'],ans:1,exp:'Accidental transection of the recurrent laryngeal nerve may occur during ligation of the inferior thyroid artery, leading to hoarseness.',sys:'Endocrine System'},
  {q:'A patient with a nonfunctioning pituitary adenoma presents with bitemporal hemianopia. Where is the lesion most likely located?',opts:['At the optic chiasm','At the left optic nerve','At the Meyer loop','At the left visual cortex'],ans:0,exp:'A lesion at the optic chiasm typically presents with bitemporal hemianopia.',sys:'Endocrine System'},
  {q:'Which of the following hypothalamic nuclei is responsible for regulating the circadian rhythm?',opts:['Suprachiasmatic nucleus','Supraoptic nucleus','Paraventricular nucleus','Anterior nucleus'],ans:0,exp:'The suprachiasmatic nucleus is responsible for regulating the circadian rhythm.',sys:'Endocrine System'},
  {q:'Which of the following zones of the adrenal gland produces androgens?',opts:['Zona glomerulosa','Zona fasciculata','Zona reticularis','Any of the above'],ans:2,exp:'Androgens are produced in the zona reticularis.',sys:'Endocrine System'},
  {q:'The adrenal medulla is embryologically derived from the',opts:['Neural crest','Neural tube','Surface ectoderm','Mesoderm'],ans:0,exp:'The adrenal medulla is embryologically derived from the neural crest.',sys:'Endocrine System'},
  {q:'The right lymphatic duct drains lymph from which regions?',opts:['Entire body below the diaphragm plus left upper body','Right upper quadrant of body (right arm, right head/neck, right chest)','Entire left side of the body','Lower extremities only'],ans:1,exp:'The right lymphatic duct drains the right upper quadrant of the body: right upper limb, right head and neck, right thorax. The thoracic duct drains the rest.',sys:'Lymphatic & Immune System'},
  {q:'A 45-year-old woman with breast cancer has lymphedema of the arm after axillary node dissection. Which group of axillary lymph nodes, when removed, most commonly causes this complication?',opts:['Level I (lateral to pectoralis minor)','Level II (posterior to pectoralis minor)','Level III (medial to pectoralis minor)','Infraclavicular nodes','Supraclavicular nodes'],ans:2,exp:'Level III (apical) axillary lymph node dissection, medial to the pectoralis minor, is most likely to cause arm lymphedema as it removes the final drainage pathway to the subclavian lymph trunk.',sys:'Lymphatic & Immune System'},
  {q:'The thoracic duct drains lymph from what proportion of the body?',opts:['Upper body only','Right side of the body','Three-quarters of the body (all except right upper quadrant)','Entire body','Left side only'],ans:2,exp:'The thoracic duct drains approximately three-quarters of the body — everything except the right upper quadrant (right side of head/neck, right upper limb, right hemithorax), which drains via the right lymphatic duct.',sys:'Lymphatic & Immune System'},
  {q:'The thymus develops from which pharyngeal pouch(es) and descends to which location?',opts:['2nd pharyngeal pouch; descends to the neck','3rd pharyngeal pouch; descends to the anterior superior mediastinum','4th pharyngeal pouch; descends to the posterior mediastinum','1st pharyngeal pouch; remains in the neck','5th pharyngeal pouch; descends to the chest'],ans:1,exp:'The thymus develops from the ventral wing of the 3rd pharyngeal pouch and descends to the anterior superior mediastinum. It is largest in childhood and involutes after puberty.',sys:'Lymphatic & Immune System'},
  {q:'A 25-year-old woman develops muscle weakness and fatigability that improves with rest. CT chest shows an anterior mediastinal mass. Which condition is associated with a thymoma?',opts:['Multiple myeloma','Myasthenia gravis','DiGeorge syndrome','Lambert-Eaton syndrome','Grave\'s disease'],ans:1,exp:'Thymoma is strongly associated with myasthenia gravis (~15–20% of MG patients have thymoma; ~30–50% of thymoma patients have MG). The thymus plays a role in the autoimmune response against acetylcholine receptors.',sys:'Lymphatic & Immune System'},
];

let questions = [...ALL_QS];
let current = 0;
let answers = new Array(questions.length).fill(null);
let statusFilter = 'all';
let systemFilter = 'all';
let filteredIndices = [];
let filteredPos = 0;
let streak = 0;

function getFilteredIndices() {
  return questions.map((q,i) => i).filter(i => {
    if (systemFilter !== 'all' && questions[i].sys !== systemFilter) return false;
    if (statusFilter === 'all') return true;
    if (statusFilter === 'unanswered') return answers[i] === null;
    if (statusFilter === 'wrong') return answers[i] !== null && answers[i] !== questions[i].ans;
    if (statusFilter === 'correct') return answers[i] === questions[i].ans;
  });
}

function setSystem(sys) {
  systemFilter = sys;
  filteredIndices = getFilteredIndices();
  filteredPos = 0;
  if (filteredIndices.length > 0) {
    current = filteredIndices[0];
  }
  render();
}

function setFilter(f, btn) {
  statusFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  filteredIndices = getFilteredIndices();
  filteredPos = 0;
  if (filteredIndices.length > 0) {
    current = filteredIndices[0];
    render();
  } else {
    document.getElementById('question-area').innerHTML = '<div class="q-card central-inline-251201">No questions match this filter.</div>';
    document.getElementById('nav-info').textContent = '0 questions';
  }
}

function shuffle() {
  for (let i = questions.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
    [answers[i], answers[j]] = [answers[j], answers[i]];
  }
  filteredIndices = getFilteredIndices();
  filteredPos = 0;
  current = filteredIndices[0] || 0;
  render();
}

function resetAll() {
  if (!confirm('Reset all answers? This cannot be undone.')) return;
  answers = new Array(questions.length).fill(null);
  streak = 0;
  filteredIndices = getFilteredIndices();
  filteredPos = 0;
  current = filteredIndices[0] || 0;
  updateStats();
  render();
}

function prevQ() {
  filteredIndices = getFilteredIndices();
  filteredPos = Math.max(0, filteredPos-1);
  current = filteredIndices[filteredPos];
  render();
}

function nextQ() {
  filteredIndices = getFilteredIndices();
  filteredPos = Math.min(filteredIndices.length-1, filteredPos+1);
  current = filteredIndices[filteredPos];
  render();
}

function selectAnswer(qIdx, optIdx) {
  if (answers[qIdx] !== null) return;
  answers[qIdx] = optIdx;
  if (optIdx === questions[qIdx].ans) {
    streak++;
  } else {
    streak = 0;
  }
  updateStats();
  render();
}

function updateStats() {
  const answered = answers.filter(a => a !== null).length;
  const correct = answers.filter((a, i) => a === questions[i].ans).length;
  document.getElementById('sTotal').textContent = questions.length;
  document.getElementById('sAnswered').textContent = answered;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sStreak').textContent = streak;

  const pct = Math.round((answered / questions.length) * 100) || 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `${answered} / ${questions.length} answered`;
  document.getElementById('progPct').textContent = pct + '%';
}

function render() {
  filteredIndices = getFilteredIndices();
  if (filteredIndices.length === 0) {
    document.getElementById('question-area').innerHTML = '<div class="q-card central-inline-253545">No questions match this filter.</div>';
    document.getElementById('nav-info').textContent = '0 questions';
    return;
  }

  if (!filteredIndices.includes(current)) {
    current = filteredIndices[filteredPos] || filteredIndices[0];
  }
  filteredPos = filteredIndices.indexOf(current);

  const q = questions[current];
  const userAns = answers[current];
  const letters = ['A','B','C','D','E'];
  const total = filteredIndices.length;
  const pos = filteredPos + 1;

  document.getElementById('nav-info').textContent = `Question ${pos} of ${total}`;

  let optsHtml = q.opts.map((opt, i) => {
    let cls = 'opt';
    if (userAns !== null) {
      if (i === q.ans) cls += ' correct';
      else if (i === userAns) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="selectAnswer(${current}, ${i})">
      <span class="opt-letter">${letters[i]}.</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  let expHtml = '';
  if (userAns !== null) {
    const isCorrect = userAns === q.ans;
    const resultText = isCorrect ? '✓ Correct' : '✗ Incorrect';
    const wrapperClass = isCorrect ? 'rationale' : 'rationale incorrect';
    expHtml = `<div class="${wrapperClass}"><strong>${resultText}</strong> — ${q.exp}</div>`;
  }

  document.getElementById('question-area').innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-num">Q${current+1}</span>
        <span class="badge badge-theme">${q.sys}</span>
      </div>
      <div class="q-stem">${q.q}</div>
      <div class="options">${optsHtml}</div>
      ${expHtml}
    </div>
  `;
}

updateStats();
render();
</script>
</body>
</html>

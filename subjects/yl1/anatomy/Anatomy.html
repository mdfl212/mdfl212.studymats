<script>
const ALL_QS = [
  {q:'Which bone does the abdominal aorta bifurcate into common iliac arteries?',opts:['L2','L3','L4','L5'],ans:2,exp:'The abdominal aorta bifurcates into the right and left common iliac arteries at the level of L4 vertebra.',sys:'Cardiovascular System'},
  {q:'Cardiac tamponade classically presents with Beck\'s triad, which includes:',opts:['Hypertension, bradycardia, widened pulse pressure','Hypotension, muffled heart sounds, distended neck veins','Tachycardia, pulmonary edema, kussmaul breathing','Hypertension, tachycardia, muffled heart sounds'],ans:1,exp:'Beck\'s triad of cardiac tamponade: hypotension, muffled/distant heart sounds, and jugular venous distension (distended neck veins).',sys:'Cardiovascular System'},
  {q:'The SA node receives blood supply most commonly from which artery?',opts:['Left circumflex artery','Right coronary artery','Left anterior descending artery','Posterior descending artery'],ans:1,exp:'The SA node is supplied by the SA nodal artery, a branch of the right coronary artery in ~60% of people (and the left circumflex in ~40%).',sys:'Cardiovascular System'},
  {q:'Occlusion of the left anterior descending (LAD) artery typically causes infarction of which cardiac region?',opts:['Inferior wall and posterior septum','Lateral wall and posterior wall','Anterior wall and anterior 2/3 of interventricular septum','Right ventricle and inferior wall'],ans:2,exp:'The LAD (widow-maker) supplies the anterior wall of the left ventricle and the anterior 2/3 of the interventricular septum.',sys:'Cardiovascular System'},
  {q:'Which structure separates the superior and inferior mediastinum?',opts:['Tracheal bifurcation','Sternal angle (at T4–T5 level)','Aortic arch','Pulmonary trunk'],ans:1,exp:'The sternal angle (angle of Louis) at T4–T5 demarcates the superior from the inferior mediastinum.',sys:'Cardiovascular System'},
  {q:'The thoracic duct drains into which vessel?',opts:['Right subclavian vein','Superior vena cava','Junction of left subclavian and left internal jugular veins','Left brachiocephalic vein'],ans:2,exp:'The thoracic duct drains into the venous angle formed by the junction of the left subclavian vein and left internal jugular vein.',sys:'Cardiovascular System'},
  {q:'Auscultation of the mitral valve is best performed at which location?',opts:['Right 2nd intercostal space, sternal border','Left 2nd intercostal space, sternal border','Left 5th intercostal space, midclavicular line','Left 4th intercostal space, sternal border'],ans:2,exp:'Mitral valve auscultation is best at the cardiac apex: left 5th intercostal space, midclavicular line (the mitral area).',sys:'Cardiovascular System'},
  {q:'Aortic valve auscultation is best at which location?',opts:['Right 2nd intercostal space, sternal border','Left 5th ICS, midclavicular line','Left 4th ICS, sternal border','Left 2nd ICS, sternal border'],ans:0,exp:'Aortic valve sounds are best heard at the right 2nd intercostal space, parasternal (aortic area).',sys:'Cardiovascular System'},
  {q:'An \'Ectopia cordis\' is caused by failure of which embryologic structure?',opts:['Septum primum to fuse','Lateral body folds to migrate and fuse to form the ventral thoracic wall','Neural crest cells to migrate','Truncus arteriosus to divide properly'],ans:1,exp:'Ectopia cordis results from failure of the lateral body folds to properly migrate and fuse anteriorly, preventing formation of the ventral thoracic wall, leaving the heart exposed.',sys:'Cardiovascular System'},
  {q:'The sinoatrial (SA) node is normally located in which cardiac structure?',opts:['Interatrial septum','Right atrium near the SVC junction','Left atrium near the pulmonary veins','Interventricular septum'],ans:1,exp:'The SA node is located in the posterolateral wall of the right atrium, near the junction of the superior vena cava.',sys:'Cardiovascular System'},
  {q:'The carotid sinus and carotid body are located at which anatomical site?',opts:['Origin of internal carotid artery','Bifurcation of the common carotid artery','Origin of external carotid artery','Junction of internal jugular vein and subclavian vein'],ans:1,exp:'The carotid sinus (baroreceptor) and carotid body (chemoreceptor) are both located at the bifurcation of the common carotid artery into internal and external carotid arteries.',sys:'Cardiovascular System'},
  {q:'Baroreceptors in the carotid sinus detect increased blood pressure and respond by:',opts:['Increasing sympathetic activity and vasoconstriction','Increasing parasympathetic activity and decreasing cardiac output','Decreasing baroreceptor activity and increasing TPR','Activating the RVLM and increasing heart rate'],ans:1,exp:'Elevated BP stretches the carotid sinus baroreceptors → increases afferent signals → increases parasympathetic output (via CN IX/X) → decreases HR and vasodilation → lowers BP.',sys:'Cardiovascular System'},
  {q:'The vertebral artery enters the skull through which foramen?',opts:['Foramen magnum','Jugular foramen','Foramen ovale','Internal acoustic meatus'],ans:0,exp:'The vertebral arteries ascend through the transverse foramina of C6–C1 vertebrae, then enter the skull through the foramen magnum to join and form the basilar artery.',sys:'Cardiovascular System'},
  {q:'Branches of the external carotid artery include all EXCEPT:',opts:['Superior thyroid artery','Occipital artery','Ophthalmic artery','Facial artery'],ans:2,exp:'The ophthalmic artery is a branch of the INTERNAL carotid artery. The external carotid artery branches include the superior thyroid, lingual, facial, occipital, posterior auricular, maxillary, and superficial temporal arteries.',sys:'Cardiovascular System'},
  {q:'Ectopia cordis is caused by failure of which embryologic event?',opts:['Neural tube closure','Lateral body folds failing to migrate ventrally and fuse, preventing ventral thoracic wall formation','Aorticopulmonary septum to divide the truncus arteriosus','Septum primum and septum secundum to fuse'],ans:1,exp:'Ectopia cordis occurs when the lateral embryonic body folds fail to migrate and fuse at the ventral midline, preventing formation of the anterior thoracic wall and leaving the heart exposed.',sys:'Cardiovascular System'},
  {q:'Surface marking for the apex beat of the heart is normally:',opts:['4th intercostal space, midclavicular line','5th intercostal space, midclavicular line','6th intercostal space, anterior axillary line','4th intercostal space, sternal border'],ans:1,exp:'The apex beat (cardiac impulse) is normally felt at the 5th intercostal space in the midclavicular line, corresponding to the apex of the left ventricle.',sys:'Cardiovascular System'},
  {q:'The posterior intercostal arteries in the upper two intercostal spaces arise from which vessel?',opts:['Aorta directly','Superior intercostal artery (from costocervical trunk of subclavian artery)','Internal thoracic artery','Lateral thoracic artery','Thyrocervical trunk directly'],ans:1,exp:'The first and second posterior intercostal arteries arise from the superior intercostal artery, which is a branch of the costocervical trunk (from the subclavian artery). The remaining posterior intercostals arise directly from the thoracic aorta.',sys:'Cardiovascular System'},
  {q:'The left subclavian artery arises from which vessel?',opts:['Brachiocephalic trunk','Arch of the aorta directly','Left common carotid artery','Thyrocervical trunk','Left internal thoracic artery'],ans:1,exp:'The left subclavian artery is the third and most lateral branch of the arch of the aorta. On the right, the subclavian artery arises from the brachiocephalic trunk.',sys:'Cardiovascular System'},
  {q:'A 40-year-old man has an acute MI from left anterior descending artery occlusion. The surgeon plans a bypass using the internal thoracic artery. Why is this vessel preferred for coronary bypass?',opts:['It has the largest diameter','It arises from the aorta and is most accessible','It has excellent long-term patency and resists atherosclerosis','It can reach all coronary arteries','It is expendable with no clinical consequences'],ans:2,exp:'The internal thoracic (mammary) artery has excellent long-term patency (>90% at 10 years) and is remarkably resistant to atherosclerosis, making it the preferred conduit for coronary artery bypass grafting.',sys:'Cardiovascular System'},
  {q:'A needle is inserted into the 4th intercostal space at the left sternal border for pericardiocentesis. To avoid the internal thoracic vessels, the needle should be inserted at which border of the rib?',opts:['Inferior border of the 4th rib (subcostal groove)','Superior border of the 5th rib','Midpoint of the interspace','Lateral border of the sternum','Directly through the sternum'],ans:1,exp:'For pericardiocentesis and thoracentesis, the needle is inserted just above (superior border of) the lower rib to avoid the neurovascular bundle in the subcostal groove of the upper rib. However, near the sternum the internal thoracic vessels must also be considered.',sys:'Cardiovascular System'},
  {q:'Failure of the aorticopulmonary septum to divide the truncus arteriosus results in which congenital cardiac anomaly?',opts:['Tetralogy of Fallot','Transposition of the great arteries','Persistent truncus arteriosus','Ventricular septal defect','Ebstein anomaly'],ans:2,exp:'Persistent truncus arteriosus results from failure of the aorticopulmonary septum to properly divide and spiral the truncus arteriosus into the aorta and pulmonary trunk.',sys:'Cardiovascular System'},
  {q:'Tetralogy of Fallot consists of which four defects?',opts:['VSD, ASD, PDA, and overriding aorta','VSD, pulmonary stenosis, overriding aorta, and right ventricular hypertrophy','ASD, VSD, pulmonary hypertension, and Eisenmenger syndrome','PDA, VSD, coarctation, and right ventricular hypertrophy','VSD, ASD, tricuspid atresia, and right ventricular hypertrophy'],ans:1,exp:'Tetralogy of Fallot: (1) VSD, (2) pulmonary stenosis (outflow obstruction), (3) overriding aorta, (4) right ventricular hypertrophy. It results from anterior deviation of the infundibular septum.',sys:'Cardiovascular System'},
  {q:'The ductus arteriosus connects which two vessels in fetal circulation, and what does it become after birth?',opts:['Aorta to pulmonary veins; becomes pulmonary ligament','Pulmonary trunk to the aorta; becomes the ligamentum arteriosum','Aorta to IVC; becomes ligamentum venosum','Umbilical vein to IVC; becomes ligamentum teres','Ductus venosus to hepatic vein; becomes ligamentum venosum'],ans:1,exp:'The ductus arteriosus connects the pulmonary trunk to the descending aorta, shunting blood away from the lungs in fetal circulation. After birth, it closes (due to increased O2 and decreased prostaglandins) to form the ligamentum arteriosum.',sys:'Cardiovascular System'},
  {q:'The foramen ovale allows blood to pass from the right atrium to the left atrium in fetal circulation. What does it become after birth?',opts:['Ligamentum arteriosum','Ligamentum venosum','Fossa ovalis','Ligamentum teres hepatis','Medial umbilical ligament'],ans:2,exp:'After birth, increased left atrial pressure closes the foramen ovale, which later fuses to form the fossa ovalis (a depression in the interatrial septum). Failure of closure results in a patent foramen ovale.',sys:'Cardiovascular System'},
  {q:'The ductus venosus shunts oxygenated blood from the umbilical vein to the IVC in fetal circulation. What does it become after birth?',opts:['Ligamentum teres hepatis','Ligamentum arteriosum','Ligamentum venosum','Medial umbilical ligament','Fossa ovalis'],ans:2,exp:'After birth, the ductus venosus closes to become the ligamentum venosum, a fibrous remnant in the fissure of the liver between the caudate and left lobes.',sys:'Cardiovascular System'},
  {q:'The umbilical vein carries oxygenated blood from the placenta to the fetus. What fibrous remnant does it form after birth?',opts:['Medial umbilical ligaments','Lateral umbilical ligaments','Ligamentum teres hepatis (in falciform ligament)','Ligamentum arteriosum','Ligamentum venosum'],ans:2,exp:'The umbilical vein obliterates after birth to form the ligamentum teres hepatis (round ligament of the liver), which runs in the free edge of the falciform ligament.',sys:'Cardiovascular System'},
  {q:'The aorta goes through the aortic hiatus in the diaphragm at what level?',opts:['T11','T12','L1','L2'],ans:1,exp:'At T12 level, the aorta goes through the aortic hiatus found in the diaphragm.',sys:'Cardiovascular System'},
  {q:'The aortic valve is best heard at the',opts:['Right 2nd ICS','Left 2nd ICS','Right lower part of the sternum','Left 5th ICS at the MCL'],ans:0,exp:'The aortic valve is best heard at the right 2nd ICS.',sys:'Cardiovascular System'},
  {q:'The sinoatrial (SA) node is found',opts:['In the septal wall of the right atrium (RA)','At the opening of the superior vena cava (SVC) in the RA','At the membranous part of the interventricular septum','At all 3 locations above'],ans:1,exp:'The SA node is found at the opening of the SVC in the right atrium. The AV node is found in the septal wall of the RA.',sys:'Cardiovascular System'},
  {q:'The blood supply to the SA node is provided by',opts:['Right coronary artery','Left coronary artery','Left circumflex artery','Posterior descending artery'],ans:0,exp:'The RCA provides blood supply to the SA node through the SA nodal artery.',sys:'Cardiovascular System'},
  {q:'What vein receives the hemiazygos and accessory hemiazygos veins and directly empties into the SVC?',opts:['Azygos vein','Superior intercostal vein','Posterior intercostal vein','Thoracic duct'],ans:0,exp:'The azygos vein receives the hemiazygos and accessory hemiazygos veins and directly empties into the SVC.',sys:'Cardiovascular System'},
  {q:'When taking blood pressure in the arm, the arterial pulse of what artery (found in the cubital fossa) is being listened to?',opts:['Posterior circumflex artery','Ulnar artery','Brachial artery','Radial artery'],ans:2,exp:'The brachial artery is found in the cubital fossa. We listen to its arterial pulse when taking blood pressure.',sys:'Cardiovascular System'},
  {q:'What is the main arterial blood supply to the apex of the heart?',opts:['Left anterior descending artery','Left circumflex artery','Right coronary artery','SA nodal artery'],ans:0,exp:'The LAD artery is the main arterial blood supply to the cardiac apex.',sys:'Cardiovascular System'},
  {q:'Which of the following is a branch of the internal carotid artery in the neck?',opts:['Superior thyroid artery','Maxillary artery','Superficial temporal artery','None of the above'],ans:3,exp:'The internal carotid artery has NO branches in the neck. The rest of the options are branches of the external carotid artery.',sys:'Cardiovascular System'},
  {q:'Enlargement of which of the following chambers of the heart can result in compression of the esophagus leading to symptoms of dysphagia?',opts:['Right atrium','Right ventricle','Left ventricle','Left atrium'],ans:3,exp:'The left atrium is the most posterior part of the heart and lies close to the esophagus; enlargement can compress it.',sys:'Cardiovascular System'},
  {q:'What is the most anterior part of the heart?',opts:['Right atrium','Right ventricle','Left ventricle','Left atrium'],ans:1,exp:'The most anterior part of the heart is the right ventricle.',sys:'Cardiovascular System'},
  {q:'During thoracentesis, a needle should be inserted over which border of the rib to avoid the neurovascular bundle?',opts:['Superior border of the upper rib','Superior border of the lower rib','Middle of the intercostal space','Inferior border of the lower rib'],ans:1,exp:'The intercostal neurovascular bundle (VAN: vein, artery, nerve) runs in the costal groove under the inferior border of the rib above. Insert the needle over the superior border of the lower rib to avoid it.',sys:'Respiratory System'},
  {q:'The intercostal neurovascular bundle runs in which order from superior to inferior?',opts:['Nerve, Artery, Vein','Vein, Artery, Nerve','Artery, Vein, Nerve','Vein, Nerve, Artery'],ans:1,exp:'From superior to inferior: Vein, Artery, Nerve (VAN). All run between the internal and innermost intercostal muscles in the subcostal groove.',sys:'Respiratory System'},
  {q:'Which bronchus is more commonly involved in aspiration of a foreign body in adults?',opts:['Left main bronchus','Right main bronchus','Right upper lobe bronchus','Left lower lobe bronchus'],ans:1,exp:'The right main bronchus is wider, shorter, and more vertical than the left, making aspiration more likely on the right side.',sys:'Respiratory System'},
  {q:'What is the anatomical landmark for the sternal angle (angle of Louis)?',opts:['T2–T3 intervertebral disc level, 1st costal cartilage','T4–T5 intervertebral disc level, 2nd costal cartilage','T6–T7 intervertebral disc level, 3rd costal cartilage','T3–T4 intervertebral disc level, 1st rib'],ans:1,exp:'The sternal angle (angle of Louis) is at the T4–T5 intervertebral disc level, marking the junction of the manubrium and body of sternum, and the level of the 2nd costal cartilage.',sys:'Respiratory System'},
  {q:'The pleural reflection reaches the midaxillary line at which rib level?',opts:['6th rib','8th rib','10th rib','12th rib'],ans:2,exp:'The pleural reflection (costodiaphragmatic recess) is at the 8th rib in the midclavicular line, 10th rib in the midaxillary line, and 12th rib posteriorly.',sys:'Respiratory System'},
  {q:'Horner\'s syndrome (ptosis, miosis, anhidrosis) can result from a Pancoast tumor located at which anatomical level?',opts:['Middle lobe of the lung','Apex of the lung','Hilum of the lung','Base of the lung'],ans:1,exp:'A Pancoast tumor at the apex of the lung can compress the sympathetic chain ganglia (T1 level), causing Horner\'s syndrome.',sys:'Respiratory System'},
  {q:'The phrenic nerve arises from which cervical nerve roots?',opts:['C2–C4','C3–C5','C4–C6','C5–C7'],ans:1,exp:'The phrenic nerve is derived from C3, C4, and C5 (\'C3, 4, 5 keep the diaphragm alive\'). It is the sole motor supply to the diaphragm.',sys:'Respiratory System'},
  {q:'The lung root (hilum) contains all of the following EXCEPT:',opts:['Pulmonary artery','Pulmonary veins','Main bronchus','Thoracic duct'],ans:3,exp:'The lung root (hilum) contains the main bronchus, pulmonary artery, pulmonary veins, bronchial vessels, lymphatics, and autonomic nerves. The thoracic duct is a mediastinal structure and does NOT enter the lung root.',sys:'Respiratory System'},
  {q:'The right lung has how many lobes and fissures?',opts:['2 lobes, 1 fissure','3 lobes, 2 fissures','2 lobes, 2 fissures','3 lobes, 1 fissure'],ans:1,exp:'The right lung has 3 lobes (upper, middle, lower) separated by the oblique and horizontal fissures. The left lung has 2 lobes and only an oblique fissure.',sys:'Respiratory System'},
  {q:'Injury to the external branch of the superior laryngeal nerve prevents a patient from doing which action?',opts:['Swallowing','Producing high-pitched sounds','Coughing effectively','Breathing through the larynx'],ans:1,exp:'The external branch of the superior laryngeal nerve innervates the cricothyroid muscle (only intrinsic laryngeal muscle NOT innervated by RLN). It tenses the vocal cords for high-pitched sounds.',sys:'Respiratory System'},
  {q:'Which muscle is innervated by the external branch of the superior laryngeal nerve?',opts:['Thyroarytenoid','Cricothyroid','Posterior cricoarytenoid','Lateral cricoarytenoid'],ans:1,exp:'The cricothyroid is the only intrinsic laryngeal muscle NOT innervated by the recurrent laryngeal nerve. It is innervated by the external branch of the superior laryngeal nerve.',sys:'Respiratory System'},
  {q:'Which sinuses drain into the middle meatus of the nose?',opts:['Frontal, maxillary, anterior ethmoid sinuses (via hiatus semilunaris)','Sphenoid sinus and posterior ethmoid','Maxillary sinus only','All paranasal sinuses'],ans:0,exp:'The middle meatus receives drainage from the frontal sinus, maxillary sinus, and anterior ethmoid cells via the hiatus semilunaris and infundibulum.',sys:'Respiratory System'},
  {q:'Situs inversus (mirror-image reversal of organ positioning) is associated with which syndrome when combined with bronchiectasis and infertility?',opts:['DiGeorge syndrome','Kartagener syndrome (Primary ciliary dyskinesia)','Turner syndrome','Klinefelter syndrome'],ans:1,exp:'Kartagener syndrome (primary ciliary dyskinesia) is caused by a dynein arm defect. Immotile embryonic node cilia randomize left-right signaling, causing situs inversus in ~50%. Bronchiectasis and male infertility result from immotile respiratory/sperm cilia.',sys:'Respiratory System'},
  {q:'A 25-year-old tall thin man develops sudden chest pain and dyspnea. On exam, breath sounds are absent on the right, trachea is deviated to the left, and BP is dropping. He is in severe distress. Which type of pneumothorax requires immediate needle decompression?',opts:['Simple spontaneous pneumothorax','Open pneumothorax','Tension pneumothorax','Massive hemothorax','Chylothorax'],ans:2,exp:'Tension pneumothorax occurs when air continues to enter the pleural space but cannot escape (one-way valve mechanism), compressing the mediastinum and shifting the trachea away from the affected side. This is a medical emergency.',sys:'Respiratory System'},
  {q:'A 22-year-old man sustains a stab wound to the right chest wall. You notice air is audibly entering the wound during each inspiration. Which type of pneumothorax does this represent?',opts:['Tension pneumothorax','Simple spontaneous pneumothorax','Open communicating pneumothorax','Hemothorax','Flail chest'],ans:2,exp:'An open (communicating) pneumothorax occurs when a chest wall defect allows atmospheric air to enter the pleural space on inspiration, equalizing pressure and preventing lung expansion.',sys:'Respiratory System'},
  {q:'The intercostal neurovascular bundle (vein, artery, nerve — VAN) runs in which groove of the rib?',opts:['Superior (upper) border groove','Inferior (lower subcostal) groove','Midrib groove','Lateral rib surface','Anterior rib surface only'],ans:1,exp:'The intercostal VAN (vein superiormost, then artery, then nerve) runs in the subcostal groove on the inferior surface of each rib. Thoracentesis needles are inserted just above the upper border of the lower rib to avoid injuring the bundle.',sys:'Respiratory System'},
  {q:'A 45-year-old man is brought in after a high-speed MVA. On examination, a segment of the right chest wall moves inward during inspiration and outward during expiration. X-ray shows multiple segmental rib fractures. What is this condition called?',opts:['Open pneumothorax','Tension pneumothorax','Flail chest','Traumatic hemothorax','Pulmonary contusion'],ans:2,exp:'Flail chest occurs when a segment of the chest wall loses bony continuity (≥3 consecutive ribs fractured in ≥2 places), causing paradoxical inward movement during inspiration due to negative intrathoracic pressure.',sys:'Respiratory System'},
  {q:'A patient on positive pressure ventilation has paradoxical movement of the diaphragm — it descends on expiration and ascends on inspiration. This is seen in what condition?',opts:['Normal breathing','Flail chest','Phrenic nerve palsy','Tension pneumothorax','Hemothorax'],ans:2,exp:'Phrenic nerve palsy causes paradoxical movement of the diaphragm: on inspiration it is pushed up by rising intraabdominal pressure and descends during expiration — the opposite of normal.',sys:'Respiratory System'},
  {q:'The costodiaphragmatic recess is the lowest extent of the pleural cavity. At which vertebral level does it reach posteriorly?',opts:['T8','T10','T12','L1','T6'],ans:2,exp:'The costodiaphragmatic recess reaches to approximately T12 posteriorly (12th rib level), T10 laterally (midaxillary line), and T8 anteriorly. This is important for thoracentesis and understanding pleural effusion distribution.',sys:'Respiratory System'},
  {q:'Compared to the left main bronchus, the right main bronchus has a specific anatomical configuration. Which clinical consequence follows directly from this configuration?',opts:['Foreign bodies more often lodge in the left lower lobe','The left lung is more prone to aspiration pneumonia','Inhaled foreign bodies and aspirated material preferentially enter the right bronchial tree','The right lung is more susceptible to spontaneous pneumothorax','Endobronchial intubation preferentially goes left'],ans:2,exp:'Because the right main bronchus is wider, shorter, and more vertical (more in line with the trachea), foreign bodies and aspirated material preferentially enter the right bronchus, particularly the right lower lobe bronchus.',sys:'Respiratory System'},
  {q:'As it crosses the lateral border of the first rib, a named artery changes its name. What is the new name of this vessel distal to that landmark?',opts:['Brachial artery','Radial artery','Thoracoacromial artery','Axillary artery','Lateral thoracic artery'],ans:3,exp:'The subclavian artery becomes the axillary artery as it crosses the lateral border of the first rib. It is the same vessel with different names at different anatomical locations.',sys:'Respiratory System'},
  {q:'A 30-year-old woman develops Horner\'s syndrome, arm weakness, and hand paresthesias after cervical rib surgery. Which neurovascular bundle is most likely injured?',opts:['Phrenic nerve and subclavian vein','Brachial plexus and subclavian artery at the thoracic outlet','Vagus nerve and internal carotid artery','Accessory nerve and external jugular vein','Sympathetic chain and vertebral artery'],ans:1,exp:'Thoracic outlet syndrome compresses the brachial plexus (lower trunk — C8, T1) and subclavian vessels between the scalene muscles, cervical rib, and first rib. Horner\'s syndrome indicates sympathetic chain involvement.',sys:'Respiratory System'},
  {q:'Which intercostal space is at the level of the sternal angle (angle of Louis)?',opts:['1st','2nd','3rd','4th','5th'],ans:1,exp:'The sternal angle (angle of Louis) is at the junction of the manubrium and body of the sternum, at the level of the 2nd rib/2nd intercostal space — a key surface landmark for counting ribs.',sys:'Respiratory System'},
  {q:'A 60-year-old man has a tension pneumothorax. Emergency needle decompression is performed. Which intercostal space and line is used?',opts:['2nd ICS, midclavicular line','5th ICS, midaxillary line','4th ICS, anterior axillary line','3rd ICS, midclavicular line','1st ICS, midclavicular line'],ans:0,exp:'Emergency needle decompression of tension pneumothorax is performed at the 2nd intercostal space, midclavicular line — inserted just above the 3rd rib to avoid the neurovascular bundle.',sys:'Respiratory System'},
  {q:'The \'safe triangle\' for chest drain insertion is bounded by which structures?',opts:['Sternum anteriorly, spine posteriorly, 5th rib inferiorly','Lateral border of pectoralis major, anterior border of latissimus dorsi, and base of axilla above the 5th ICS','Midclavicular line, midaxillary line, and 3rd ICS','2nd ICS, midclavicular line, and lateral rib','Subcostal margin and linea semilunaris'],ans:1,exp:'The safe triangle for chest drain insertion: anterior — lateral border of pectoralis major; posterior — anterior border of latissimus dorsi; inferior — base of axilla (5th ICS level). This avoids major vessels and organs.',sys:'Respiratory System'},
  {q:'A 55-year-old man sustains blunt chest trauma. A chest tube is inserted and immediately drains 1600 mL of blood, with ongoing output of 250 mL/hr. Which management is indicated?',opts:['Observation and serial imaging','Repeat chest X-ray and transfusion only','Emergent thoracotomy','CT pulmonary angiography','Flexible bronchoscopy'],ans:2,exp:'Massive hemothorax (>1500 mL initial drainage, or >200 mL/hr ongoing) is an indication for emergent thoracotomy to identify and control the bleeding source.',sys:'Respiratory System'},
  {q:'Which paranasal sinus is most frequently affected by sinusitis, and where is its drainage ostium located?',opts:['Frontal sinus; drains into the inferior meatus','Sphenoidal sinus; drains into the superior meatus','Maxillary sinus; drains into the middle meatus via a superiorly positioned ostium','Ethmoidal sinus; drains into the nasopharynx','Maxillary sinus; drains into the inferior meatus via an inferiorly positioned ostium'],ans:2,exp:'The maxillary sinus is the largest paranasal sinus and most commonly involved in sinusitis. Its drainage ostium is located high on its medial wall (near the roof), making gravity-dependent drainage poor and predisposing to fluid accumulation.',sys:'Respiratory System'},
  {q:'The following structures in the respiratory tract function to warm and humidify inspired air, EXCEPT?',opts:['Respiratory bronchioles','Terminal bronchioles','Bronchi','Trachea'],ans:0,exp:'Respiratory bronchioles are part of the respiratory portion where gas exchange occurs, not the conduction portion.',sys:'Respiratory System'},
  {q:'The following are characteristics of the right main bronchus which makes it more susceptible to obstruction by inhaled foreign bodies, EXCEPT?',opts:['Shorter','Wider','More vertical','Longer'],ans:3,exp:'The right main bronchus is shorter, wider, and more vertical, making it more susceptible to obstruction.',sys:'Respiratory System'},
  {q:'The recurrent laryngeal nerve innervates all the intrinsic muscles of the larynx, EXCEPT?',opts:['Posterior cricoarytenoid','Lateral cricoarytenoid','Vocalis','Cricothyroid'],ans:3,exp:'The cricothyroid is innervated by the external laryngeal nerve. All other intrinsic muscles are supplied by the recurrent laryngeal nerve.',sys:'Respiratory System'},
  {q:'What vessel carries blood from the alveoli in the lungs to the left atrium?',opts:['Pulmonary veins','Left pulmonary artery','Right pulmonary artery','Bronchial veins'],ans:0,exp:'The pulmonary veins carry oxygenated blood from the lungs to the left atrium.',sys:'Respiratory System'},
  {q:'The carina lies at which of the following levels?',opts:['Sternal angle','Xiphoid','Subcostal angle','Cricoid cartilage'],ans:0,exp:'The carina lies at the level of the sternal angle.',sys:'Respiratory System'},
  {q:'The phrenic nerve arises from which of the following cervical nerves?',opts:['C1-C2','C2-C4','C3-C5','C6-C7'],ans:2,exp:'The phrenic nerve arises from C3-C5 (Mnemonic: \'C3, 4, 5 keeps the diaphragm alive\').',sys:'Respiratory System'},
  {q:'Which structure is at greatest risk when inserting a left-sided chest tube in the 5th intercostal space, midaxillary line?',opts:['Right ventricle','Left atrium','Esophagus','Spleen'],ans:3,exp:'The spleen lies in the left hypochondriac region (posterior to ribs 9–11). A tube placed too low on the left can injure the spleen or stomach.',sys:'Gastrointestinal System'},
  {q:'The spleen is located posterior to which ribs?',opts:['Ribs 7–9','Ribs 9–11','Ribs 11–12','Ribs 5–7'],ans:1,exp:'The spleen lies posterior to ribs 9–11 on the left side. It is separated from the rib cage by the diaphragm.',sys:'Gastrointestinal System'},
  {q:'Which structure passes through the aortic hiatus of the diaphragm at T12?',opts:['Esophagus and vagus nerve','Aorta, thoracic duct, and azygos vein','Inferior vena cava','Sympathetic trunk'],ans:1,exp:'The aortic hiatus at T12 transmits the descending aorta, thoracic duct, and azygos vein. Remember: \'At T8 = IVC; T10 = Esophagus; T12 = Aorta.\'',sys:'Gastrointestinal System'},
  {q:'Which structure passes through the diaphragm at the T8 level?',opts:['Aorta','Esophagus','Inferior vena cava','Thoracic duct'],ans:2,exp:'The inferior vena cava (IVC) passes through the caval foramen at T8. The esophagus passes at T10, and the aorta at T12.',sys:'Gastrointestinal System'},
  {q:'The submandibular duct (Wharton\'s duct) opens at which location?',opts:['Lateral to the upper 2nd molar (parotid duct)','Lateral wall of oropharynx','Floor of the mouth beside the frenulum','Hard palate'],ans:2,exp:'The submandibular (Wharton\'s) duct opens at the sublingual papilla, on the floor of the mouth lateral to the frenulum of the tongue.',sys:'Gastrointestinal System'},
  {q:'Referred pain from appendicitis initially presents at which spinal cord level?',opts:['T4–T6','T8–T9','T10–T12','L1–L2'],ans:2,exp:'Early appendicitis presents as vague periumbilical pain (referred through T10–T12 visceral afferents) before localizing to the RLQ (somatic pain via L1 after parietal peritoneum is involved).',sys:'Gastrointestinal System'},
  {q:'McBurney\'s point (site of maximal tenderness in appendicitis) is located where?',opts:['1/3 from the right ASIS to the umbilicus','2/3 from the right ASIS to the umbilicus','1/3 from the umbilicus to the right ASIS','Midpoint of the right iliac fossa'],ans:2,exp:'McBurney\'s point is located 1/3 of the distance from the right anterior superior iliac spine (ASIS) to the umbilicus.',sys:'Gastrointestinal System'},
  {q:'The layers of the anterior abdominal wall from outside to inside are:',opts:['Skin → subcutaneous fat → Scarpa\'s fascia → external oblique → internal oblique → transversus abdominis → transversalis fascia → peritoneum','Skin → Scarpa\'s fascia → Camper\'s fascia → rectus abdominis → peritoneum','Skin → subcutaneous fat → rectus sheath → rectus abdominis → peritoneum','Skin → Camper\'s fascia → external oblique → transversus abdominis → peritoneum'],ans:0,exp:'Layers of the anterolateral abdominal wall (lateral to rectus): Skin → Camper\'s (superficial fatty fascia) → Scarpa\'s (deep membranous fascia) → External oblique → Internal oblique → Transversus abdominis → Transversalis fascia → Extraperitoneal fat → Parietal peritoneum.',sys:'Gastrointestinal System'},
  {q:'Hesselbach\'s triangle is bounded by all of the following EXCEPT:',opts:['Inferior epigastric vessels (superolaterally)','Lateral border of rectus abdominis (medially)','Inguinal ligament (inferiorly)','Femoral vein (laterally)'],ans:3,exp:'Hesselbach\'s triangle is bounded by: inferior epigastric artery (lateral), lateral border of rectus abdominis (medial), inguinal ligament (inferior). Direct inguinal hernias protrude through this triangle.',sys:'Gastrointestinal System'},
  {q:'The portal triad (liver) contains which three structures?',opts:['Portal vein, hepatic artery, bile duct','Portal vein, hepatic vein, bile duct','Hepatic artery, IVC, bile duct','Portal vein, hepatic artery, lymphatic vessel'],ans:0,exp:'The portal triad at each corner of the hepatic lobule contains: a branch of the portal vein, a branch of the hepatic artery, and a bile ductule.',sys:'Gastrointestinal System'},
  {q:'The celiac trunk (axis) supplies which abdominal organs?',opts:['Stomach, duodenum (1st and 2nd parts), liver, gallbladder, spleen, pancreas (head)','Foregut derivatives: stomach, liver, gallbladder, spleen, upper duodenum, pancreas','Midgut: small intestine, ascending colon, 2/3 of transverse colon','Hindgut: descending and sigmoid colon, rectum'],ans:1,exp:'The celiac trunk supplies foregut derivatives: lower esophagus, stomach, liver, gallbladder, spleen, and the proximal duodenum and pancreas.',sys:'Gastrointestinal System'},
  {q:'The superior mesenteric artery (SMA) supplies which portion of the gastrointestinal tract?',opts:['Foregut derivatives','Midgut: from 2nd part of duodenum to 2/3 of transverse colon','Hindgut: splenic flexure to rectum','Entire small intestine only'],ans:1,exp:'The SMA supplies midgut structures: 2nd–4th parts of duodenum, jejunum, ileum, cecum, ascending colon, and proximal 2/3 of transverse colon.',sys:'Gastrointestinal System'},
  {q:'The spleen is part of which organ system and functions include all EXCEPT:',opts:['Filtration of old red blood cells','Storage of platelets','Production of bile','Immune function (largest lymphoid organ)'],ans:2,exp:'The spleen filters blood, stores platelets (~30% at any time), serves as a major immune organ, and acts as erythrocyte reservoir. Bile is produced by the LIVER, not the spleen.',sys:'Gastrointestinal System'},
  {q:'Courvoisier\'s sign (palpable, nontender gallbladder + jaundice) suggests which pathology?',opts:['Acute cholecystitis','Gallstone impaction at cystic duct','Pancreatic head malignancy causing biliary obstruction','Primary sclerosing cholangitis'],ans:2,exp:'Courvoisier\'s law: a palpable, non-tender, distended gallbladder with jaundice suggests malignant (rather than stone) obstruction of the common bile duct, most commonly from pancreatic head cancer.',sys:'Gastrointestinal System'},
  {q:'Murphy\'s sign is used to diagnose which condition?',opts:['Pancreatitis','Acute cholecystitis','Appendicitis','Renal colic'],ans:1,exp:'Murphy\'s sign: inspiratory arrest upon deep palpation of the right upper quadrant (RUQ) during inspiration. It is positive in acute cholecystitis due to an inflamed gallbladder descending onto the examiner\'s fingers.',sys:'Gastrointestinal System'},
  {q:'The most common site for peptic ulcer disease (PUD) is:',opts:['Lesser curvature of the stomach','First part of the duodenum (D1)','Second part of the duodenum (D2)','Pylorus of the stomach'],ans:1,exp:'Duodenal ulcers (most common PUD) occur most frequently in the first part of the duodenum (D1, the cap). Gastric ulcers are less common and favor the lesser curvature.',sys:'Gastrointestinal System'},
  {q:'Which hernias are more common in females and pass through the femoral canal?',opts:['Indirect inguinal hernias','Direct inguinal hernias','Femoral hernias','Obturator hernias'],ans:2,exp:'Femoral hernias pass medial to the femoral vein through the femoral canal. They are more common in females (due to wider pelvis), but inguinal hernias are still more common overall in both sexes.',sys:'Gastrointestinal System'},
  {q:'The epiploic foramen (foramen of Winslow) provides communication between which two structures?',opts:['Greater and lesser sacs of peritoneum','Peritoneal cavity and pleural cavity','Greater sac and retroperitoneum','Lesser sac and pelvic peritoneum'],ans:0,exp:'The epiploic foramen (foramen of Winslow) connects the greater peritoneal sac (greater sac) with the lesser peritoneal sac (omental bursa/lesser sac) posterior to the hepatoduodenal ligament.',sys:'Gastrointestinal System'},
  {q:'The arcuate line (linea semicircularis) marks the lower limit of the posterior rectus sheath. Below this line, the posterior sheath of the rectus abdominis is absent. This occurs at approximately:',opts:['Umbilicus','Halfway between umbilicus and pubic symphysis','Just above the pubic symphysis','Level of the anterior superior iliac spine'],ans:1,exp:'The arcuate line is at about halfway between the umbilicus and pubic symphysis. Below this, all aponeuroses pass anterior to the rectus abdominis, leaving the posterior wall as only transversalis fascia.',sys:'Gastrointestinal System'},
  {q:'The transpyloric plane of Addison is at which vertebral level and passes through which structures?',opts:['L1; passes through pylorus, fundus of gallbladder, pancreatic neck, hilum of kidneys','L2; passes through the umbilicus and aortic bifurcation','T12; passes through the esophageal hiatus and celiac axis','L3; passes through the iliac crests'],ans:0,exp:'The transpyloric plane (L1) passes through the pylorus, neck of pancreas, duodenojejunal flexure, fundus of gallbladder, splenic hilum, and renal hila.',sys:'Gastrointestinal System'},
  {q:'Grey Turner\'s sign and Cullen\'s sign are associated with which condition?',opts:['Acute appendicitis','Acute pancreatitis with retroperitoneal hemorrhage','Ruptured ectopic pregnancy','Perforated peptic ulcer'],ans:1,exp:'Grey Turner\'s sign (flank bruising) and Cullen\'s sign (periumbilical bruising) indicate retroperitoneal hemorrhage, classically seen in severe acute pancreatitis.',sys:'Gastrointestinal System'},
  {q:'VACTERL association involves which constellation of defects?',opts:['Vertebral defects, Anal atresia, Cardiac defects, Tracheo-Esophageal fistula, Renal anomalies, Limb defects','Ventricular septal defect, Atrial septal defect, Cleft palate, Tracheomalacia, Esophageal atresia, Renal failure, Liver disease','Virilization, Ambiguous genitalia, Clitoromegaly, Thyroid anomalies, Esophageal atresia, Renal failure, Limb defects','Vertebral defects, Aortic coarctation, Cardiomegaly, Tracheal stenosis, Esophageal duplication, Renal dysplasia, Limb hypertrophy'],ans:0,exp:'VACTERL: Vertebral anomalies, Anal atresia, Cardiac defects (VSD most common), Tracheo-Esophageal fistula, Esophageal atresia, Renal anomalies, Limb defects (radial ray anomalies). These often co-occur.',sys:'Gastrointestinal System'},
  {q:'The McBurney incision for appendectomy is made at McBurney\'s point. What is the direction of the muscle-splitting (gridiron) incision?',opts:['Transverse','Perpendicular to the line from ASIS to umbilicus (gridiron/muscle-splitting)','Vertical (paramedian)','Oblique parallel to the inguinal ligament'],ans:1,exp:'The gridiron (muscle-splitting) incision at McBurney\'s point runs perpendicular to the line from the ASIS to the umbilicus, splitting the external oblique, internal oblique, and transversus abdominis along their fibers.',sys:'Gastrointestinal System'},
  {q:'The FAST (Focused Assessment with Sonography in Trauma) exam evaluates fluid in which four windows?',opts:['Pericardial, hepatorenal (Morrison\'s pouch), splenorenal, pelvic','Subhepatic, subdiaphragmatic, paracolic, retroperitoneal','Pericardial, subdiaphragmatic, paracolic, retroperitoneal','Hepatorenal, pericardial, perisplenic, bladder dome'],ans:0,exp:'FAST evaluates: Pericardial window (cardiac tamponade), Hepatorenal space (Morrison\'s pouch, most dependent space in supine patient), Splenorenal space, and Pelvis/Douglas\' pouch.',sys:'Gastrointestinal System'},
  {q:'A 45-year-old man presents with epigastric pain radiating to the back after alcohol use. Which part of the duodenum is most intimately related to the head of the pancreas?',opts:['First part (D1)','Second part (D2)','Third part (D3)','Fourth part (D4)','Duodenojejunal flexure'],ans:1,exp:'D2 (descending duodenum) is embraced by the head of the pancreas and receives the common bile duct and main pancreatic duct at the major duodenal papilla.',sys:'Gastrointestinal System'},
  {q:'Which structure marks the transition from the foregut to the midgut in the duodenum?',opts:['Major duodenal papilla','Minor duodenal papilla','Entry of the bile duct into D2','Entry of the superior mesenteric artery','Duodenojejunal flexure'],ans:2,exp:'The entry of the bile duct (hepatopancreatic ampulla) into D2 marks the foregut–midgut boundary; the SMA crosses D3.',sys:'Gastrointestinal System'},
  {q:'A 60-year-old woman has a \'silhouette sign\' of the duodenum on barium swallow, suggesting extrinsic compression. The third part of the duodenum (D3) is compressed between which two structures?',opts:['Aorta and inferior vena cava','Superior mesenteric artery and aorta','Celiac trunk and SMA','Right renal artery and IVC','Portal vein and hepatic artery'],ans:1,exp:'D3 (horizontal duodenum) crosses anterior to the aorta and posterior to the SMA; nutcracker (SMA syndrome) causes compression here.',sys:'Gastrointestinal System'},
  {q:'Which peritoneal ligament carries the left gastric artery along the lesser curvature of the stomach?',opts:['Gastrosplenic ligament','Gastrocolic ligament','Gastrohepatic ligament (hepatogastric)','Gastrophrenic ligament','Gastroduodenal ligament'],ans:2,exp:'The hepatogastric ligament (part of the lesser omentum) carries the left gastric artery and vein along the lesser curvature.',sys:'Gastrointestinal System'},
  {q:'A surgeon is performing a highly selective vagotomy. Which vessel runs along the lesser curvature and is the key landmark?',opts:['Right gastroepiploic artery','Left gastroepiploic artery','Left gastric artery','Short gastric arteries','Gastroduodenal artery'],ans:2,exp:'The left gastric artery runs in the lesser omentum along the lesser curvature and is the main landmark for highly selective vagotomy.',sys:'Gastrointestinal System'},
  {q:'A 35-year-old man vomits forcefully after drinking heavily and develops hematemesis. Endoscopy reveals a longitudinal mucosal tear at the gastroesophageal junction. Which vessel is most likely bleeding?',opts:['Left gastric artery','Right gastric artery','Esophageal branch of the left gastric artery','Gastroduodenal artery','Inferior phrenic artery'],ans:2,exp:'Mallory-Weiss tears occur at the GEJ and bleed from esophageal branches of the left gastric artery.',sys:'Gastrointestinal System'},
  {q:'Which artery supplies the greater curvature of the stomach on its right side?',opts:['Left gastric artery','Right gastric artery','Left gastroepiploic artery','Right gastroepiploic artery','Short gastric arteries'],ans:3,exp:'The right gastroepiploic artery (from the gastroduodenal artery) supplies the right portion of the greater curvature.',sys:'Gastrointestinal System'},
  {q:'Short gastric arteries supplying the fundus of the stomach arise from which vessel?',opts:['Left gastric artery','Right gastric artery','Splenic artery','Left gastroepiploic artery','Inferior phrenic artery'],ans:2,exp:'Short gastric arteries are branches of the splenic artery that supply the fundus of the stomach.',sys:'Gastrointestinal System'},
  {q:'A 50-year-old man has portal hypertension. Which anastomosis at the gastroesophageal junction is most likely to become variceal?',opts:['Left gastric (coronary) vein draining into the portal vein','Right gastroepiploic vein','Splenic vein','Inferior mesenteric vein','Hepatic veins'],ans:0,exp:'The left gastric (coronary) vein connects with esophageal veins draining into the azygos system, forming the portosystemic anastomosis at the GEJ responsible for esophageal varices.',sys:'Gastrointestinal System'},
  {q:'The celiac trunk supplies which part of the GI tract?',opts:['Midgut only','Hindgut only','Foregut (esophagus to mid-duodenum, plus liver, spleen, pancreas)','Midgut and hindgut','Entire large intestine'],ans:2,exp:'The celiac trunk is the artery of the foregut, supplying from the lower esophagus to the proximal duodenum, as well as the liver, gallbladder, spleen, and pancreas.',sys:'Gastrointestinal System'},
  {q:'The superior mesenteric artery (SMA) supplies the bowel from which point to which point?',opts:['Lower esophagus to sigmoid colon','Mid-duodenum to mid-transverse colon (splenic flexure)','Jejunum to descending colon','Stomach to sigmoid colon','Entire large intestine'],ans:1,exp:'The SMA is the artery of the midgut, supplying from the mid-duodenum (D2) to approximately the splenic flexure of the transverse colon.',sys:'Gastrointestinal System'},
  {q:'The inferior mesenteric artery (IMA) supplies which segment of bowel?',opts:['Entire large bowel','Transverse colon and descending colon only','Descending colon to upper rectum (hindgut)','Sigmoid colon and rectum only','Cecum and ascending colon'],ans:2,exp:'The IMA is the artery of the hindgut, supplying from the splenic flexure/descending colon to the upper rectum via its branches (left colic, sigmoid, superior rectal arteries).',sys:'Gastrointestinal System'},
  {q:'A 70-year-old man develops ischemic colitis after repair of an abdominal aortic aneurysm. Which area of the colon is at greatest risk due to its position at the junction of two major arterial territories?',opts:['Cecum','Hepatic flexure','Splenic flexure','Sigmoid colon','Rectum'],ans:2,exp:'Griffith\'s point at the splenic flexure is a watershed zone between the SMA and IMA territories, making it most vulnerable to ischemia.',sys:'Gastrointestinal System'},
  {q:'A 75-year-old woman develops ischemia at the rectosigmoid junction after ligation of the inferior mesenteric artery. The ischemia occurs at a watershed zone between which two arterial territories?',opts:['Middle colic artery and left colic artery','Sigmoid arteries and the superior rectal artery','Left colic artery and the superior rectal artery','Right colic artery and the ileocolic artery','Superior rectal artery and the middle rectal artery'],ans:1,exp:'Sudeck\'s point is the watershed zone between the sigmoid arteries and the superior rectal artery, located at the rectosigmoid junction.',sys:'Gastrointestinal System'},
  {q:'A 65-year-old man has left lower quadrant pain and fever. CT shows outpouchings of the sigmoid colon. Which part of the large intestine is most commonly affected by diverticular disease?',opts:['Cecum','Ascending colon','Transverse colon','Sigmoid colon','Rectum'],ans:3,exp:'Diverticulosis most commonly affects the sigmoid colon (>90% of cases) due to high intraluminal pressure and the presence of vasa recta penetration points.',sys:'Gastrointestinal System'},
  {q:'Which feature best distinguishes the jejunum from the ileum on gross anatomy?',opts:['Jejunum has more fat in the mesentery','Jejunum has thicker walls and larger plicae circulares','Ileum has a wider lumen','Ileum is located in the left lower quadrant','Jejunum has Peyer\'s patches'],ans:1,exp:'The jejunum has thicker walls, larger and more numerous plicae circulares (valvulae conniventes), and less mesenteric fat compared to the ileum. Peyer\'s patches are found in the ileum.',sys:'Gastrointestinal System'},
  {q:'Peyer\'s patches are lymphoid aggregates found predominantly in which part of the small intestine?',opts:['Duodenum','Proximal jejunum','Distal ileum','Cecum','Ascending colon'],ans:2,exp:'Peyer\'s patches are aggregated lymphoid nodules found predominantly in the distal ileum, forming an important component of gut-associated lymphoid tissue (GALT).',sys:'Gastrointestinal System'},
  {q:'A 55-year-old woman with cirrhosis has a new right upper quadrant mass. The Pringle maneuver is used intraoperatively to control bleeding. Which structure is compressed?',opts:['Hepatic veins','Portal vein and hepatic artery in the hepatoduodenal ligament','Common bile duct only','Inferior vena cava','Splenic artery'],ans:1,exp:'The Pringle maneuver compresses the hepatoduodenal ligament (free edge of the lesser omentum) to occlude the portal vein and hepatic artery, temporarily halting hepatic blood inflow.',sys:'Gastrointestinal System'},
  {q:'A surgeon identifies Calot\'s triangle during laparoscopic cholecystectomy. Which structure is found within this triangle?',opts:['Common bile duct','Cystic artery','Right hepatic artery','Portal vein','Gastroduodenal artery'],ans:1,exp:'The cystic artery (typically a branch of the right hepatic artery) is the key structure found within Calot\'s triangle, bounded by the cystic duct, common hepatic duct, and the liver.',sys:'Gastrointestinal System'},
  {q:'What are the boundaries of Calot\'s triangle?',opts:['Cystic duct, common bile duct, and liver','Cystic duct, common hepatic duct, and inferior liver surface','Common bile duct, portal vein, and hepatic artery','Gallbladder, cystic duct, and common bile duct','Hepatic artery, portal vein, and liver'],ans:1,exp:'Calot\'s triangle (hepatocystic triangle) is bounded superiorly by the inferior surface of the liver, medially by the common hepatic duct, and inferiorly by the cystic duct.',sys:'Gastrointestinal System'},
  {q:'A 22-year-old medical student has periumbilical pain that shifts to the right iliac fossa. At which spinal level does the umbilicus receive its sensory innervation, explaining the referred pain of early appendicitis?',opts:['T8','T9','T10','T11','T12'],ans:2,exp:'The umbilicus is innervated by T10. Early appendicitis causes visceral pain referred to the T10 dermatome (periumbilical), before somatic peritoneal involvement shifts pain to the RIF.',sys:'Gastrointestinal System'},
  {q:'A 70-year-old woman with constipation has left lower quadrant pain and a palpable mass. Colonoscopy confirms diverticulitis. Where do diverticula most commonly form in the colon wall?',opts:['Along the taeniae coli where vessels penetrate','At the ileocecal valve','Along the appendices epiploicae','At the hepatic flexure','At the haustral folds'],ans:0,exp:'Diverticula form at the points where vasa recta (blood vessels) penetrate the circular muscle layer alongside the taeniae coli, creating areas of relative weakness.',sys:'Gastrointestinal System'},
  {q:'Which structure forms the anterior boundary of the epiploic foramen (foramen of Winslow)?',opts:['Inferior vena cava','Caudate lobe of the liver','Hepatoduodenal ligament (free edge of lesser omentum)','First part of duodenum','Common bile duct'],ans:2,exp:'The hepatoduodenal ligament (free edge of the lesser omentum containing the portal triad) forms the anterior boundary of the epiploic foramen.',sys:'Gastrointestinal System'},
  {q:'During a right hemicolectomy, the surgeon must avoid injury to which major vessel that crosses the D3?',opts:['Inferior mesenteric artery','Right colic artery','Superior mesenteric artery','Ileocolic artery','Right gastroepiploic artery'],ans:2,exp:'The superior mesenteric artery crosses anterior to D3 (horizontal part of the duodenum) and must be carefully identified during right hemicolectomy.',sys:'Gastrointestinal System'},
  {q:'What is the primary arterial supply to the first part of the duodenum (D1)?',opts:['Superior mesenteric artery','Superior pancreaticoduodenal artery (from gastroduodenal artery)','Right gastric artery','Common hepatic artery','Inferior pancreaticoduodenal artery'],ans:1,exp:'D1 is supplied mainly by the superior pancreaticoduodenal artery, a branch of the gastroduodenal artery (from the celiac trunk).',sys:'Gastrointestinal System'},
  {q:'A patient with peptic ulcer disease erodes the gastroduodenal artery. This artery runs posterior to which part of the duodenum?',opts:['D1','D2','D3','D4','Duodenojejunal flexure'],ans:0,exp:'The gastroduodenal artery runs posterior to D1; posterior duodenal ulcers can erode into it, causing massive hemorrhage.',sys:'Gastrointestinal System'},
  {q:'Which structure anchors the duodenojejunal flexure superiorly and marks the clinical start of the jejunum?',opts:['Hepatoduodenal ligament','Gastrocolic ligament','Suspensory muscle of the duodenum','Phrenicocolonic ligament','Gastrorenal ligament'],ans:2,exp:'The ligament of Treitz (suspensory muscle of the duodenum) attaches the duodenojejunal flexure to the right crus of the diaphragm and marks the start of the jejunum.',sys:'Gastrointestinal System'},
  {q:'A 60-year-old man has hematemesis and is found to have Mallory-Weiss syndrome. At which anatomical location does the mucosal tear classically occur?',opts:['Fundus of the stomach','Body of the stomach','Gastroesophageal junction','Pylorus','Cardia only'],ans:2,exp:'Mallory-Weiss tears are longitudinal mucosal lacerations at or just below the gastroesophageal junction, caused by forceful vomiting/retching increasing intragastric pressure.',sys:'Gastrointestinal System'},
  {q:'The gastrocolic ligament forms part of which structure?',opts:['Lesser omentum','Greater omentum','Mesentery of the small bowel','Transverse mesocolon','Sigmoid mesocolon'],ans:1,exp:'The gastrocolic ligament connects the greater curvature of the stomach to the transverse colon and forms part of the greater omentum.',sys:'Gastrointestinal System'},
  {q:'Which structure is the embryological remnant of the ventral mesentery that persists as a peritoneal fold from the liver to the anterior abdominal wall?',opts:['Gastrohepatic ligament','Falciform ligament','Lesser omentum','Hepatoduodenal ligament','Ligamentum teres hepatis'],ans:1,exp:'The falciform ligament is the remnant of the ventral mesentery, connecting the anterior abdominal wall to the liver. It contains the ligamentum teres hepatis (obliterated umbilical vein).',sys:'Gastrointestinal System'},
  {q:'A surgeon mobilizes the hepatic flexure of the colon. Which organ lies immediately posterior and medial to the hepatic flexure?',opts:['Right kidney','Gallbladder','Duodenum (D2)','Right adrenal gland','Liver'],ans:2,exp:'The hepatic flexure of the colon is related posteriorly to D2 (descending duodenum); the right kidney lies more posterolateral.',sys:'Gastrointestinal System'},
  {q:'Which of the following is a feature of the ileum but NOT the jejunum?',opts:['Plicae circulares','Villi','Peyer\'s patches','Goblet cells','Enterocytes'],ans:2,exp:'Peyer\'s patches (aggregated lymphoid nodules) are characteristic of the ileum, particularly the distal ileum, and are not found in the jejunum.',sys:'Gastrointestinal System'},
  {q:'A 40-year-old woman has postprandial epigastric pain relieved by leaning forward, and weight loss. CT suggests superior mesenteric artery syndrome. Which structure is trapped?',opts:['Duodenum D1','Duodenum D2','Duodenum D3','Jejunum','Stomach'],ans:2,exp:'In SMA syndrome, D3 (horizontal/transverse duodenum) is compressed between the SMA anteriorly and the aorta posteriorly, causing obstruction.',sys:'Gastrointestinal System'},
  {q:'The arc of Riolan (meandering mesenteric artery) is an anastomosis between which two vessels?',opts:['SMA and celiac trunk','Middle colic artery (SMA) and left colic artery (IMA)','Right colic artery and ileocolic artery','Superior rectal and middle rectal arteries','Splenic artery and left gastric artery'],ans:1,exp:'The arc of Riolan (meandering mesenteric artery) is an anastomosis between the middle colic artery (from SMA) and the left colic artery (from IMA), serving as a collateral pathway.',sys:'Gastrointestinal System'},
  {q:'A 65-year-old man undergoes abdominoperineal resection for rectal carcinoma. The inferior mesenteric artery is ligated. Which anastomotic pathway is most important for colonic blood supply?',opts:['Arc of Riolan / marginal artery of Drummond','Short gastric arteries','Portal-systemic anastomosis','Right colic artery','Superior rectal artery'],ans:0,exp:'The marginal artery of Drummond (and arc of Riolan) provides anastomotic continuity between the SMA and IMA territories, crucial after IMA ligation.',sys:'Gastrointestinal System'},
  {q:'Which layer of the stomach is responsible for the rugae visible on endoscopy?',opts:['Serosa','Muscularis externa','Submucosa','Mucosa with its muscularis mucosae','Oblique muscle layer'],ans:3,exp:'Rugae are longitudinal folds of the gastric mucosa (and submucosa) that allow stomach distension; they are most prominent along the greater curvature.',sys:'Gastrointestinal System'},
  {q:'A 55-year-old man has hematemesis after a forceful episode of vomiting during heavy drinking. Endoscopy shows a linear tear at the Z-line. Which clinical term describes this?',opts:['Boerhaave syndrome','Mallory-Weiss syndrome','Dieulafoy lesion','Esophageal varices','Cameron lesion'],ans:1,exp:'Mallory-Weiss syndrome describes mucosal (not full-thickness) tears at the GEJ (Z-line). Boerhaave syndrome is full-thickness esophageal rupture.',sys:'Gastrointestinal System'},
  {q:'Which mesenteric structure contains the marginal artery of Drummond?',opts:['Lesser omentum','Greater omentum','Mesocolon (mesentery of the colon)','Transverse mesocolon only','Sigmoid mesocolon only'],ans:2,exp:'The marginal artery of Drummond runs along the mesenteric border of the entire colon within the mesocolon, forming a continuous arterial arcade from the ileocolic to the superior rectal artery.',sys:'Gastrointestinal System'},
  {q:'A 70-year-old woman undergoes surgery for acute mesenteric ischemia. Which segment of colon is typically spared because it has a dual blood supply?',opts:['Splenic flexure','Sigmoid colon','Rectum','Descending colon','Cecum'],ans:2,exp:'The rectum receives blood from three sources (superior rectal from IMA, middle rectal from internal iliac, inferior rectal from pudendal), giving it relative protection against ischemia.',sys:'Gastrointestinal System'},
  {q:'Which part of the duodenum contains the minor duodenal papilla (opening of the accessory pancreatic duct)?',opts:['D1','D2','D3','D4','Duodenojejunal flexure'],ans:1,exp:'The minor duodenal papilla (opening of Santorini\'s accessory duct) is located in D2, approximately 2 cm proximal to the major duodenal papilla.',sys:'Gastrointestinal System'},
  {q:'A patient has the \'string of pearls\' sign on plain X-ray. This represents air in the valvulae conniventes of which bowel segment?',opts:['Duodenum','Jejunum','Ileum','Cecum','Sigmoid colon'],ans:1,exp:'The \'string of pearls\' sign represents gas trapped between the valvulae conniventes (plicae circulares) of the jejunum in small bowel obstruction.',sys:'Gastrointestinal System'},
  {q:'Which of the following is the correct blood supply to the descending colon?',opts:['Right colic artery from SMA','Middle colic artery from SMA','Left colic artery from IMA','Sigmoid arteries from IMA','Ileocolic artery from SMA'],ans:2,exp:'The descending colon is supplied by the left colic artery, a branch of the inferior mesenteric artery (IMA).',sys:'Gastrointestinal System'},
  {q:'A patient presents with vomiting of bile-stained material. Where does bile enter the gastrointestinal tract?',opts:['D1 via the minor duodenal papilla','D2 via the major duodenal papilla (hepatopancreatic ampulla)','D3 via the major papilla','Pylorus','Gastroduodenal junction'],ans:1,exp:'Bile (and pancreatic juice) enter D2 via the major duodenal papilla at the hepatopancreatic ampulla of Vater, controlled by the sphincter of Oddi.',sys:'Gastrointestinal System'},
  {q:'The gastrosplenic ligament contains which vessels?',opts:['Left gastric artery and vein','Short gastric arteries and left gastroepiploic vessels','Right gastroepiploic artery','Splenic artery','Inferior phrenic vessels'],ans:1,exp:'The gastrosplenic ligament contains the short gastric arteries and the left gastroepiploic vessels connecting the greater curvature fundus to the spleen.',sys:'Gastrointestinal System'},
  {q:'A 50-year-old man with chronic GERD undergoes fundoplication. The surgeon enters the lesser sac. Through which opening is the lesser sac normally accessed?',opts:['Hepatoduodenal ligament','Epiploic foramen (foramen of Winslow)','Gastrohepatic ligament','Gastrocolic ligament','Falciform ligament'],ans:1,exp:'The lesser sac (omental bursa) is normally accessed through the epiploic foramen (foramen of Winslow) or by opening the gastrocolic ligament.',sys:'Gastrointestinal System'},
  {q:'The ileocecal valve prevents backflow of colonic contents into the ileum. The base of the appendix is attached to which structure?',opts:['Terminal ileum','Cecum at the convergence of the taeniae coli','Ascending colon','Ileocecal junction','Posterior cecal wall only'],ans:1,exp:'The appendix attaches to the posteromedial aspect of the cecum, at the point where the three taeniae coli converge.',sys:'Gastrointestinal System'},
  {q:'A patient has a CT showing free air under the diaphragm. The most common cause is perforation of a peptic ulcer on the anterior wall of the stomach. This air accumulates where?',opts:['Lesser sac','Greater sac (peritoneal cavity)','Retroperitoneum','Pleural cavity','Pericardial cavity'],ans:1,exp:'Anterior gastric perforation releases air into the greater peritoneal cavity (greater sac), rising to accumulate under the diaphragm on an erect chest X-ray.',sys:'Gastrointestinal System'},
  {q:'The superior rectal artery is the terminal branch of which vessel?',opts:['Internal iliac artery','External iliac artery','Inferior mesenteric artery','Internal pudendal artery','Middle rectal artery'],ans:2,exp:'The superior rectal artery is the terminal branch of the inferior mesenteric artery, supplying the upper rectum and anastomosing with the middle and inferior rectal arteries.',sys:'Gastrointestinal System'},
  {q:'A 35-year-old patient has acute pancreatitis. CT shows fluid in the lesser sac. The lesser sac lies posterior to which structure?',opts:['Liver','Gallbladder','Stomach and lesser omentum','Transverse colon','Duodenum'],ans:2,exp:'The lesser sac (omental bursa) lies posterior to the stomach and lesser omentum, separated from the greater peritoneal cavity by these structures.',sys:'Gastrointestinal System'},
  {q:'Which lymph nodes receive primary lymphatic drainage from the stomach?',opts:['Para-aortic nodes','Celiac lymph nodes','Mesenteric nodes','Inguinal nodes','Mediastinal nodes'],ans:1,exp:'Gastric lymphatics drain primarily to the celiac lymph nodes (via left gastric, right gastric, gastroepiploic, and splenic nodal groups), then to the cisterna chyli.',sys:'Gastrointestinal System'},
  {q:'During a laparoscopic appendectomy, the surgeon identifies the appendicular artery. This vessel is a branch of which artery?',opts:['Right colic artery','Ileocolic artery','Inferior mesenteric artery','Superior mesenteric artery directly','Middle colic artery'],ans:1,exp:'The appendicular artery is a branch of the ileocolic artery (from the SMA), found in the mesoappendix.',sys:'Gastrointestinal System'},
  {q:'What is the primary difference between jejunal and ileal arterial arcades in the mesentery?',opts:['Jejunum has long, simple vasa recta from few arcades; ileum has short vasa recta from multiple tiers of arcades','Jejunum has more arcades','Ileum has longer vasa recta','No difference in arcade pattern','Jejunum has 4–5 tiers of arcades'],ans:0,exp:'The jejunum has 1–2 tiers of large arterial arcades with long vasa recta; the ileum has 3–5 tiers of smaller arcades with short vasa recta, reflected in the denser mesenteric fat of the ileum.',sys:'Gastrointestinal System'},
  {q:'A 40-year-old woman presents with RUQ pain, fever, and jaundice (Charcot\'s triad). Which structure is most likely obstructed?',opts:['Cystic duct','Common hepatic duct','Common bile duct','Major duodenal papilla','Pancreatic duct'],ans:2,exp:'Charcot\'s triad (RUQ pain, fever, jaundice) indicates cholangitis from obstruction of the common bile duct, most commonly by a gallstone.',sys:'Gastrointestinal System'},
  {q:'The bare area of the liver is directly in contact with which structure due to absence of peritoneal covering?',opts:['Stomach','Right kidney and right adrenal gland (and diaphragm)','Duodenum','Gallbladder','Inferior vena cava'],ans:1,exp:'The bare area of the liver (between the coronary ligament leaves) is in direct contact with the right diaphragm, right adrenal gland, and right kidney, with no peritoneal covering.',sys:'Gastrointestinal System'},
  {q:'A 68-year-old man has jaundice and a palpable, non-tender gallbladder (Courvoisier\'s sign). Which structure is most likely obstructed by a mass?',opts:['Cystic duct','Common hepatic duct','Distal common bile duct (at head of pancreas)','Gallbladder','Hepatic veins'],ans:2,exp:'Courvoisier\'s sign (palpable, non-tender gallbladder with jaundice) suggests malignant obstruction of the distal CBD at the head of the pancreas, as the gallbladder is distensible (not scarred from stones).',sys:'Gastrointestinal System'},
  {q:'Which nerve is responsible for the pain of visceral peritoneal irritation from the appendix in early appendicitis?',opts:['Ilioinguinal nerve','Iliohypogastric nerve','Lesser splanchnic nerve (T10–T11)','Genitofemoral nerve','Pudendal nerve'],ans:2,exp:'Visceral afferents from the appendix travel with the lesser splanchnic nerves (T10–T11) back to the spinal cord, producing referred pain at the T10 dermatome (periumbilical region) in early appendicitis.',sys:'Gastrointestinal System'},
  {q:'A 58-year-old woman with alcoholic cirrhosis has massive upper GI bleeding. Endoscopy shows dilated submucosal veins at the lower esophagus. Which portosystemic anastomosis is responsible?',opts:['Paraumbilical vein communicating with epigastric veins','Left gastric vein anastomosing with esophageal tributaries of the azygos','Superior rectal vein anastomosing with middle rectal veins','Retroperitoneal anastomosis between colic and lumbar veins','Splenic vein communicating with the left renal vein'],ans:1,exp:'Esophageal varices result from the portosystemic anastomosis between the left gastric (coronary) vein (portal territory) and the esophageal tributaries of the azygos vein (systemic territory).',sys:'Gastrointestinal System'},
  {q:'The hepatic portal vein is formed by the union of which two veins?',opts:['Superior mesenteric vein and inferior mesenteric vein','Superior mesenteric vein and splenic vein','Splenic vein and inferior mesenteric vein','Left gastric vein and splenic vein','Superior mesenteric vein and left gastric vein'],ans:1,exp:'The portal vein is formed by the union of the superior mesenteric vein and the splenic vein (which itself receives the inferior mesenteric vein) posterior to the neck of the pancreas.',sys:'Gastrointestinal System'},
  {q:'A 45-year-old man has pancreatic head carcinoma with biliary obstruction. He undergoes a pancreaticoduodenectomy. Which structures are resected en bloc in this operation?',opts:['Head of pancreas, entire stomach, and spleen','Head of pancreas, duodenum, gallbladder, distal common bile duct, and distal stomach','Entire pancreas and duodenum, leaving the stomach intact','Pancreatic body and tail together with the spleen','Head of pancreas, distal ileum, and cecum'],ans:1,exp:'The Whipple procedure (pancreaticoduodenectomy) removes the head of the pancreas, D1–D4, the distal common bile duct, the gallbladder, and the distal stomach (antrum).',sys:'Gastrointestinal System'},
  {q:'Which structure marks the boundary between the upper and lower GI tract for clinical purposes?',opts:['Pylorus','Duodenojejunal flexure (ligament of Treitz)','Ileocecal valve','Splenic flexure','Hepatic flexure'],ans:1,exp:'The ligament of Treitz (duodenojejunal flexure) is the clinical landmark separating the upper GI tract (proximal to it) from the lower GI tract (distal to it).',sys:'Gastrointestinal System'},
  {q:'Below the arcuate line (linea semicircularis / Douglas line), the posterior wall of the rectus sheath is absent. What forms the posterior surface of the rectus abdominis below this line?',opts:['Posterior layer of internal oblique aponeurosis','Transversalis fascia and parietal peritoneum only','External oblique aponeurosis','Posterior rectus sheath from all three aponeuroses','Scarpa\'s fascia'],ans:1,exp:'Below the arcuate line (~halfway between the umbilicus and pubic symphysis), all three aponeuroses pass anterior to the rectus abdominis, leaving only transversalis fascia and peritoneum posteriorly. This creates a point of weakness for herniation.',sys:'Gastrointestinal System'},
  {q:'A 55-year-old obese woman has a palpable mass below and lateral to the umbilicus that increases in size with Valsalva. It does not correspond to the inguinal canal or femoral ring. Which hernia type is most likely?',opts:['Direct inguinal hernia through Hesselbach\'s triangle','Spigelian hernia','Femoral hernia through the femoral canal','Umbilical hernia','Hiatal hernia'],ans:1,exp:'A Spigelian hernia protrudes through the semilunar line (linea semilunaris), typically at or near the arcuate line where the posterior sheath is absent, presenting as a lateral abdominal wall mass.',sys:'Gastrointestinal System'},
  {q:'Which vessels course along the posterior surface of the rectus abdominis and anastomose within the rectus sheath?',opts:['Intercostal arteries only','Superior epigastric (from internal thoracic) and inferior epigastric (from external iliac) arteries','Superficial epigastric arteries','Internal thoracic arteries only','Deep circumflex iliac arteries'],ans:1,exp:'The superior epigastric artery (terminal branch of internal thoracic) and inferior epigastric artery (from external iliac) anastomose within the rectus sheath, posterior to the rectus muscle.',sys:'Gastrointestinal System'},
  {q:'A surgeon makes a midline incision. Which avascular anatomical structure is incised?',opts:['Linea semilunaris','Linea alba','Arcuate line','Linea aspera','Inguinal ligament'],ans:1,exp:'The linea alba is a relatively avascular midline raphe formed by the interlacing aponeuroses of the three flat abdominal muscles, making it an ideal surgical incision site.',sys:'Gastrointestinal System'},
  {q:'Hesselbach\'s triangle defines the site of a direct inguinal hernia. Which structures form its boundaries?',opts:['Inguinal ligament (inferior), inferior epigastric vessels (lateral), and rectus abdominis (medial)','Inguinal ligament, femoral vein, and lacunar ligament','External oblique aponeurosis, ilioinguinal nerve, and inguinal ligament','Internal oblique, transversus abdominis, and inguinal ligament','Cooper\'s ligament, lacunar ligament, and femoral vein'],ans:0,exp:'Hesselbach\'s triangle: lateral border = inferior epigastric vessels; medial border = lateral edge of rectus abdominis; inferior border = inguinal ligament.',sys:'Gastrointestinal System'},
  {q:'A 65-year-old man has a bulge in his groin that appears medial to the inferior epigastric vessels and above the inguinal ligament. This is most consistent with which hernia type?',opts:['Indirect inguinal hernia','Direct inguinal hernia','Femoral hernia','Obturator hernia','Spigelian hernia'],ans:1,exp:'A direct inguinal hernia protrudes directly through Hesselbach\'s triangle, medial to the inferior epigastric vessels, through the posterior inguinal wall (transversalis fascia).',sys:'Gastrointestinal System'},
  {q:'A 50-year-old woman develops a painful swelling in the femoral triangle just below and lateral to the pubic tubercle. This is most consistent with which type of hernia?',opts:['Direct inguinal hernia','Indirect inguinal hernia','Femoral hernia','Obturator hernia','Umbilical hernia'],ans:2,exp:'Femoral hernias protrude through the femoral canal, presenting below and lateral to the pubic tubercle (inguinal hernias are above and medial to the pubic tubercle). More common in women due to wider femoral canal.',sys:'Gastrointestinal System'},
  {q:'What are the boundaries of the femoral canal?',opts:['Inguinal ligament (anterior), pectineal ligament (posterior), femoral vein (lateral), lacunar ligament (medial)','Inguinal ligament, femoral artery, iliopectineal arch, and pubic bone','Rectus abdominis, inguinal ligament, and iliac vessels','External oblique and femoral vein','Psoas muscle and femoral nerve'],ans:0,exp:'The femoral canal: anterior = inguinal ligament; posterior = pectineal (Cooper\'s) ligament; lateral = femoral vein; medial = lacunar (Gimbernat\'s) ligament. The narrow medial border from the lacunar ligament makes femoral hernias prone to strangulation.',sys:'Gastrointestinal System'},
  {q:'A 70-year-old woman has a strangulated femoral hernia. Which structure\'s sharp edge makes reduction dangerous and strangulation likely?',opts:['Inguinal ligament','Pectineal ligament','Lacunar (Gimbernat\'s) ligament','Femoral vein','Iliopubic tract'],ans:2,exp:'The lacunar ligament forms the sharp, rigid medial boundary of the femoral canal; its unyielding edge is the main reason femoral hernias are prone to strangulation.',sys:'Gastrointestinal System'},
  {q:'The deep inguinal ring is a defect in which layer of the abdominal wall?',opts:['External oblique aponeurosis','Internal oblique muscle','Transversalis fascia','Transversus abdominis muscle','Peritoneum'],ans:2,exp:'The deep (internal) inguinal ring is an oval aperture in the transversalis fascia, located approximately 1.5 cm above the midpoint of the inguinal ligament, lateral to the inferior epigastric vessels.',sys:'Gastrointestinal System'},
  {q:'The superficial inguinal ring is a defect in which layer of the abdominal wall?',opts:['Transversalis fascia','Internal oblique muscle','External oblique aponeurosis','Rectus sheath','Scarpa\'s fascia'],ans:2,exp:'The superficial (external) inguinal ring is a triangular aperture in the external oblique aponeurosis, located just superolateral to the pubic tubercle.',sys:'Gastrointestinal System'},
  {q:'A surgeon identifies the inferior epigastric artery during laparoscopic hernia repair. This artery is a branch of which vessel?',opts:['Internal iliac artery','External iliac artery','Femoral artery','Obturator artery','Lumbar artery'],ans:1,exp:'The inferior epigastric artery is a branch of the external iliac artery, arising just proximal to the inguinal ligament. It forms the lateral border of Hesselbach\'s triangle.',sys:'Gastrointestinal System'},
  {q:'A hiatal hernia involves herniation of abdominal contents through the esophageal hiatus of the diaphragm. Which type is most common?',opts:['Type I (sliding hiatal hernia)','Type II (paraesophageal hernia)','Type III (mixed)','Type IV (with other organ herniation)','Morgagni hernia'],ans:0,exp:'Type I (sliding hiatal hernia) is the most common type (>95%), in which the GEJ and stomach slide up into the thorax through the esophageal hiatus.',sys:'Gastrointestinal System'},
  {q:'A neonate is born with respiratory distress. Chest X-ray shows bowel loops in the left hemithorax. Which embryological failure is responsible for this congenital diaphragmatic hernia?',opts:['Failure of the septum transversum to form','Failure of the posterolateral pleuroperitoneal membrane to fuse','Failure of the anterior parasternal foramen to close','Widening of the esophageal hiatus','Failure of the central tendon to form'],ans:1,exp:'The Bochdalek hernia (congenital diaphragmatic hernia) results from failure of the pleuroperitoneal membranes to fuse, occurring most commonly on the left posterolateral side.',sys:'Gastrointestinal System'},
  {q:'A 45-year-old man has a painless midline bulge at the umbilicus that increases with straining. This is most likely which type of hernia?',opts:['Epigastric hernia','Umbilical hernia','Spigelian hernia','Incisional hernia','Direct inguinal hernia'],ans:1,exp:'An umbilical hernia protrudes through the umbilical ring, which is a point of weakness where the umbilical vessels previously passed. Common in adults with increased intraabdominal pressure.',sys:'Gastrointestinal System'},
  {q:'An epigastric hernia occurs through which structure?',opts:['Umbilical ring','Linea alba between the xiphoid and umbilicus','Deep inguinal ring','Semilunar line','Arcuate line'],ans:1,exp:'Epigastric hernias occur through defects in the linea alba between the xiphoid process and the umbilicus, typically containing only preperitoneal fat.',sys:'Gastrointestinal System'},
  {q:'A 60-year-old woman presents with medial thigh pain exacerbated by internal hip rotation. Imaging reveals a small hernia compressing a nerve in the hip region. Through which aperture does this hernia pass?',opts:['Femoral canal','Obturator foramen','Lesser sciatic foramen','Greater sciatic foramen','Inguinal canal'],ans:1,exp:'An obturator hernia passes through the obturator canal (obturator foramen), compressing the obturator nerve and causing medial thigh pain (Howship-Romberg sign) on internal rotation of the hip.',sys:'Gastrointestinal System'},
  {q:'The conjoint tendon (inguinal falx) is formed by the combined lower fibers of which two muscles?',opts:['External oblique and internal oblique','Internal oblique and transversus abdominis','Transversus abdominis and rectus abdominis','External oblique and transversus abdominis','Internal oblique and rectus abdominis'],ans:1,exp:'The conjoint tendon (inguinal falx) is formed by the combined aponeuroses of the internal oblique and transversus abdominis muscles, reinforcing the posterior wall of the medial inguinal canal.',sys:'Gastrointestinal System'},

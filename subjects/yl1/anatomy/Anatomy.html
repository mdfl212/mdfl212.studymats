  {q:'A surgeon performing an open inguinal hernia repair identifies a structure running obliquely across the inguinal canal floor. This is most likely which vessel?',opts:['Superior epigastric artery','Inferior epigastric artery','Superficial circumflex iliac artery','Deep circumflex iliac artery','Femoral artery'],ans:1,exp:'The inferior epigastric artery runs obliquely from the external iliac artery medially and superiorly, passing lateral to the deep inguinal ring and forming the lateral border of Hesselbach\'s triangle — a key landmark in hernia repair.',sys:'Gastrointestinal System'},
  {q:'The linea semilunaris (semilunar line) marks the lateral edge of which muscle?',opts:['External oblique','Internal oblique','Transversus abdominis','Rectus abdominis','Pyramidalis'],ans:3,exp:'The linea semilunaris (semilunar line) marks the lateral edge of the rectus abdominis muscle, where the aponeuroses of the three flat abdominal muscles fuse to form the rectus sheath.',sys:'Gastrointestinal System'},
  {q:'A trauma patient has blood in the pleural cavity after blunt chest trauma. On auscultation, breath sounds are absent at the base. Which intercostal space is typically used for chest drain insertion in hemothorax?',opts:['2nd ICS midclavicular line','4th ICS anterior axillary line','5th ICS midaxillary line','7th ICS posterior axillary line','3rd ICS midclavicular line'],ans:2,exp:'Chest drains for hemothorax (and pleural effusion) are typically inserted in the 5th intercostal space, midaxillary line (the \'safe triangle\') to avoid the liver, spleen, and heart.',sys:'Gastrointestinal System'},
  {q:'An unconscious patient aspirates stomach contents. Which lung segment is most commonly affected if the patient is supine?',opts:['Right upper lobe anterior segment','Right middle lobe','Right lower lobe superior segment (apical segment)','Left lower lobe','Right lower lobe basal segment'],ans:2,exp:'In a supine patient, the apical (superior) segment of the right lower lobe is the most dependent posterior segment and receives aspirated material most readily due to gravity.',sys:'Gastrointestinal System'},
  {q:'The internal thoracic (mammary) artery gives rise to anterior intercostal arteries and terminates as which two vessels?',opts:['Axillary and lateral thoracic arteries','Superior epigastric and musculophrenic arteries','Intercostal and phrenic arteries','Superior and inferior phrenic arteries','Lateral thoracic and thoracoacromial arteries'],ans:1,exp:'The internal thoracic artery terminates at the 6th intercostal space by dividing into the superior epigastric artery (enters rectus sheath) and the musculophrenic artery (runs along the costal margin).',sys:'Gastrointestinal System'},
  {q:'A patient develops chylothorax after esophageal surgery. The thoracic duct is injured. Where does the thoracic duct typically drain?',opts:['Right subclavian vein','Junction of left subclavian and left internal jugular veins (left venous angle)','Superior vena cava','Left brachiocephalic vein','Azygos vein'],ans:1,exp:'The thoracic duct drains into the venous system at the left venous angle — the junction of the left subclavian vein and left internal jugular vein.',sys:'Gastrointestinal System'},
  {q:'Which structure passes through the aortic hiatus of the diaphragm?',opts:['Aorta only','Aorta and thoracic duct','Aorta, thoracic duct, and azygos vein','Esophagus and vagus nerves','Inferior vena cava'],ans:2,exp:'The aortic hiatus (T12) transmits the aorta, thoracic duct, and azygos vein. The esophageal hiatus (T10) transmits the esophagus and vagus nerves. The caval foramen (T8) transmits the IVC and right phrenic nerve.',sys:'Gastrointestinal System'},
  {q:'Which germ layer gives rise to the lining of the GI tract (mucosa and glands)?',opts:['Ectoderm','Mesoderm','Endoderm','Neural crest','Lateral plate mesoderm'],ans:2,exp:'Endoderm gives rise to the epithelial lining and glands of the GI tract, respiratory tract, liver, pancreas, and thyroid.',sys:'Gastrointestinal System'},
  {q:'Which germ layer gives rise to the musculature and connective tissue of the GI tract?',opts:['Ectoderm','Splanchnic mesoderm','Endoderm','Neural crest cells','Somatic mesoderm'],ans:1,exp:'Splanchnic (visceral) mesoderm gives rise to the smooth muscle, connective tissue, and serosal lining of the GI tract walls.',sys:'Gastrointestinal System'},
  {q:'The midgut normally undergoes a 270° counterclockwise rotation around the superior mesenteric artery. Which structure marks the axis of this rotation?',opts:['Aorta','Superior mesenteric artery','Portal vein','Inferior mesenteric artery','Celiac trunk'],ans:1,exp:'The midgut loop rotates 270° counterclockwise around the superior mesenteric artery as its axis during weeks 6–10 of development. Incomplete rotation causes malrotation.',sys:'Gastrointestinal System'},
  {q:'A neonate has bilious vomiting and a \'double bubble\' sign on X-ray. Which developmental anomaly is most likely?',opts:['Jejunal atresia','Duodenal atresia','Malrotation with volvulus','Hirschsprung disease','Pyloric stenosis'],ans:1,exp:'Duodenal atresia causes a \'double bubble\' sign (stomach + dilated proximal duodenum) and bilious vomiting. It is associated with Down syndrome and results from failure of the duodenal lumen to recanalize.',sys:'Gastrointestinal System'},
  {q:'Meckel\'s diverticulum follows a \'rule of 2s.\' Which set of facts correctly describes this rule?',opts:['2% incidence; 2 cm from pylorus; 2 types of ectopic tissue','2% incidence; 2 feet from ileocecal valve; 2 inches long; symptomatic before age 2; 2 types of ectopic tissue','2 cm from ileocecal valve; 2 inches long; 2% incidence; 2 genders equally affected','2 feet from pylorus; 2 cm long; present in 2-year-olds only','2% incidence; 2 cm long; always contains 2 layers of gastric mucosa'],ans:1,exp:'Meckel\'s diverticulum rule of 2s: occurs in 2% of the population; located 2 feet (60 cm) proximal to the ileocecal valve; approximately 2 inches (5 cm) long; most symptomatic by age 2; may contain 2 types of ectopic tissue (gastric and pancreatic mucosa).',sys:'Gastrointestinal System'},
  {q:'Gastroschisis and omphalocele both involve herniation of abdominal contents. Which key difference distinguishes them?',opts:['Gastroschisis has a peritoneal sac; omphalocele does not','Omphalocele has a peritoneal/amnion sac; gastroschisis has no sac and occurs lateral to the umbilicus','They are identical conditions with different names','Gastroschisis involves midgut only; omphalocele involves all organs','Omphalocele occurs in premature infants only'],ans:1,exp:'Omphalocele = herniation through the umbilical ring, covered by a peritoneal sac (amnion + peritoneum), associated with chromosomal anomalies. Gastroschisis = herniation through a lateral defect (usually right of umbilicus), NO sac, bowel exposed directly to amniotic fluid, typically isolated.',sys:'Gastrointestinal System'},
  {q:'The pectinate (dentate) line in the anal canal marks the boundary between two different types of epithelium. What are they?',opts:['Stratified squamous above and transitional below','Columnar epithelium above and stratified squamous below','Transitional (urothelium) above and columnar below','Simple cuboidal above and squamous below','Columnar above and transitional below'],ans:1,exp:'Above the pectinate line: columnar epithelium (endoderm-derived proctodeum), internal hemorrhoidal plexus, autonomic innervation (painless), superior rectal artery, internal iliac lymph nodes. Below: stratified squamous, external hemorrhoidal plexus, somatic innervation (painful), inferior rectal artery, superficial inguinal lymph nodes.',sys:'Gastrointestinal System'},
  {q:'A patient has painless bright red bleeding per rectum. Proctoscopy shows a vascular column above the pectinate line. What type of hemorrhoid is this?',opts:['External hemorrhoid','Internal hemorrhoid','Mixed hemorrhoid','Thrombosed external hemorrhoid','Perianal hematoma'],ans:1,exp:'Internal hemorrhoids form above the pectinate line, are covered by columnar mucosa, have autonomic innervation (painless unless prolapsed/strangulated), and drain via the superior rectal vein to the portal system.',sys:'Gastrointestinal System'},
  {q:'A patient has a painful, swollen perianal mass. Examination shows a thrombosed external hemorrhoid. Why is this painful?',opts:['Internal hemorrhoids are always painful','External hemorrhoids are below the pectinate line, covered by squamous epithelium, and have somatic innervation (inferior rectal nerve)','External hemorrhoids are innervated by autonomic fibers','They compress the pudendal nerve','They are above the pectinate line'],ans:1,exp:'External hemorrhoids are located below the pectinate line, covered by skin/squamous epithelium, and innervated by the inferior rectal nerve (somatic) — making them exquisitely painful, especially when thrombosed.',sys:'Gastrointestinal System'},
  {q:'The anal canal above the pectinate line is supplied by which artery and drained by which lymph nodes?',opts:['Inferior rectal artery; superficial inguinal nodes','Superior rectal artery (from IMA); internal iliac nodes','Middle rectal artery; external iliac nodes','Internal pudendal artery; deep inguinal nodes','Superior rectal artery; para-aortic nodes'],ans:1,exp:'Above the pectinate line: arterial supply from the superior rectal artery (terminal branch of IMA); venous drainage to portal system (superior rectal → IMV); lymphatic drainage to internal iliac nodes. Autonomic innervation makes internal hemorrhoids painless.',sys:'Gastrointestinal System'},
  {q:'The anal canal below the pectinate line is supplied by which artery and drained by which lymph nodes?',opts:['Superior rectal artery; internal iliac nodes','Middle rectal artery; internal iliac nodes','Inferior rectal artery (from internal pudendal); superficial inguinal nodes','Middle rectal artery; para-aortic nodes','Superior rectal artery; superficial inguinal nodes'],ans:2,exp:'Below the pectinate line: arterial supply from the inferior rectal artery (branch of internal pudendal); venous drainage to systemic system (inferior rectal → pudendal → internal iliac); lymphatic drainage to superficial inguinal nodes. Somatic innervation makes external hemorrhoids painful.',sys:'Gastrointestinal System'},
  {q:'A male patient has a rectal carcinoma at the level of the rectosigmoid junction. Which lymph nodes are involved first?',opts:['Superficial inguinal nodes','Internal iliac nodes','Inferior mesenteric nodes (along superior rectal artery)','Para-aortic nodes','External iliac nodes'],ans:2,exp:'Rectal carcinoma above the pectinate line drains first to inferior mesenteric (pararectal) lymph nodes along the superior rectal artery, then to internal iliac nodes. Tumors below the pectinate line drain to superficial inguinal nodes.',sys:'Gastrointestinal System'},
  {q:'A 45-year-old woman has recurrent submandibular swelling at mealtimes. Bimanual palpation of the floor of the mouth reveals a hard calculus along a duct. Which duct is affected and where does it open?',opts:['Parotid (Stensen\'s) duct; opens opposite the upper 2nd molar','Submandibular (Wharton\'s) duct; opens at the sublingual papilla beside the frenulum','Sublingual duct; opens into the submandibular space','Lingual duct; opens at the base of the tongue','Greater palatine duct; opens at the hard palate'],ans:1,exp:'Wharton\'s duct (submandibular duct) runs anteriorly along the floor of the mouth and opens at the sublingual papilla (caruncle) on either side of the lingual frenulum. It is prone to calculus formation because saliva flows against gravity and the duct curves around mylohyoid.',sys:'Gastrointestinal System'},
  {q:'What is the largest branch of the celiac trunk?',opts:['Left gastric artery','Splenic artery','Common hepatic arteries','Superior mesenteric artery'],ans:1,exp:'The largest branch of the celiac trunk is the splenic artery.',sys:'Gastrointestinal System'},
  {q:'The epiploic foramen is bounded superiorly by the',opts:['Caudate lobe of the liver','1st part of the duodenum','Free edge of the lesser omentum','IVC'],ans:0,exp:'The foramen of Winslow (epiploic foramen) is bounded: Superiorly by the Caudate lobe of the liver, Inferiorly by 1st part of duodenum, Anteriorly by Free edge of the lesser omentum, Posteriorly by IVC.',sys:'Gastrointestinal System'},
  {q:'The portal vein is formed by the merging of',opts:['Splenic vein and superior mesenteric vein','Splenic vein and inferior mesenteric vein','Superior and inferior mesenteric vein','None of the above'],ans:0,exp:'The portal vein is formed by the merging of the splenic vein and the SMV.',sys:'Gastrointestinal System'},
  {q:'Damage to the superior mesenteric artery will affect the following vessels, EXCEPT:',opts:['Middle colic artery','Ileocolic artery','Right gastric artery','Right colic artery'],ans:2,exp:'The right gastric artery comes from the common hepatic artery, which is a branch of the celiac trunk, not the superior mesenteric artery.',sys:'Gastrointestinal System'},
  {q:'What is the estimated capacity of the gallbladder?',opts:['3 mL','30 mL','10 mL','100 mL'],ans:1,exp:'The approximate capacity of the gallbladder is 30-50mL.',sys:'Gastrointestinal System'},
  {q:'The common bile and main pancreatic ducts open into what part of the duodenum?',opts:['Superior','Descending','Transverse','Ascending'],ans:1,exp:'The common bile and main pancreatic ducts open into the major duodenal papilla which is found in the descending (2nd) part of the duodenum.',sys:'Gastrointestinal System'},
  {q:'What structure perforates the diaphragm at the T10 level?',opts:['IVC','Esophagus','Aorta','Right phrenic nerve'],ans:1,exp:'At T10 level, the Vagus nerve and esophagus perforate the diaphragm. IVC is at T8. Aorta is at T12.',sys:'Gastrointestinal System'},
  {q:'What is the medial border of the inguinal triangle?',opts:['Linea semilunaris','Inferior epigastric vessels','Pubic tubercle','Inguinal ligament'],ans:0,exp:'The Inguinal triangle (Hesselbach triangle) borders: Medial-linea semilunaris, Lateral-Inferior epigastric vessels, Inferior-Inguinal ligament.',sys:'Gastrointestinal System'},
  {q:'Which of the following hernias is more common in females and likely presents with incarceration?',opts:['Femoral hernia','Indirect inguinal hernia','Direct inguinal hernia','Spigelian hernia'],ans:0,exp:'Femoral hernia is more common in females and more likely presents with incarceration or strangulation.',sys:'Gastrointestinal System'},
  {q:'Which of the following structures contains the portal triad?',opts:['Hepatogastric ligament','Hepatoduodenal ligament','Greater omentum','All of the above'],ans:1,exp:'The hepatoduodenal ligament contains the portal triad (bile duct, proper hepatic artery, portal vein).',sys:'Gastrointestinal System'},
  {q:'Which of the following forms the uncinate process of the pancreas?',opts:['Ventral bud','Dorsal bud','Lateral bud','Medial bud'],ans:0,exp:'The uncinate process is formed from the ventral pancreatic bud.',sys:'Gastrointestinal System'},
  {q:'The esophagus is lined with',opts:['Nonkeratinized stratified squamous epithelium','Keratinized stratified squamous epithelium','Simple columnar epithelium','Simple cuboidal epithelium'],ans:0,exp:'The esophagus is lined with nonkeratinized stratified squamous epithelium.',sys:'Gastrointestinal System'},
  {q:'Which of the following is characteristic of the jejunum versus the ileum?',opts:['Has closely-packed plicae circulares','Longer','Shorter vasa recta','None of the above'],ans:0,exp:'The jejunum has tall and closely packed plicae circulares, while the ileum is longer and has shorter vasa recta.',sys:'Gastrointestinal System'},
  {q:'During liver surgery, bleeding is minimized by doing the Pringle maneuver. Which of the following structures is clamped in this maneuver?',opts:['Falciform ligament','Hepatoduodenal ligament','Hepatogastric ligament','Splenorenal ligament'],ans:1,exp:'The hepatoduodenal ligament, containing the portal triad, is clamped during the Pringle maneuver to minimize bleeding.',sys:'Gastrointestinal System'},
  {q:'The blood supply to the descending colon comes from the',opts:['Celiac trunk','Superior mesenteric artery','Inferior mesenteric artery','Superior rectal artery'],ans:2,exp:'The descending colon is a hindgut structure and is supplied by the inferior mesenteric artery.',sys:'Gastrointestinal System'},
  {q:'Which of the following zones in the liver is known to be the most sensitive to metabolic toxins such as paracetamol?',opts:['Zone I','Zone II','Zone III','Zone IV'],ans:2,exp:'Zone III is the least oxygenated and the most sensitive to metabolic toxins such as paracetamol.',sys:'Gastrointestinal System'},
  {q:'Which of the following is NOT a site of constriction of the esophagus?',opts:['At the level of the cricoid cartilage','At the level of the thyroid cartilage','Where it is crossed by the aortic arch','At the level of T10'],ans:1,exp:'The thyroid cartilage is not a site of constriction. The 3 sites are at the cricoid cartilage, aortic arch/left main bronchus, and T10 esophageal hiatus.',sys:'Gastrointestinal System'},
  {q:'The spleen can be located in the left upper quadrant covered by which set of ribs?',opts:['4-5th ribs','6-8th ribs','9-11th ribs','10-12th ribs'],ans:2,exp:'The spleen can be located in the left upper quadrant covered by the 9th-11th ribs.',sys:'Gastrointestinal System'},
  {q:'Pelvic fractures most commonly damage which portion of the male urethra?',opts:['Spongy urethra','Prostatic and/or membranous urethra (posterior urethra)','Navicular fossa','External urethral meatus'],ans:1,exp:'Pelvic fractures shear the membranous (and sometimes prostatic) urethra at its junction, constituting posterior urethral injury.',sys:'Renal & Urinary System'},
  {q:'RBC casts and dysmorphic RBCs in urine indicate bleeding originating from:',opts:['Urinary bladder','Renal pelvis','Glomerulus','Proximal ureter'],ans:2,exp:'RBC casts and dysmorphic (misshapen) RBCs are formed only when red blood cells pass through the glomerular basement membrane and are molded in the tubules, indicating glomerular origin.',sys:'Renal & Urinary System'},
  {q:'Pain from the kidney and ureter typically refers to which region?',opts:['Periumbilical region','Ipsilateral flank radiating to the groin/labia/scrotum','Right lower quadrant','Epigastric region'],ans:1,exp:'Ureteral colic (renal colic) causes ipsilateral flank pain radiating to the groin, scrotum, or labia, following the path of the ureter. Upper ureter refers to flank/loin; lower ureter refers toward genitalia.',sys:'Renal & Urinary System'},
  {q:'A surgeon is performing thoracentesis at the posterior angle below the 12th rib. Which structure is at risk of injury that is NOT normally in the pleural cavity at this level?',opts:['Lung','Diaphragm','Liver (right side)','Kidney','Spleen (left side)'],ans:3,exp:'Below the 12th rib posteriorly, the costodiaphragmatic recess ends and the kidney lies immediately deep. Needles inserted too inferiorly can injure the kidney.',sys:'Renal & Urinary System'},
  {q:'A fetus has bilateral renal agenesis with oligohydramnios, pulmonary hypoplasia, and facial deformities. Which sequence is this?',opts:['Pierre Robin sequence','VACTERL association','Potter sequence','DiGeorge sequence','Turner sequence'],ans:2,exp:'Potter sequence results from bilateral renal agenesis → oligohydramnios (no fetal urine) → compression of fetus → pulmonary hypoplasia (fatal), limb deformities, and characteristic facial features (Potter facies).',sys:'Renal & Urinary System'},
  {q:'The metanephros (permanent kidney) develops from which two embryonic structures?',opts:['Pronephros and mesonephros','Ureteric bud (from mesonephric duct) and metanephric mesoderm (blastema)','Intermediate mesoderm alone','Lateral plate mesoderm and endoderm','Paraxial mesoderm and endoderm'],ans:1,exp:'The permanent kidney forms from two structures: the ureteric bud (gives rise to ureter, renal pelvis, calyces, collecting ducts) and the metanephric mesoderm/blastema (gives rise to nephrons).',sys:'Renal & Urinary System'},
  {q:'A 5-year-old child has a horseshoe kidney found incidentally. Which embryonic event caused this?',opts:['Failure of ureteric bud to form','Fusion of the lower poles of the two metanephroi during ascent','Failure of renal ascent','Ectopic ureteric bud','Failure of renal rotation'],ans:1,exp:'Horseshoe kidney results from fusion of the lower poles of the two metanephroi (developing kidneys) as they ascend, becoming caught on the inferior mesenteric artery and failing to ascend to the normal position.',sys:'Renal & Urinary System'},
  {q:'A neonate has a urachal sinus draining urine from the umbilicus. The urachus is a remnant of which embryonic structure?',opts:['Vitelline duct','Allantois','Cloacal membrane','Urogenital sinus','Mesonephric duct'],ans:1,exp:'The urachus is the embryonic remnant of the allantois connecting the bladder to the umbilicus. Failure of obliteration results in a patent urachus (urine draining from umbilicus), urachal sinus, urachal cyst, or vesicourachal diverticulum.',sys:'Renal & Urinary System'},
  {q:'The ureter may be obstructed by a kidney stone in either of the following locations, EXCEPT?',opts:['Where the ureter joins the renal pelvis','Where the ureter crosses the pelvic brim','Where it enters the wall of the urinary bladder','Where it crosses below the gonadal arteries'],ans:3,exp:'The common constriction points are the ureteropelvic junction, pelvic brim, and ureterovesical junction.',sys:'Renal & Urinary System'},
  {q:'Different parts of the ureter have different sources of blood supply. The distal ureter\'s blood supply comes from which of the following?',opts:['Renal arteries','Gonadal artery','External iliac artery','Superior vesical artery'],ans:3,exp:'The distal ureter is supplied by the internal iliac artery and superior vesical artery.',sys:'Renal & Urinary System'},
  {q:'Which of the following structures is a remnant of the urachus?',opts:['Median umbilical ligament','Medial umbilical ligaments','Ligamentum teres','Ligamentum venosum'],ans:0,exp:'The median umbilical ligament is a remnant of the urachus.',sys:'Renal & Urinary System'},
  {q:'Which of the following organs are NOT retroperitoneal?',opts:['Ascending colon','Ureter','1st part of the duodenum','Abdominal aorta'],ans:2,exp:'Only the 2nd to 4th parts of the duodenum are retroperitoneal. The 1st part is intraperitoneal.',sys:'Renal & Urinary System'},
  {q:'The glomerular filtration barrier consists of the following, EXCEPT?',opts:['Capillary endothelium with fenestrations','Basement membrane with Type II collagen','Podocyte foot processes','None of the above'],ans:1,exp:'The glomerular basement membrane (GBM) is composed of type IV collagen chains, not type II.',sys:'Renal & Urinary System'},
  {q:'Which of the following structures in the kidney produces renin?',opts:['Macula densa','Juxtaglomerular cells','Distal convoluted tubule','Renal medulla'],ans:1,exp:'The juxtaglomerular cells in the afferent arteriole produce renin.',sys:'Renal & Urinary System'},
  {q:'A straddle injury (direct blow to the perineum) most commonly injures which part of the male urethra?',opts:['Prostatic urethra','Membranous urethra','Spongy (penile/bulbar) urethra','Internal urethral sphincter'],ans:2,exp:'A straddle injury directly compresses the spongy (bulbar) urethra against the pubic symphysis.',sys:'Reproductive System'},
  {q:'A \'bag of worms\' feeling in the scrotum that worsens with standing and heat describes which condition?',opts:['Hydrocele','Varicocele','Epididymitis','Testicular torsion'],ans:1,exp:'A varicocele (dilated pampiniform plexus veins) presents as a \'bag of worms,\' worsens with heat/prolonged standing, and is more common on the left side due to drainage angle of the left gonadal vein.',sys:'Reproductive System'},
  {q:'A hydrocele is characterized by which clinical finding?',opts:['Hard, non-tender testicular mass','Transillumination of the scrotum with a light','\'Bag of worms\' on palpation','Sudden severe testicular pain without transillumination'],ans:1,exp:'A hydrocele is a fluid collection around the testis that transilluminates (glows when a light is shone through it), distinguishing it from solid masses or varicoceles.',sys:'Reproductive System'},
  {q:'Levator ani supports pelvic organs. Weakness in this muscle during childbirth can result in:',opts:['Rectal prolapse only','Uterine prolapse','Bladder rupture','Urethral stricture'],ans:1,exp:'The levator ani (comprising pubococcygeus, iliococcygeus, puborectalis) forms the pelvic floor. Weakness can result in uterine prolapse, cystocele, rectocele, and urinary incontinence.',sys:'Reproductive System'},
  {q:'Which nerve roots are involved in the cremasteric reflex?',opts:['L1–L2','L2–L3','L3–L4','S1–S2'],ans:0,exp:'The cremasteric reflex (L1–L2) is mediated by the genitofemoral nerve. Stroking the inner thigh causes ipsilateral elevation of the testis.',sys:'Reproductive System'},
  {q:'Indirect inguinal hernias pass through which structure?',opts:['Hesselbach\'s triangle','Deep inguinal ring and inguinal canal','Femoral canal','Obturator foramen'],ans:1,exp:'Indirect inguinal hernias pass through the deep inguinal ring (lateral to inferior epigastric vessels) and travel through the inguinal canal. They follow the path of the processus vaginalis.',sys:'Reproductive System'},
  {q:'Referred pain from diaphragmatic irritation (e.g., subphrenic abscess, ectopic pregnancy rupture) is felt at which site?',opts:['Umbilicus','Ipsilateral shoulder tip (C3–C5 dermatome)','Right iliac fossa','Epigastrium'],ans:1,exp:'The diaphragm is innervated by the phrenic nerve (C3–C5). Irritation of the diaphragm (blood, pus) causes referred pain at the ipsilateral shoulder tip (C4 dermatome).',sys:'Reproductive System'},
  {q:'The pudendal nerve arises from which sacral roots?',opts:['S1–S3','S2–S4','S3–S5','L5–S2'],ans:1,exp:'The pudendal nerve arises from S2, S3, and S4 (\'S2, 3, 4 keep the penis off the floor\'). It supplies perineal muscles, external urethral sphincter, and sensation to the perineum.',sys:'Reproductive System'},
  {q:'The urogenital triangle and anal triangle of the perineum are separated by which structure?',opts:['Ischiorectal fossa','Transverse perineal muscles (superficial and deep)','A line joining the ischial tuberosities','Perineal body'],ans:2,exp:'An imaginary line connecting the two ischial tuberosities divides the diamond-shaped perineum into the anterior urogenital triangle and posterior anal triangle.',sys:'Reproductive System'},
  {q:'The internal os of the cervix is related to which uterine segment during pregnancy?',opts:['Fundus','Body','Lower uterine segment (isthmus)','Cervical canal'],ans:2,exp:'The lower uterine segment (isthmus) corresponds to the region of the internal os. It is the site of incision in Cesarean section (low transverse uterine incision).',sys:'Reproductive System'},
  {q:'The ovarian arteries arise directly from which vessel?',opts:['Internal iliac artery','Abdominal aorta (at L2 level)','Uterine artery','External iliac artery'],ans:1,exp:'The ovarian arteries are direct branches of the abdominal aorta (analogous to the testicular arteries in males), arising at approximately L2.',sys:'Reproductive System'},
  {q:'During hysterectomy, the uterine artery must be ligated, but the ureter is at risk of injury because it passes:',opts:['Superior to the uterine artery','Inferior to the uterine artery (ureter passes under the uterine artery: \'water under the bridge\')','Anterior to the cervix','Posterior to the round ligament'],ans:1,exp:'The ureter passes under (inferior to) the uterine artery at the lateral fornix of the vagina—\'water under the bridge.\' This is a critical surgical relationship to avoid ureteral ligation during hysterectomy.',sys:'Reproductive System'},
  {q:'The broad ligament of the uterus contains all of the following EXCEPT:',opts:['Round ligament of uterus','Ovarian ligament','Uterine tubes (oviducts)','Cardinal (transverse cervical) ligament'],ans:3,exp:'The broad ligament contains the uterine tubes, round ligament, ovarian ligament, and their associated vessels. The cardinal (Mackenrodt\'s) ligament is a condensation of pelvic fascia that supports the cervix, separate from the broad ligament.',sys:'Reproductive System'},
  {q:'The lymphatic drainage of the testis follows which route?',opts:['Inguinal lymph nodes','Para-aortic (lumbar) lymph nodes at L1–L2','External iliac lymph nodes','Internal iliac lymph nodes'],ans:1,exp:'The testes drain to para-aortic (lumbar) lymph nodes because the testes develop in the abdomen and descend carrying their lymphatic drainage with them. Scrotal skin drains to inguinal nodes.',sys:'Reproductive System'},
  {q:'Which structure forms the posterior boundary of the ischiorectal (ischioanal) fossa?',opts:['Pubic symphysis','Sacrotuberous ligament','Urogenital diaphragm','Obturator internus'],ans:1,exp:'The ischiorectal fossa is bounded posteriorly by the sacrotuberous ligament, medially by the levator ani, laterally by the obturator internus, and anteriorly by the urogenital diaphragm.',sys:'Reproductive System'},
  {q:'The vas deferens is ligated during which procedure, and it is a component of which structure?',opts:['Orchiectomy; inguinal canal','Vasectomy; spermatic cord','Prostatectomy; prostatic urethra','Epididymectomy; epididymis'],ans:1,exp:'The vas deferens is cut and tied during vasectomy for sterilization. It runs within the spermatic cord from the epididymis through the inguinal canal to the seminal vesicle.',sys:'Reproductive System'},
  {q:'Episiotomy is a surgical incision of the perineum during childbirth. The mediolateral episiotomy is preferred because it avoids injury to which structure?',opts:['Pudendal nerve','Urethral sphincter','External anal sphincter and anal canal','Bulbourethral glands'],ans:2,exp:'The mediolateral episiotomy angles away from the midline to avoid cutting the external anal sphincter and anal canal, reducing the risk of 3rd/4th degree perineal tears.',sys:'Reproductive System'},
  {q:'Which layer of the superficial fascia of the abdomen is fatty and continuous with the superficial fascia of the thigh?',opts:['Scarpa\'s fascia','Camper\'s fascia','External oblique aponeurosis','Transversalis fascia','Membranous layer of perineum'],ans:1,exp:'Camper\'s fascia is the fatty (superficial) layer of the superficial abdominal fascia. Scarpa\'s fascia is the deeper membranous layer, which fuses with the fascia lata of the thigh.',sys:'Reproductive System'},
  {q:'A 30-year-old man sustains a straddle injury with rupture of the urethra. Urine extravasates into the scrotum and anterior abdominal wall but NOT into the thigh. Which fascia limits this spread?',opts:['Transversalis fascia','Scarpa\'s fascia (membranous layer)','Camper\'s fascia','Colles\' fascia','Buck\'s fascia'],ans:1,exp:'Scarpa\'s fascia (membranous layer) fuses with the fascia lata of the thigh laterally, preventing urine from tracking into the thigh. Anteriorly it continues as Colles\' fascia in the perineum.',sys:'Reproductive System'},
  {q:'A 30-year-old man has a right groin swelling that descends into the scrotum and reduces with pressure. Examination shows the hernia is lateral to the inferior epigastric vessels. Which hernia type is this?',opts:['Direct inguinal hernia','Femoral hernia','Indirect inguinal hernia','Obturator hernia','Pantaloon hernia'],ans:2,exp:'An indirect inguinal hernia passes through the deep inguinal ring, lateral to the inferior epigastric vessels, and travels along the inguinal canal, often descending into the scrotum.',sys:'Reproductive System'},
  {q:'Which nerve is at risk during inguinal hernia repair and, if damaged, causes numbness over the medial thigh and scrotum/labia?',opts:['Genitofemoral nerve','Ilioinguinal nerve','Iliohypogastric nerve','Lateral femoral cutaneous nerve','Obturator nerve'],ans:1,exp:'The ilioinguinal nerve (L1) passes through the inguinal canal and exits through the superficial ring; it is at risk in inguinal herniorrhaphy and supplies the medial thigh and anterior scrotum/labia majora.',sys:'Reproductive System'},
  {q:'A 25-year-old man is found to have a left-sided varicocele. Why does this occur more commonly on the left than the right?',opts:['The left testis is positioned more inferiorly','The left gonadal vein drains at a near right angle into the left renal vein, creating greater resistance','The left inguinal canal has a wider deep ring','The left cremaster muscle has weaker fascial support','The left epididymis is larger, compressing venous return'],ans:1,exp:'The left testicular vein drains into the left renal vein at a nearly right angle (90°), creating relatively higher venous pressure and resistance to flow compared to the right, which drains obliquely into the IVC. This makes left-sided varicoceles much more common (~90% of cases).',sys:'Reproductive System'},
  {q:'A 14-year-old boy presents with sudden onset scrotal pain and high-riding testis. The cremasteric reflex is absent. What is the most likely diagnosis?',opts:['Epididymo-orchitis','Inguinal hernia','Testicular torsion','Hydrocele','Varicocele'],ans:2,exp:'Testicular torsion presents with sudden severe scrotal pain, high-riding testis (shortening of spermatic cord), and absent cremasteric reflex. The bell-clapper deformity (horizontal lie of testis) predisposes to torsion. This is a surgical emergency.',sys:'Reproductive System'},
  {q:'The cremasteric reflex is mediated by which nerve and spinal levels?',opts:['Ilioinguinal nerve, L1','Genitofemoral nerve (genital branch), L1–L2','Pudendal nerve, S2–S4','Obturator nerve, L2–L4','Femoral nerve, L2–L4'],ans:1,exp:'The cremasteric reflex: afferent limb = femoral branch of genitofemoral nerve (L1–L2) — inner thigh stimulus; efferent limb = genital branch of genitofemoral nerve — cremasteric muscle contraction lifting the testis. Absent in testicular torsion.',sys:'Reproductive System'},
  {q:'Lymphatic drainage of the testis goes to which lymph nodes (NOT the inguinal nodes)?',opts:['Superficial inguinal nodes','Deep inguinal nodes','Para-aortic (lumbar) nodes at L1–L2','External iliac nodes','Internal iliac nodes'],ans:2,exp:'The testis drains lymphatically to the para-aortic (lumbar) nodes at L1–L2 (following the gonadal vessels to their origin near the aorta). The scrotum drains to the superficial inguinal nodes. This distinction is critical in testicular cancer staging.',sys:'Reproductive System'},
  {q:'Lymphatic drainage of the scrotum goes to which lymph nodes?',opts:['Para-aortic nodes','Superficial inguinal nodes','Deep inguinal nodes','External iliac nodes','Internal iliac nodes'],ans:1,exp:'The scrotum (as skin of the perineum) drains to the superficial inguinal lymph nodes. This is distinct from the testis itself (para-aortic nodes), an important distinction for cancer spread.',sys:'Reproductive System'},
  {q:'A 60-year-old woman undergoes vaginal hysterectomy. Postoperatively, she develops anuria and loin pain. Which structure was most likely inadvertently ligated?',opts:['Urinary bladder neck','Ureter, as it passes beneath the uterine artery lateral to the cervix','Ovarian artery at the infundibulopelvic ligament','Internal iliac artery','Pudendal nerve in Alcock\'s canal'],ans:1,exp:'The ureter is at high risk during hysterectomy because it passes 1–2 cm lateral to the uterine cervix and then travels under the uterine artery (\'water under the bridge\' / ureter under artery). The ureter can be ligated or kinked inadvertently.',sys:'Reproductive System'},
  {q:'The anteverted position of the uterus means the uterus is tilted forward. Which organ lies immediately anterior to the anteverted uterus?',opts:['Rectum','Sigmoid colon','Urinary bladder','Vagina','Small bowel'],ans:2,exp:'In anteversion (the normal position), the uterus tilts anteriorly over the bladder. The bladder lies immediately anterior to the uterus and cervix. This makes the bladder vulnerable in uterine surgery and explains urinary symptoms in uterine pathology.',sys:'Reproductive System'},
  {q:'The perineal body (central tendon of the perineum) is a fibromuscular node at the center of the perineum. Which muscles attach to it?',opts:['Puborectalis only','External anal sphincter, bulbospongiosus, superficial and deep transverse perineal muscles, and external urethral sphincter','Levator ani and coccygeus only','Gluteus maximus and piriformis','Ischiocavernosus and obturator internus'],ans:1,exp:'The perineal body is the convergence point of the external anal sphincter, bulbospongiosus (both sides), superficial and deep transverse perineal muscles, and external urethral sphincter. It is the anchor of the pelvic floor, and its injury (obstetric tear) leads to incontinence and prolapse.',sys:'Reproductive System'},
  {q:'A woman has a 3rd degree obstetric laceration. Which specific structure is torn that leads to fecal incontinence?',opts:['Levator ani','Perineal body','External anal sphincter','Puborectalis sling','Internal anal sphincter'],ans:2,exp:'A 3rd degree obstetric tear involves the external anal sphincter (and in 4th degree, the rectal mucosa as well). Injury to the external anal sphincter causes fecal incontinence. The internal sphincter provides resting tone; the external provides voluntary control.',sys:'Reproductive System'},
  {q:'Bartholin\'s glands (greater vestibular glands) are located where in the female perineum?',opts:['Anterior to the clitoris','Within the labia minora','Posterolateral to the vaginal orifice, at the 4 and 8 o\'clock positions','Adjacent to the urethral meatus','Within the mons pubis'],ans:2,exp:'Bartholin\'s glands (greater vestibular glands) are located posterolateral to the vaginal introitus (at approximately 4 and 8 o\'clock positions). Their ducts open into the groove between the hymen and labia minora. Obstruction causes a Bartholin\'s cyst or abscess.',sys:'Reproductive System'},
  {q:'A 30-year-old woman has a tender fluctuant swelling at the posterolateral vaginal introitus. What is the most likely diagnosis?',opts:['Skene\'s gland cyst','Bartholin\'s gland abscess','Vaginal hematoma','Labial cyst','Vulvar fibroma'],ans:1,exp:'A Bartholin\'s gland abscess presents as a tender, fluctuant, unilateral swelling at the posterolateral vaginal introitus (4 or 8 o\'clock position). It results from obstruction of the duct with secondary infection. Treatment is incision, drainage, and marsupialization.',sys:'Reproductive System'},
  {q:'The three ureteric constrictions where calculi commonly become lodged are located at which sites?',opts:['Renal pelvis, pelvic brim, ureterovesical junction','Pelviureteric junction (PUJ), pelvic brim (crossing iliac vessels), and ureterovesical junction (UVJ)','Renal calyx, ureter midpoint, and bladder','Kidney hilum, mid-ureter, and urethra','UPJ, crossing of the vas deferens, and bladder'],ans:1,exp:'The three ureteric constrictions: (1) Pelviureteric junction (PUJ) — where the renal pelvis narrows; (2) Pelvic brim — where ureter crosses the iliac vessels; (3) Ureterovesical junction (UVJ) — narrowest point, as ureter enters the bladder obliquely. Most stones lodge at the UVJ.',sys:'Reproductive System'},
  {q:'Which structure prevents prolapse of the uterus and is described as \'the most important structural support of the uterus\'?',opts:['Round ligament','Broad ligament','Transverse cervical (cardinal / Mackenrodt\'s) ligament','Uterosacral ligament','Pubovesical ligament'],ans:2,exp:'The transverse cervical (cardinal / Mackenrodt\'s) ligament is the most important structural support of the uterus and cervix, running from the cervix and vaginal vault to the pelvic sidewall. The uterosacral ligaments also contribute significantly.',sys:'Reproductive System'},
  {q:'A post-menopausal woman has uterine prolapse and stress urinary incontinence. Which muscle forms the \'hammock\' floor of the pelvis most responsible for organ support?',opts:['Piriformis','Obturator internus','Levator ani (puborectalis, pubococcygeus, iliococcygeus)','External anal sphincter','Coccygeus'],ans:2,exp:'The levator ani (composed of puborectalis, pubococcygeus, and iliococcygeus) forms the primary muscular floor of the pelvis, supporting the pelvic organs. Its injury or weakening (childbirth, aging) leads to pelvic organ prolapse.',sys:'Reproductive System'},
  {q:'A resident asks: \'Where exactly does the ureter relate to the uterine artery in the pelvis?\' Which statement correctly describes this relationship?',opts:['The uterine artery crosses inferior to the ureter at the level of the internal os','The ureter passes deep to the uterine artery approximately 1–2 cm lateral to the cervix','The ureter travels anterior to the uterine artery throughout the pelvis','The uterine artery crosses the ureter at the level of the uterosacral ligament','The ureter lies medial to the uterine artery along its entire pelvic course'],ans:1,exp:'The uterine artery crosses the ureter from lateral to medial, passing superior to the ureter approximately 1–2 cm lateral to the cervix (\'water under the bridge\' — the ureter is the water, the uterine artery is the bridge). This is the most common site of ureteral injury in hysterectomy.',sys:'Reproductive System'},
  {q:'The pudendal nerve leaves and re-enters the pelvis through two different foramina. Which path does it follow?',opts:['Exits via the obturator foramen; re-enters via the lesser sciatic foramen','Exits via the lesser sciatic foramen; travels to the perineum without re-entering','Exits via the greater sciatic foramen; re-enters via the lesser sciatic foramen through Alcock\'s canal','Exits and re-enters exclusively via the greater sciatic foramen','Travels entirely within the pelvis without exiting'],ans:2,exp:'The pudendal nerve exits the pelvis via the greater sciatic foramen (below piriformis), wraps around the ischial spine and sacrospinous ligament, and re-enters via the lesser sciatic foramen into the pudendal (Alcock\'s) canal in the lateral wall of the ischiorectal fossa.',sys:'Reproductive System'},
  {q:'Which structure forms the posterior boundary of the rectouterine pouch (pouch of Douglas) — the lowest point of the peritoneal cavity in females?',opts:['Sacrum and uterosacral ligaments','Posterior vaginal fornix and rectum','Broad ligament','Uterus','Sigmoid colon'],ans:1,exp:'The rectouterine pouch (pouch of Douglas) is bounded anteriorly by the uterus and posteriorly by the rectum, with the posterior vaginal fornix at its most inferior aspect. It is the lowest peritoneal recess in females and collects fluid/blood in pathological states.',sys:'Reproductive System'},
  {q:'A 28-year-old woman has a ruptured ectopic pregnancy. Where would blood most likely pool on clinical examination?',opts:['Vesicouterine pouch','Rectouterine pouch (cul-de-sac of Douglas)','Paracolic gutter','Subphrenic space','Hepatorenal pouch'],ans:1,exp:'The rectouterine pouch (pouch of Douglas) is the most dependent part of the peritoneal cavity in an erect female. Blood from a ruptured ectopic pregnancy pools here, detectable by posterior vaginal fornix fullness or culdocentesis.',sys:'Reproductive System'},
  {q:'The prostate gland is palpated through the anterior rectal wall. Which zone is most commonly affected by benign prostatic hyperplasia (BPH)?',opts:['Peripheral zone','Central zone','Transitional zone (periurethral)','Fibromuscular stroma','Anterior zone'],ans:2,exp:'BPH most commonly affects the transitional zone (periurethral/central zone) of the prostate, causing urethral compression and obstructive lower urinary tract symptoms. Prostate cancer most commonly arises from the peripheral zone.',sys:'Reproductive System'},
  {q:'A 40-year-old marathon runner has meralgia paresthetica causing burning pain and numbness over the anterior-lateral thigh. Which nerve is compressed?',opts:['Femoral nerve','Lateral femoral cutaneous nerve','Genitofemoral nerve','Obturator nerve','Saphenous nerve'],ans:1,exp:'Meralgia paresthetica is compression of the lateral femoral cutaneous nerve (L2–L3) as it passes under or through the inguinal ligament near the ASIS, causing burning paresthesias over the anterolateral thigh. Common in obese patients, pregnant women, and those wearing tight belts.',sys:'Reproductive System'},
  {q:'Which of the following is considered the route of early metastasis of carcinomas such as prostate cancer to the spine?',opts:['External iliac vein','Internal iliac vein','Internal vertebral venous plexus','All of the above'],ans:2,exp:'The internal vertebral venous plexus is considered the route of early metastasis to the spine and CNS for carcinomas such as lung cancer, breast cancer, and prostate cancer.',sys:'Reproductive System'},
  {q:'The lymphatic drainage of the upper part of the vagina goes into the',opts:['Superficial inguinal nodes','Internal iliac nodes','Deep inguinal nodes','Para-aortic lymph nodes'],ans:1,exp:'The lymphatic drainage of the upper part of the vagina goes into the internal iliac nodes. The lower portion drains into the superficial inguinal nodes.',sys:'Reproductive System'},
  {q:'The lymphatic drainage of the testes goes into the',opts:['Superficial inguinal nodes','Internal iliac nodes','Deep inguinal nodes','Para-aortic lymph nodes'],ans:3,exp:'The lymphatic drainage of the testes/ovaries/uterine fundus goes into the para-aortic lymph nodes.',sys:'Reproductive System'},
  {q:'A patient comes in with signs and symptoms consistent with an infected Bartholin cyst. Which of the following lymph nodes would most likely get swollen?',opts:['Superficial inguinal nodes','Internal iliac nodes','Deep inguinal nodes','Para-aortic lymph nodes'],ans:0,exp:'The lymphatic drainage of the labia majora (where the Bartholin glands are located) is through the superficial inguinal lymph nodes.',sys:'Reproductive System'},
  {q:'A male patient comes to the ER for a straddle injury. On examination, there\'s a note of scrotal hematoma. Which part of the urethra is most likely injured?',opts:['Prostatic urethra','Membranous urethra','Spongy urethra','Any of the above'],ans:2,exp:'Injury to the spongy urethra can occur in a perineal straddle injury. This may manifest as a scrotal hematoma.',sys:'Reproductive System'},
  {q:'The medial breast is supplied by the internal thoracic artery. This artery comes from branches from the',opts:['Subclavian','Costocervical','Vertebral','Thyrocervical'],ans:0,exp:'The internal thoracic artery comes from the subclavian artery.',sys:'Reproductive System'},
  {q:'Which of the following is NOT true of indirect inguinal hernias?',opts:['Goes through deep inguinal ring','Goes through superficial inguinal ring','Descends into the scrotum','Occurs medial to the inferior epigastric vessels'],ans:3,exp:'Indirect inguinal hernias occur LATERAL to the inferior epigastric vessels. Direct hernias occur medial.',sys:'Reproductive System'},
  {q:'Which of the following layers of the spermatic cord is incorrectly paired?',opts:['External spermatic fascia: external oblique muscle','Cremasteric fascia: Internal oblique muscle','Internal spermatic fascia: transversalis fascia','Internal spermatic fascia: Internal oblique muscle'],ans:3,exp:'Internal spermatic fascia arises from the transversalis fascia, not the internal oblique.',sys:'Reproductive System'},
  {q:'Which of the following is the longest and widest part of the uterine tubes?',opts:['Infundibulum','Ampulla','Isthmus','Fimbriae'],ans:1,exp:'The ampulla is the widest and longest part of the uterine tubes, and the most common site of fertilization.',sys:'Reproductive System'},
  {q:'Prostate cancer develops in which zone of the prostate gland?',opts:['Transitional zone','Anterior zone','Central zone','Peripheral zone'],ans:3,exp:'Prostate cancer typically develops in the peripheral zone of the prostate gland.',sys:'Reproductive System'},
  {q:'Breast cancer commonly occurs in which quadrant of the breast?',opts:['Upper lateral','Lower lateral','Upper medial','Lower medial'],ans:0,exp:'Breast cancer occurs most commonly in the upper lateral quadrant.',sys:'Reproductive System'},
  {q:'The finding of skin dimpling in patients with breast cancer is due to involvement of which of the following?',opts:['Subcutaneous lymphatics','Suspensory ligament of Cooper','Sentinel nodes','All of the above'],ans:1,exp:'Skin dimpling is due to cancer involvement of the suspensory ligament of Cooper.',sys:'Reproductive System'},
  {q:'The left testicular vein drains into which of the following?',opts:['Inferior vena cava','Right renal vein','Left renal vein','Left internal iliac artery'],ans:2,exp:'The left testicular vein drains into the left renal vein, whereas the right drains directly into the IVC.',sys:'Reproductive System'},
  {q:'Incomplete closure of the processus vaginalis can give rise to which of the following?',opts:['Varicocele','Hydrocele','Spermatocele','Any of the above'],ans:1,exp:'Incomplete closure of the processus vaginalis can give rise to a congenital hydrocele.',sys:'Reproductive System'},
  {q:'The levator ani muscle consists of the following, EXCEPT?',opts:['Puborectalis','Pubococcygeus','Iliococcygeus','Coccygeus'],ans:3,exp:'The coccygeus is not part of the levator ani. The levator ani includes the puborectalis, pubococcygeus, and iliococcygeus.',sys:'Reproductive System'},
  {q:'During hysterectomy, the ligation of which of the following ligaments may result in ureteral injury?',opts:['Infundibulopelvic ligament','Ovarian ligament','Cardinal ligament','Broad ligament'],ans:2,exp:'Ligation of the cardinal ligament (which contains the uterine vessels) may result in ureteral injury.',sys:'Reproductive System'},
  {q:'Which of the following ligaments connects the uterine horn to the labia via the inguinal canal?',opts:['Infundibulopelvic ligament','Ovarian ligament','Round ligament','Uterosacral ligament'],ans:2,exp:'The round ligament connects the uterine horn to the labia majora via the inguinal canal.',sys:'Reproductive System'},
  {q:'Which of the following is homologous to the scrotum?',opts:['Labia minora','Labia majora','Clitoris','Pudendal nerve'],ans:1,exp:'The labia majora is homologous to the scrotum.',sys:'Reproductive System'},
  {q:'The anatomical snuffbox is clinically important because a fracture in this region involves which bone?',opts:['Lunate','Scaphoid','Trapezium','Capitate'],ans:1,exp:'The scaphoid lies at the floor of the anatomical snuffbox. Scaphoid fractures present with snuffbox tenderness. The radial artery also traverses the snuffbox.',sys:'Musculoskeletal System'},
  {q:'Which artery can be palpated in the floor of the anatomical snuffbox?',opts:['Ulnar artery','Brachial artery','Radial artery','Anterior interosseous artery'],ans:2,exp:'The radial artery runs through the anatomical snuffbox before entering the palm to form the deep palmar arch.',sys:'Musculoskeletal System'},
  {q:'A patient cannot flex the forearm against resistance when the forearm is fully supinated. Which muscle is MOST likely injured?',opts:['Brachialis','Brachioradialis','Biceps brachii','Coracobrachialis'],ans:2,exp:'The biceps brachii is the primary flexor and supinator of the forearm. It is most powerful when the forearm is already supinated.',sys:'Musculoskeletal System'},
  {q:'When the forearm is in a neutral (mid-prone) position, which muscle is the MOST efficient forearm flexor?',opts:['Biceps brachii','Brachialis','Brachioradialis','Pronator teres'],ans:2,exp:'The brachioradialis is the most efficient flexor when the forearm is in the neutral (mid-prone) position, as it gains the best mechanical advantage.',sys:'Musculoskeletal System'},
  {q:'Which muscle is the primary flexor of the forearm regardless of position?',opts:['Biceps brachii','Brachioradialis','Brachialis','Coracobrachialis'],ans:2,exp:'The brachialis is the workhorse flexor of the forearm; it acts in all forearm positions because it inserts on the ulna (not the radius), so rotation does not alter its pull.',sys:'Musculoskeletal System'},
  {q:'Abduction of the arm from 15° to 90° is primarily performed by which muscle?',opts:['Supraspinatus','Deltoid','Infraspinatus','Teres minor'],ans:1,exp:'The deltoid is responsible for abduction from approximately 15° to 90°. The supraspinatus initiates and assists in the first 15° of abduction.',sys:'Musculoskeletal System'},
  {q:'Which muscle initiates the first 15° of shoulder abduction?',opts:['Deltoid','Supraspinatus','Infraspinatus','Subscapularis'],ans:1,exp:'The supraspinatus initiates abduction of the arm for the first 0–15°. Beyond that, the deltoid takes over as the primary abductor.',sys:'Musculoskeletal System'},
  {q:'A patient has winging of the scapula and is unable to fully abduct the arm. Which nerve is most likely injured?',opts:['Suprascapular nerve','Dorsal scapular nerve','Long thoracic nerve','Thoracodorsal nerve'],ans:2,exp:'The long thoracic nerve innervates the serratus anterior. Injury causes winging of the scapula and difficulty fully abducting the arm above 90°.',sys:'Musculoskeletal System'},
  {q:'The rotator cuff is composed of which four muscles?',opts:['Subscapularis, supraspinatus, infraspinatus, teres major','Subscapularis, supraspinatus, infraspinatus, teres minor','Deltoid, supraspinatus, infraspinatus, teres minor','Subscapularis, deltoid, infraspinatus, teres major'],ans:1,exp:'The rotator cuff = SITS: Subscapularis, Infraspinatus, Teres minor, Supraspinatus.',sys:'Musculoskeletal System'},
  {q:'Which muscle is responsible for medial rotation and adduction of the arm at the glenohumeral joint?',opts:['Infraspinatus','Teres minor','Subscapularis','Supraspinatus'],ans:2,exp:'Subscapularis is the only rotator cuff muscle that medially (internally) rotates the arm. It also adducts the arm.',sys:'Musculoskeletal System'},
  {q:'A patient cannot supinate the forearm against resistance. The most likely muscle injured is:',opts:['Pronator teres','Biceps brachii','Brachioradialis','Extensor carpi radialis'],ans:1,exp:'The biceps brachii is the most powerful supinator of the forearm, especially when the elbow is flexed.',sys:'Musculoskeletal System'},
  {q:'The cephalic vein typically drains into which vessel?',opts:['Axillary vein','Brachial vein','Subclavian vein','Basilic vein'],ans:0,exp:'The cephalic vein runs along the lateral aspect of the arm and drains into the axillary vein in the deltopectoral groove.',sys:'Musculoskeletal System'},
  {q:'Which muscle forms the floor of the cubital fossa?',opts:['Biceps brachii','Brachioradialis','Brachialis','Pronator teres'],ans:2,exp:'The brachialis forms the floor of the cubital fossa. The roof is formed by the bicipital aponeurosis and deep fascia.',sys:'Musculoskeletal System'},
  {q:'Which muscle is the key landmark separating the axillary artery into three parts?',opts:['Pectoralis major','Pectoralis minor','Coracobrachialis','Subclavius'],ans:1,exp:'Pectoralis minor divides the axillary artery into three parts: Part 1 (medial), Part 2 (posterior), and Part 3 (lateral to pec minor).',sys:'Musculoskeletal System'},
  {q:'Which ROTATOR CUFF muscle is most commonly torn?',opts:['Subscapularis','Infraspinatus','Supraspinatus','Teres minor'],ans:2,exp:'The supraspinatus is the most commonly torn rotator cuff muscle, often injured during overhead activities or falls on an outstretched hand.',sys:'Musculoskeletal System'},
  {q:'The femoral triangle borders include all of the following EXCEPT:',opts:['Inguinal ligament (superiorly)','Sartorius (laterally)','Adductor longus (medially)','Gracilis (floor)'],ans:3,exp:'The floor of the femoral triangle is formed by iliopsoas (laterally) and pectineus (medially), not the gracilis.',sys:'Musculoskeletal System'},
  {q:'Which structure is most medial in the femoral triangle (using the mnemonic NAVEL from lateral to medial)?',opts:['Femoral nerve','Femoral artery','Femoral vein','Lymphatics'],ans:3,exp:'From lateral to medial in the femoral triangle: Nerve, Artery, Vein, Empty space, Lymphatics (NAVEL).',sys:'Musculoskeletal System'},
  {q:'Which ligament of the knee prevents anterior displacement of the tibia on the femur?',opts:['Posterior cruciate ligament','Medial collateral ligament','Anterior cruciate ligament','Lateral collateral ligament'],ans:2,exp:'The anterior cruciate ligament (ACL) prevents anterior translation of the tibia on the femur and is tested by the anterior drawer test.',sys:'Musculoskeletal System'},
  {q:'The great saphenous vein drains into which vessel?',opts:['External iliac vein','Femoral vein','Popliteal vein','Profunda femoris vein'],ans:1,exp:'The great saphenous vein, the longest vein in the body, drains into the femoral vein at the saphenous opening in the femoral triangle.',sys:'Musculoskeletal System'},
  {q:'Unhappy triad of the knee involves injury to which three structures?',opts:['ACL, PCL, medial meniscus','ACL, medial collateral ligament, medial meniscus','ACL, lateral collateral ligament, lateral meniscus','PCL, medial collateral ligament, medial meniscus'],ans:1,exp:'The unhappy triad (O\'Donoghue triad) involves ACL, medial collateral ligament (MCL), and medial meniscus—typically from a lateral blow to the knee (valgus stress).',sys:'Musculoskeletal System'},
  {q:'Which compartment of the leg is affected in anterior compartment syndrome?',opts:['Posterior compartment—gastrocnemius and soleus','Anterior compartment—dorsiflexors','Lateral compartment—evertors','Deep posterior compartment—tibialis posterior'],ans:1,exp:'Anterior compartment syndrome affects the dorsiflexors (tibialis anterior, extensor digitorum, extensor hallucis longus) and is a surgical emergency requiring fasciotomy.',sys:'Musculoskeletal System'},
  {q:'The tendon of which muscle inserts into the iliotibial (IT) band and is commonly inflamed in runners?',opts:['Gluteus maximus','Tensor fasciae latae','Sartorius','Rectus femoris'],ans:1,exp:'The tensor fasciae latae (TFL) inserts into the iliotibial band. IT band syndrome is common in runners and cyclists.',sys:'Musculoskeletal System'},
  {q:'Which muscle is responsible for \'unlocking\' the knee from full extension?',opts:['Semimembranosus','Popliteus','Biceps femoris','Plantaris'],ans:1,exp:'The popliteus unlocks the knee from full extension by laterally rotating the femur on the fixed tibia, allowing flexion to begin.',sys:'Musculoskeletal System'},
  {q:'The pes anserinus (goose\'s foot) is formed by the tendons of which three muscles?',opts:['Sartorius, gracilis, semitendinosus','Sartorius, biceps femoris, rectus femoris','Gracilis, semimembranosus, sartorius','Semitendinosus, semimembranosus, biceps femoris'],ans:0,exp:'The pes anserinus is formed by Sartorius, Gracilis, and Semitendinosus (SGS or \'Say Grace before Tea\'). They insert on the anteromedial proximal tibia.',sys:'Musculoskeletal System'},
  {q:'The primary curvatures of the spine (present at birth) are in which regions?',opts:['Cervical and lumbar (lordosis)','Thoracic and sacral (kyphosis)','Lumbar and cervical (kyphosis)','Thoracic only'],ans:1,exp:'Thoracic kyphosis and sacral kyphosis are primary curvatures present at birth (concave anteriorly). Cervical and lumbar lordoses are secondary compensatory curvatures that develop after birth.',sys:'Musculoskeletal System'},
  {q:'Which ligament is most commonly involved in causing lumbar spinal stenosis?',opts:['Anterior longitudinal ligament','Posterior longitudinal ligament','Ligamentum flavum','Supraspinous ligament'],ans:2,exp:'The ligamentum flavum connects adjacent laminae and can hypertrophy with age, narrowing the spinal canal and causing lumbar stenosis (neurogenic claudication).',sys:'Musculoskeletal System'},
  {q:'The erector spinae group includes which muscles?',opts:['Iliocostalis, longissimus, spinalis','Semispinalis, multifidus, rotatores','Quadratus lumborum, psoas major, iliacus','Latissimus dorsi, rhomboids, trapezius'],ans:0,exp:'The erector spinae (sacrospinalis) group consists of (lateral to medial): Iliocostalis, Longissimus, and Spinalis.',sys:'Musculoskeletal System'},
  {q:'Which vertebra has a distinctive dens (odontoid process)?',opts:['C1 (atlas)','C2 (axis)','C3','C7'],ans:1,exp:'C2 (axis) has the dens (odontoid process), which projects superiorly into the ring of C1 (atlas) and acts as a pivot for rotation.',sys:'Musculoskeletal System'},
  {q:'Jefferson fracture involves which vertebra?',opts:['C2 (axis)','C1 (atlas)','C5','C7'],ans:1,exp:'Jefferson fracture is a burst fracture of C1 (atlas) typically caused by axial loading (e.g., diving into shallow water). It fractures in multiple places and may be unstable.',sys:'Musculoskeletal System'},
  {q:'Scoliosis is defined as a lateral curvature of the spine. The most common type is:',opts:['Congenital (vertebral anomaly)','Neuromuscular','Idiopathic (adolescent)','Degenerative'],ans:2,exp:'Adolescent idiopathic scoliosis is the most common form (~80% of cases). It typically presents in girls during the pubertal growth spurt.',sys:'Musculoskeletal System'},
  {q:'Facet joints of the spine are classified as which type of joint?',opts:['Fibrous synarthroses','Cartilaginous symphyses','Synovial plane (gliding) joints','Condyloid joints'],ans:2,exp:'Zygapophyseal (facet) joints are synovial plane joints. They allow gliding movement and can be a source of axial back pain.',sys:'Musculoskeletal System'},
  {q:'Dorsal rami of spinal nerves innervate which structures?',opts:['Anterior abdominal wall and limb muscles','Intrinsic back muscles and skin over the back','Intercostal muscles and lateral chest wall','Diaphragm and pericardium'],ans:1,exp:'Dorsal rami innervate the intrinsic (deep) back muscles (erector spinae, multifidus, etc.) and the overlying skin. Ventral rami form the major plexuses and intercostal nerves.',sys:'Musculoskeletal System'},
  {q:'The psoas major muscle originates from which vertebrae?',opts:['T10–L2','T12–L5','L1–L4','L2–S1'],ans:1,exp:'The psoas major arises from the lateral aspects of T12–L5 vertebral bodies and intervertebral discs, then runs with the iliacus (iliopsoas) to insert on the lesser trochanter of the femur.',sys:'Musculoskeletal System'},
  {q:'The mid-inguinal point (midpoint of inguinal ligament) overlies which vessel, and is used to locate femoral arterial pulsation?',opts:['Femoral vein','Femoral artery','External iliac artery','Deep circumflex iliac artery'],ans:1,exp:'The femoral artery is found at the mid-inguinal point (halfway between ASIS and pubic symphysis). This is distinct from the midpoint of the inguinal ligament (used for internal ring).',sys:'Musculoskeletal System'},
  {q:'Which is the CORRECT interpretation of a positive Lachman test?',opts:['Increased anterior tibial translation at 30° flexion → ACL injury','Posterior tibial displacement → PCL injury','Pain with valgus stress → MCL injury','Pain with varus stress → LCL injury'],ans:0,exp:'The Lachman test is performed at 30° of knee flexion. Increased anterior tibial translation indicates an ACL tear. It is more sensitive than the anterior drawer test for acute ACL injury.',sys:'Musculoskeletal System'},
  {q:'The \'neutral position\' or \'position of safety\' of the hand (for splinting) is:',opts:['Wrist extended, MCP joints extended, IPs extended','Wrist slightly extended, MCP joints at 70–90°, IP joints extended, thumb abducted','Wrist flexed, MCP joints flexed, IPs flexed','Wrist neutral, all joints extended'],ans:1,exp:'The safe (intrinsic plus) position for hand splinting: wrist extended 30°, MCPs at 70–90° (collateral ligaments at maximum length), IPs extended, thumb abducted. This prevents contracture of collateral ligaments.',sys:'Musculoskeletal System'},
  {q:'Finkelstein\'s test is used to diagnose which condition?',opts:['Carpal tunnel syndrome','Trigger thumb','De Quervain\'s tenosynovitis','Gamekeeper\'s thumb'],ans:2,exp:'Finkelstein\'s test: patient clasps thumb in fist, examiner ulnar-deviates the wrist. Pain over the radial styloid indicates De Quervain\'s tenosynovitis (inflammation of APL and EPB tendons in the 1st extensor compartment).',sys:'Musculoskeletal System'},
  {q:'Which of the following abdominal muscles has its fibers running in a horizontal (transverse) direction?',opts:['External oblique','Internal oblique','Transversus abdominis','Rectus abdominis','Pyramidalis'],ans:2,exp:'Transversus abdominis has its fibers running transversely (horizontally), forming the innermost of the three flat abdominal muscles.',sys:'Musculoskeletal System'},
  {q:'A 25-year-old man has a rotator cuff tear confirmed on MRI, involving the tendon most commonly torn. Which muscle is most commonly injured?',opts:['Subscapularis','Infraspinatus','Supraspinatus','Teres minor','Teres major'],ans:2,exp:'The supraspinatus tendon is by far the most commonly torn rotator cuff muscle, due to its passage under the coracoacromial arch and its relatively poor blood supply at the \'critical zone\' near its insertion.',sys:'Musculoskeletal System'},
  {q:'A 35-year-old man has forearm compartment syndrome after a crush injury. Which four compartments of the forearm exist?',opts:['Anterior, posterior, radial, ulnar','Flexor, extensor, lateral (mobile wad), and dorsal','Anterior (deep and superficial), posterior, and lateral (mobile wad)','Medial, lateral, anterior, posterior','Radial, ulnar, interosseous, and posterior'],ans:2,exp:'The forearm has three compartments: anterior (subdivided into superficial and deep), posterior, and the lateral (mobile wad — brachioradialis, ECRL, ECRB). Some classify 4 compartments by separating the superficial and deep anterior.',sys:'Musculoskeletal System'},
  {q:'Which artery is the sole blood supply to the avascular scaphoid waist (making fractures prone to avascular necrosis)?',opts:['Radial artery dorsal branch entering distally','Anterior interosseous artery','Palmar arch','Ulnar artery','Dorsal carpal branch of the ulnar artery'],ans:0,exp:'The scaphoid receives its blood supply from the radial artery via branches entering its distal pole. The proximal pole has NO direct blood supply — fractures through the waist disrupt this retrograde supply, leading to avascular necrosis of the proximal fragment.',sys:'Musculoskeletal System'},
  {q:'The \'anatomical snuffbox\' contains which artery as it crosses the scaphoid?',opts:['Ulnar artery','Anterior interosseous artery','Radial artery','Posterior interosseous artery','Deep palmar arch'],ans:2,exp:'The radial artery passes through the anatomical snuffbox (between extensor pollicis longus and extensor pollicis brevis/abductor pollicis longus tendons), crossing the scaphoid bone — making the snuffbox tender in scaphoid fractures and the radial pulse palpable here.',sys:'Musculoskeletal System'},
  {q:'The ankle ligament most commonly sprained in an inversion injury is which?',opts:['Deltoid (medial collateral) ligament','Calcaneofibular ligament','Anterior tibiofibular ligament','Anterior talofibular ligament (ATFL)','Posterior talofibular ligament'],ans:3,exp:'The anterior talofibular ligament (ATFL) is the weakest and most commonly injured ankle ligament in inversion sprains. The calcaneal fibular ligament (CFL) is the second most commonly injured. The strong deltoid ligament resists eversion.',sys:'Musculoskeletal System'},
  {q:'A 50-year-old man has a femoral neck fracture with avascular necrosis of the femoral head. Why is the femoral head particularly vulnerable?',opts:['It is supplied entirely by the obturator artery','The main blood supply (medial femoral circumflex artery) is disrupted by femoral neck fractures, as it runs in the retinacular vessels','The lateral femoral circumflex artery is easily torn','The ligamentum teres artery (obturator) is the only supply','It has poor collateral circulation from the profunda femoris'],ans:1,exp:'The femoral head is supplied mainly by the medial femoral circumflex artery via retinacular branches along the femoral neck. Femoral neck fractures disrupt these vessels, causing avascular necrosis of the femoral head. The ligamentum teres artery (from obturator) is insufficient alone.',sys:'Musculoskeletal System'},
  {q:'The femoral triangle is bounded by which structures, and which important structures pass through it?',opts:['Sartorius, adductor longus, inguinal ligament; contains femoral nerve, artery, vein, lymphatics (NAVY lateral to medial)','Rectus femoris, adductor longus, iliac crest; contains sciatic nerve','Sartorius, biceps femoris, inguinal ligament; contains obturator nerve','Iliotibial band, adductor longus, femoral artery','Pectineus, iliacus, inguinal ligament; contains femoral vein only'],ans:0,exp:'Femoral triangle: lateral border = sartorius; medial border = adductor longus; superior border = inguinal ligament. Contents (lateral to medial): femoral Nerve, femoral Artery, femoral Vein, lymphatics (empty space), lymph nodes — mnemonic NAVY.',sys:'Musculoskeletal System'},
  {q:'Which of the following shoulder muscles is responsible for the initial abduction of the arm before the action of the deltoid?',opts:['Supraspinatus','Infraspinatus','Teres minor','Subscapularis'],ans:0,exp:'Supraspinatus is responsible for the initial abduction of the arm before the action of the deltoid.',sys:'Musculoskeletal System'},
  {q:'Which of the following rotator cuff muscles is most commonly injured?',opts:['Supraspinatus','Infraspinatus','Teres minor','Subscapularis'],ans:0,exp:'Supraspinatus is the most commonly injured rotator cuff muscle.',sys:'Musculoskeletal System'},
  {q:'Which of the following ligaments in most commonly injured in ankle sprains?',opts:['Anterior talofibular ligament','Posterior talofibular ligament','Posterior inferior tibiofibular ligament','Anterior inferior tibiofibular ligament'],ans:0,exp:'Anterior talofibular ligament is the most commonly injured ligament in ankle sprains.',sys:'Musculoskeletal System'},
  {q:'The inguinal ligament is in what dermatomal level?',opts:['T10','T11','T12','L1'],ans:3,exp:'L1 dermatomal level corresponds to the inguinal ligament. T10 is the umbilicus.',sys:'Musculoskeletal System'},
  {q:'What is the most commonly fractured carpal bone?',opts:['Scaphoid','Lunate','Pisiform','Hamate'],ans:0,exp:'The scaphoid is the most commonly fractured carpal bone.',sys:'Musculoskeletal System'},
  {q:'Which of the following is NOT part of the borders of the anatomic snuffbox?',opts:['Extensor pollicis longus','Extensor pollicis brevis','Abductor pollicis longus','Abductor pollicis brevis'],ans:3,exp:'The abductor pollicis brevis is not a border. The borders are Extensor pollicis longus, Extensor pollicis brevis, and Abductor pollicis longus.',sys:'Musculoskeletal System'},
  {q:'A patient was brought to ER after a fall on an outstretched hand. Her right hand shows a dinner fork deformity. Which of the following is the most likely diagnosis?',opts:['Colles fracture','Smith fracture','Reverse Colles fracture','None of the above'],ans:0,exp:'A dinner fork deformity is characteristic of a Colles fracture, where the distal fragment is displaced posteriorly.',sys:'Musculoskeletal System'},
  {q:'Nonunion is a common complication in proximal scaphoid fractures. The blood supply to this bone comes from which of the following?',opts:['Radial artery','Ulnar artery','Brachial artery','Any of the above'],ans:0,exp:'Proximal scaphoid fractures are prone to nonunion because of the retrograde blood supply from a branch of the radial artery.',sys:'Musculoskeletal System'},
  {q:'Tennis elbow results from inflammation of the',opts:['Origin of the extensor forearm muscles','Origin of the flexor forearm muscles','Subluxation of the radial head','Subluxation of the ulnar head'],ans:0,exp:'Tennis elbow results from inflammation of the origin of the extensor forearm muscles.',sys:'Musculoskeletal System'},
  {q:'In the femoral triangle which of the following is found lateral to the femoral vein?',opts:['Femoral artery','Femoral nerve','Lymph nodes','Inguinal ligament'],ans:0,exp:'The structures in the femoral triangle, from lateral to medial, are NAVEL: Nerve, Artery, Vein, Empty space, Lymphatics.',sys:'Musculoskeletal System'},
  {q:'What is the remnant of the embryonic notochord?',opts:['Umbilical ligament','Ligamentum venosum','Nucleus pulposus','1st cervical vertebra'],ans:2,exp:'The remnant of the embryonic notochord is the nucleus pulposus of the intervertebral disc.',sys:'Musculoskeletal System'},
  {q:'A 35-year-old construction worker falls and fractures the surgical neck of the humerus. Which nerve is MOST likely injured?',opts:['Radial nerve','Axillary nerve','Musculocutaneous nerve','Median nerve'],ans:1,exp:'The axillary nerve winds around the surgical neck of the humerus and is vulnerable to injury with surgical neck fractures.',sys:'Nervous System'},
  {q:'A patient presents with wrist drop (inability to extend the wrist) following a mid-shaft humeral fracture. Which nerve is damaged?',opts:['Axillary nerve','Ulnar nerve','Radial nerve','Median nerve'],ans:2,exp:'The radial nerve runs in the radial groove (spiral groove) at the mid-shaft of the humerus and is damaged by mid-shaft fractures, causing wrist drop.',sys:'Nervous System'},
  {q:'A patient with a compressed median nerve presents with numbness of which fingers?',opts:['Medial 1½ fingers','Lateral 3½ fingers','All five fingers','Middle 3 fingers only'],ans:1,exp:'The median nerve provides sensation to the lateral 3½ fingers (thumb, index, middle, and lateral half of ring finger).',sys:'Nervous System'},
  {q:'Compression of the median nerve at the wrist (carpal tunnel syndrome) causes weakness in which movement?',opts:['Wrist flexion','Finger abduction','Thumb opposition','Wrist extension'],ans:2,exp:'The median nerve innervates the thenar muscles (LOAF muscles), including the opponens pollicis responsible for thumb opposition.',sys:'Nervous System'},
  {q:'A carpenter is hit in the medial elbow and develops sensory loss over the medial 1½ fingers and weakness in finger adduction. Which nerve is involved?',opts:['Median nerve','Radial nerve','Ulnar nerve','Musculocutaneous nerve'],ans:2,exp:'The ulnar nerve runs behind the medial epicondyle (\'funny bone\'). Injury causes sensory loss in medial 1½ fingers and weakness of intrinsic hand muscles.',sys:'Nervous System'},
  {q:'A fracture at the neck of the radius most likely injures which nerve?',opts:['Median nerve','Radial nerve proper','Posterior interosseous nerve','Anterior interosseous nerve'],ans:2,exp:'The posterior interosseous nerve (deep branch of the radial nerve) winds around the neck of the radius and can be damaged by fractures at this site.',sys:'Nervous System'},
  {q:'Erb\'s palsy results from injury to which nerve roots?',opts:['C8–T1','C5–C6','C6–C7','C7–C8'],ans:1,exp:'Erb\'s palsy involves the upper trunk of the brachial plexus (C5–C6), causing the characteristic \'waiter\'s tip\' posture: adduction, medial rotation, and extended elbow.',sys:'Nervous System'},
  {q:'Klumpke\'s palsy involves injury to which nerve roots?',opts:['C5–C6','C6–C7','C7–C8','C8–T1'],ans:3,exp:'Klumpke\'s palsy involves the lower trunk (C8–T1), causing intrinsic hand muscle weakness, claw hand, and potential Horner\'s syndrome if T1 is involved.',sys:'Nervous System'},
  {q:'The carpal tunnel transmits all of the following EXCEPT:',opts:['Median nerve','Flexor digitorum superficialis tendons','Flexor digitorum profundus tendons','Ulnar nerve'],ans:3,exp:'The carpal tunnel contains the median nerve and nine flexor tendons. The ulnar nerve passes through Guyon\'s canal, lateral to the carpal tunnel.',sys:'Nervous System'},
  {q:'A patient presents with numbness in the radial 3½ digits and thenar atrophy after repetitive wrist use. Tinel\'s test is positive at the wrist. What is the diagnosis?',opts:['Ulnar nerve entrapment at the elbow','Carpal tunnel syndrome','Thoracic outlet syndrome','Cubital tunnel syndrome'],ans:1,exp:'Carpal tunnel syndrome results from median nerve compression at the carpal tunnel. Classic findings include numbness in radial 3½ digits, thenar atrophy, and a positive Tinel\'s sign at the wrist.',sys:'Nervous System'},
  {q:'The axillary nerve innervates all of the following EXCEPT:',opts:['Deltoid','Teres minor','Teres major','Skin over the deltoid (badge area)'],ans:2,exp:'The axillary nerve innervates the deltoid and teres minor, and provides sensation to the \'regimental badge\' area. Teres major is innervated by the lower subscapular nerve.',sys:'Nervous System'},
  {q:'Which nerve is responsible for pronation of the forearm?',opts:['Radial nerve','Ulnar nerve','Median nerve','Musculocutaneous nerve'],ans:2,exp:'The median nerve innervates both pronator muscles (pronator teres and pronator quadratus), which are responsible for forearm pronation.',sys:'Nervous System'},
  {q:'A patient suffers a fractured clavicle at the junction of its middle and lateral thirds. Which structure is most at risk?',opts:['Axillary artery','Subclavian artery','Brachial plexus','Subclavian vein'],ans:2,exp:'The brachial plexus lies directly posterior and inferior to the clavicle. Fractures at the classic site (middle third) can injure the brachial plexus or subclavian vessels.',sys:'Nervous System'},
  {q:'The mnemonic \'MBA\' describes the contents of the cubital fossa from medial to lateral. What does each letter represent?',opts:['Median nerve, Brachial artery, Biceps tendon','Musculocutaneous nerve, Basilic vein, Anterior interosseous nerve','Median nerve, Basilic vein, Axillary nerve','Musculocutaneous nerve, Brachial artery, Biceps tendon'],ans:0,exp:'From medial to lateral in the cubital fossa: Median nerve, Brachial Artery, Biceps tendon (and the radial nerve/posterior interosseous nerve deeper/laterally).',sys:'Nervous System'},
  {q:'The ulnar nerve enters the hand via which canal?',opts:['Carpal tunnel','Cubital tunnel','Guyon\'s canal','Adductor canal'],ans:2,exp:'The ulnar nerve and ulnar artery enter the hand through Guyon\'s canal (ulnar canal), located medial to the carpal tunnel at the wrist.',sys:'Nervous System'},
  {q:'A patient stands on one leg and the pelvis drops to the unsupported side. Which nerve is injured?',opts:['Inferior gluteal nerve','Superior gluteal nerve','Femoral nerve','Obturator nerve'],ans:1,exp:'A positive Trendelenburg sign indicates weakness of the hip abductors (gluteus medius and minimus), which are innervated by the superior gluteal nerve.',sys:'Nervous System'},
  {q:'A patient cannot plantarflex the foot after trauma to the posterior leg. Which nerve is most likely damaged?',opts:['Common peroneal nerve','Superficial peroneal nerve','Tibial nerve','Deep peroneal nerve'],ans:2,exp:'The tibial nerve innervates the posterior compartment of the leg, including gastrocnemius and soleus. Damage causes inability to plantarflex the foot.',sys:'Nervous System'},
  {q:'Injury to the common peroneal nerve at the fibular head results in which clinical finding?',opts:['Foot drop and loss of dorsiflexion','Inability to plantarflex','Loss of knee extension','Inability to abduct the thigh'],ans:0,exp:'The common peroneal nerve winds around the head of the fibula and innervates the anterior and lateral leg compartments. Injury causes foot drop and loss of dorsiflexion/eversion.',sys:'Nervous System'},
